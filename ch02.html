# 第二章 均匀传输线理论

## 本章考点地图

本章是全课程**分值最高、贯穿全部后续章节**的一章。第三章的波导、第四章的微波元件、第五章的网络参数、第六章的匹配与器件，全部建立在"均匀传输线"这套语言之上。它的地位可以这样概括：**低频电路理论在这一章"失效"，微波工程的分析范式在这一章"建立"。**

本章的考试形态非常固定，主要可归为九类：

| 考点 | 常见设问 | 题型 | 难度 |
|---|---|---|---|
| 长线判据与分布参数 | 给定 $l$ 与 $f$，判断是长线还是短线；$R,L,C,G$ 的物理来源 | 简答/计算 | ★★ |
| 电报方程与相量法 | 写出时域方程并说明物理含义；为什么可以用相量法 | 简答/推导 | ★★★ |
| 特性阻抗 $Z_0$ | 定义（入射波电压电流之比）、三种情形、为什么是 50 Ω/75 Ω | 填空/简答 | ★★★ |
| 传播常数与相速 | $\alpha$、$\beta$、$v_p$、$\lambda$ 的表达式；色散的含义 | 填空/计算 | ★★ |
| 状态参量 | 输入阻抗、反射系数、驻波比三者的互算 | 计算 | ★★★★ |
| 三种工作状态 | 行波/驻波/行驻波的判据、波形、波腹波节位置 | 计算＋作图 | ★★★★★ |
| 传输功率与效率 | $P(z)$、$\eta$、回波损耗、插入损耗、dBm | 计算 | ★★★ |
| 史密斯圆图 | 由 $Z$ 求 $Y$、由 $Z_l$ 求 $Z_{\mathrm{in}}$、由 $\rho$ 与 $z_{\min}$ 反求 $Z_l$ | 计算＋作图 | ★★★★★ |
| 阻抗匹配 | 三种匹配状态；$\lambda/4$ 变换器；单枝节 $l_1$、$l_2$ | 计算＋设计 | ★★★★★ |

> **【核心概念】**
> 本章只有**一条主线**和**三个参量**。
> 一条主线：**微波在传输线上以"波"的形式存在**——电压和电流不再由基尔霍夫定律唯一确定，而是"入射波 + 反射波"的叠加，因此它们**既与时间有关、又与位置有关**。
> 三个参量：**工作特性参数**（特性阻抗 $Z_0$、传播常数 $\gamma=\alpha+j\beta$、相速 $v_p$ 与波长 $\lambda$，由传输线本身与频率决定，与负载无关）；**状态参量**（输入阻抗 $Z_{\mathrm{in}}(z)$、反射系数 $\Gamma(z)$、驻波比 $\rho$，随负载与位置变化）；**功率与损耗**（传输功率、效率、回波损耗）。
> 全部计算题都可以归结为一句话：**由 $Z_l$ 与 $Z_0$ 求出 $\Gamma_l$，再由 $\Gamma_l$ 沿 $\lambda/2$ 周期旋转得到任意点的 $\Gamma(z)$，最后在 $Z_{\mathrm{in}}$、$\Gamma$、$\rho$ 之间来回换算。**

---

## 2.1 引言：微波传输线

### 2.1.1 微波传输线的定义：信息与能量两条主线

**微波传输线（microwave transmission line）**是"传输微波**信息**和**能量**的不同类型传输系统的总称"。这个定义里有两个关键词：

- **不同类型**：同轴线、平行双导线、微带线、带状线、共面波导、金属波导、介质波导、光纤……形态千差万别，但在本章的"路"的层次上，它们可以用**同一组方程**描述；
- **信息和能量**：这是微波技术的两条主线，前者决定"传得对不对、快不快"，后者决定"传得多不多、省不省"。

**第一条主线：信息。** 信息的传输靠**把信息调制到载波上**。模拟调制有调幅（AM）、调频（FM）、调相（PM）；数字调制有幅移键控（ASK）、频移键控（FSK）、相移键控（PSK）。调制方式无论如何演进，都改变不了一个基本事实：

> **【核心概念】**
> 载波频率越高，可用的**绝对带宽**越宽，能够承载的信息速率就越高。这就是为什么移动通信每一代都在向更高的频率迁移。

各代移动通信的速率对比，是理解"频率—速率"关系最直观的材料：

| 代际 | 多址方式 | 典型制式 | 峰值速率量级 | 特征 |
|---|---|---|---|---|
| 1G | FDMA（频分多址） | 模拟语音（AMPS、TACS） | $\approx10\ \mathrm{kbps}$ | 模拟调频，只能通话 |
| 2G | TDMA（时分多址）/ CDMA | GSM、IS-95 | $\approx64\ \mathrm{kbps}$ | 数字化，语音＋短信 |
| 3G | CDMA（码分多址） | CDMA2000（北美）、WCDMA（欧洲/日本）、TD-SCDMA（中国移动） | $\approx2\ \mathrm{Mbps}$ | 移动多媒体 |
| 4G | OFDMA（正交频分多址） | LTE、LTE-A | $\approx100\ \mathrm{Mbps}$ | 全 IP、移动互联网 |
| 5G | OFDMA + NOMA | NR（新空口） | $>10\ \mathrm{Gbps}$（峰值） | 大规模 MIMO、毫米波、网络切片 |
| 6G | 待定义 | 万物互联 | — | 空天地一体化、通信感知一体化 |

从 $10\ \mathrm{kbps}$ 到 $10\ \mathrm{Gbps}$，速率提高了 $10^{6}$ 倍，而载波频率也从 $900\ \mathrm{MHz}$ 附近提升到毫米波频段。我国的移动通信产业走过了"**3G 跟跑、4G 并跑、5G 领跑**"的历程，而 5G 的领跑正是建立在毫米波、大规模 MIMO、微波器件与传输线设计的全面突破之上的——本章讨论的传输线，就是这一切的物理底座。

**第二条主线：能量。** 微波"有源，但离开源之后与源无关"，因此它**携带能量**。能量与功率的关系是

$$
E=P\cdot T
\tag{2-1-1}
$$

其中 $E$ 为能量（单位 $\mathrm{J}$），$P$ 为功率（单位 $\mathrm{W}$），$T$ 为时间（单位 $\mathrm{s}$）。量纲检查：$[\mathrm{W\cdot s}]=[\mathrm{J}]$，自洽。这个式子说明：**要传输同样的能量，功率越大则时间越短，功率越小则时间越长**——这正是雷达（瞬时大功率、极短时间）与无线充电（小功率、长时间）两种应用的分野。

与能量相关的三个当代议题：

1. **能量效率**。绿色通信、碳达峰碳中和（"双碳"）目标下，衡量系统的核心指标之一是
   $$
   \text{能量效率}=\frac{\text{传输速率}}{\text{消耗功率}}\quad(\mathrm{bit/J})
   \tag{2-1-2}
   $$
   它把"信息"与"能量"两条主线统一成一个指标：既要传得快（分子大），又要省电（分母小）。
2. **能量收集（energy harvesting）**。把环境中的风能、光能、机械动能转换为电能，为传感器、物联网节点供电。
3. **无线能量传输（wireless power transfer）**。手机无线充电、心脏起搏器无线供电、电动汽车动态充电、无人机与地面节点之间的能量补给，都依赖微波/近场耦合的功率传输技术——而这些系统的效率，最终要用本章 2.5 节的**传输功率与传输效率**来刻画。

### 2.1.2 为什么必须"引导"：全向辐射不可控

**问题：为什么不能像广播那样直接把微波辐射出去，而要造一根传输线？**

答案在"方向性"三个字上。天线辐射的波是**全向的**（或至少是发散的）：一个理想点源辐射的功率分布在 $4\pi$ 立体角上。如果我们希望把 $1\ \mathrm{W}$ 的功率送到几米外的负载上，全向辐射意味着绝大部分功率散失到空间中，同时还会干扰其他系统。

> **【核心概念】**
> **微波传输线的本质作用是"引导"**：把电磁能量约束在一个横截面远小于波长的"管道"内，让它**定向地**从信源流向负载，而不是向四周发散。

因此，微波传输线要解决的核心工程问题不是"能不能传"，而是"**如何控制方向、控制模式、控制反射**"。

### 2.1.3 为什么不能用普通铜导线：趋肤效应

既然要"引导"，最直接的想法是用两根铜导线拉开架在空中传输——这正是电力线的做法。但在微波频段，这个方案会失败。

> **【思考】**
> 为什么微波频段不能用普通铜导线传输，而必须使用专门设计的传输线结构？

**先看数据。** 一根半径 $r_0=2\ \mathrm{mm}$、长 $l=1\ \mathrm{m}$ 的铜导线（$\rho=1.72\times10^{-8}\ \Omega\cdot\mathrm{m}$）：

- **低频（直流）**：电流均匀分布在横截面上，单位长度电阻
  $$
  R_0=\frac{\rho}{\pi r_0^{2}}=\frac{1.72\times10^{-8}}{\pi\times(2\times10^{-3})^{2}}\approx1.37\times10^{-3}\ \Omega/\mathrm{m}
  \tag{2-1-3}
  $$
- **$f=10\ \mathrm{GHz}$**：电流被挤压到表面极薄的一层里，单位长度电阻 $R_0\approx2.07\ \Omega/\mathrm{m}$。

两者之比约为 $1.5\times10^{3}$，即**损耗增大了一千多倍**。一条 $1\ \mathrm{m}$ 长的导线，在 $10\ \mathrm{GHz}$ 上就要白白损失掉相当可观的功率——这在工程上是不可接受的。

**根源是趋肤效应（skin effect）**。频率升高时，导体内部的交变磁场在导体内部感应出涡旋电场，抵消了中心区域的电流、强化了表面附近的电流，最终电流只集中在表面厚度为**趋肤深度 $\delta$** 的薄层内：

$$
\delta=\frac{1}{\sqrt{\pi f\mu\sigma}}=\sqrt{\frac{2}{\omega\mu\sigma}}=\sqrt{\frac{\rho}{\pi f\mu}}
\tag{2-1-4}
$$

其中 $\sigma$ 为电导率（$\mathrm{S/m}$），$\mu$ 为磁导率（$\mathrm{H/m}$），$\rho=1/\sigma$ 为电阻率（$\Omega\cdot\mathrm{m}$）。量纲检查：$[\rho/(f\mu)]=\dfrac{\Omega\cdot\mathrm{m}}{\mathrm{s^{-1}\cdot H/m}}=\mathrm{m^{2}}$，开方后为 $\mathrm{m}$，自洽。

代入铜的数据（$\sigma=5.8\times10^{7}\ \mathrm{S/m}$，$\mu=\mu_0=4\pi\times10^{-7}\ \mathrm{H/m}$）：

| 频率 | 趋肤深度 $\delta$ | 说明 |
|---|---|---|
| $50\ \mathrm{Hz}$ | $\approx9.3\ \mathrm{mm}$ | 比导线半径还大，电流几乎均匀分布 |
| $10\ \mathrm{GHz}$ | $\approx0.66\ \mathrm{\mu m}$ | 只有半径的万分之三，电流挤在极薄表层 |

当 $\delta\ll r_0$ 时，有效导电截面约为 $2\pi r_0\delta$，于是

$$
R_0=\frac{1}{2\pi r_0}\sqrt{\pi f\mu\rho}\ \propto\ \sqrt{f}
\tag{2-1-5}
$$

把 $f=10\ \mathrm{GHz}$、$r_0=2\ \mathrm{mm}$ 代入，得 $R_0\approx2.07\ \Omega/\mathrm{m}$，与前面的数据完全吻合。这条 $\sqrt{f}$ 规律是微波工程中反复出现的"代价公式"：**频率每提高 100 倍，导体单位长度电阻提高 10 倍**。

> **【易错点】**
> 有同学由此得出"微波频段不能用金属"的结论——这是错的。导体之所以不行，不是因为金属变成了坏导体，而是因为**导体内部的电流被挤到表面、有效截面急剧缩小**。换句话说：**金属的电导率没变，变的是电流能用的面积**。微波传输线表面要镀银、镀金并抛光到表面粗糙度远小于 $\delta$，正是这个道理。

### 2.1.4 一个必须正面回答的问题：为什么传输线还是金属做的

> **【思考】**
> 既然金属导体因为趋肤效应不适合传输微波，为什么均匀传输线、金属波导等等还都是用金属做的？

这是本章最容易被"想歪"的一个点，答案是：

> **【核心概念】**
> **微波不在导体内部传输，而是在导体所包围的介质（空气或填充介质）中传输。** 金属的作用只有两条：**引导**电磁波沿指定方向传播，**约束**电磁场不向外泄漏。金属是"边界"，不是"通道"。

具体地：

- **同轴线**：电磁波在内外导体之间的介质中传播，导体表面电流只是"边界条件"的产物；
- **金属波导**：电磁波在金属管内腔的空气/介质中传播，管壁的作用是把场"关"在里面；
- **微带线**：电磁波主要在导体带与接地板之间的介质基片中传播。

因此，导体损耗虽然随 $\sqrt{f}$ 上升，但它只是一个**次要的、可以通过选择结构形式（把场更多地放在介质里）与表面处理来降低的因素**；而如果不用金属，我们连"方向"都无法控制。

> **【工程应用】**
> 这也解释了为什么频率越高，传输结构越倾向于"**场在介质里**"：低频用同轴线（TEM 波，场在介质中但导体损耗明显），高频用金属波导（场大部分在空气中，导体损耗最小但体积大），再高用介质波导、光纤（场几乎全在介质中）。第六章与第三章会分别展开这两条技术路线。

### 2.1.5 本节考点清单

> **【考点】**
> - **题型**：简答题（为什么用传输线、为什么不用铜导线、金属起什么作用）、填空题（$R,L,C,G$ 的单位与物理来源）、计算题（趋肤深度与单位长度电阻）。
> - **常见设问**：①"微波传输线的定义包含哪两个层面？"②"$10\ \mathrm{GHz}$ 时铜的趋肤深度是多少？与 $50\ \mathrm{Hz}$ 相比相差多少倍？"③"金属在微波传输中起什么作用？"
> - **易错点**：①把"导体损耗大"答成"金属不导电了"；②把传输线说成"在金属里传波"；③忘记 $\delta\propto1/\sqrt{f}$ 的平方根规律。
> - **难度**：★★

## 2.2 均匀传输线方程及其解

### 2.2.1 长线效应与分布参数

#### （1）一段必须知道的历史

**开尔文爵士（Lord Kelvin，1824—1907）**是热力学的奠基人之一，绝对温标"开氏温度"以他命名。他 21 岁从剑桥大学毕业，22 岁成为教授——但他在微波技术史上留下的名字，来自一次工程失败。

1856 年，**大西洋海底电报电缆**铺设完成，却在传输高速电报信号时出现严重问题：信号畸变、速率上不去。开尔文投入十年努力，终于在 1866 年使跨大西洋电报电缆成功运行。在这个过程中人们认识到：**当电缆长度与信号波长可比拟时，导线不能再看作一根"等电位的理想连接"，而必须考虑沿线电压、电流的波动**。描述这一现象的方程被称为**电报方程（telegraph equations）**，对应的物理效应称为**长线效应**。

#### （2）什么是长线效应

> **【核心概念】**
> **长线（long line）**：线长 $l$ 与工作波长 $\lambda$ **可比拟**的传输线；此时沿线各点的电压、电流**不再是同一时刻的同一个值**，必须用分布参数与波动的方法处理。
> **短线（short line）**：线长远小于波长（$l\ll\lambda$），沿线电压、电流近似处处相同，集总参数电路理论仍然适用。

两个数值例子：

| 情形 | 线长 $l$ | 频率 $f$ | 波长 $\lambda$ | $l/\lambda$ | 结论 |
|---|---|---|---|---|---|
| 同轴线 | $0.5\ \mathrm{m}$ | $5\ \mathrm{GHz}$ | $c/f=6\ \mathrm{cm}$ | $\approx8.3$ | $\lambda\ll l$：**长线** |
| 电力传输线 | $0.5\ \mathrm{m}$ | $50\ \mathrm{Hz}$ | $c/f=6000\ \mathrm{km}$ | $\approx8\times10^{-8}$ | $\lambda\gg l$：**短线** |

注意：**"长线/短线"是电学概念，不是几何概念**。同一根 $0.5\ \mathrm{m}$ 的导线，在 $5\ \mathrm{GHz}$ 上是"长线"，在 $50\ \mathrm{Hz}$ 上是"短线"。工程上通常取

$$
l\ \gtrsim\ \frac{\lambda}{10}
\tag{2-2-1}
$$

作为"必须按长线处理"的经验判据：此时沿线的最大相位差已达到约 $36^{\circ}$，集总参数模型的误差不可忽略。

#### （3）从频率到分布参数的因果链

整个 2.1、2.2 节的逻辑可以压缩成一条因果链：

$$
f\uparrow\ \Longrightarrow\ \lambda\downarrow\ \Longrightarrow\ \text{趋肤效应}\ \Longrightarrow\ \text{长线}\ \Longrightarrow\ \text{长线效应}\ \Longrightarrow\ \text{分布参数电路}
$$

物理上，频率升高带来两个后果：一是**电流向外表面集中**（趋肤效应），二是**导线周围出现显著的辐射与位移电流**，于是沿着线的每一个极小段落上，都同时存在电阻、电感、电容、电导的效应。我们把它们"摊到单位长度上"，就得到四个**分布参数（distributed parameters）**：

| 参数 | 名称 | 单位 | 物理来源 | 作用 |
|---|---|---|---|---|
| $R$ | 单位长度电阻 | $\Omega/\mathrm{m}$ | 导体电导率有限 | 导体损耗（发热） |
| $L$ | 单位长度电感 | $\mathrm{H/m}$ | 导体周围磁场 | 磁场储能 |
| $C$ | 单位长度电容 | $\mathrm{F/m}$ | 两导体之间电场 | 电场储能 |
| $G$ | 单位长度电导 | $\mathrm{S/m}$ | 填充介质不理想 | 介质损耗（发热） |

> **【易错点】**
> $R$ 与 $G$ 对应**损耗**（把电磁能量变成热），$L$ 与 $C$ 对应**储能**（不消耗能量，只交换能量）。这是后面判断"驻波状态无功率传输"的关键：纯电抗负载只储能不耗能。另外 $G$ 的单位是 $\mathrm{S/m}$ 而不是 $\Omega/\mathrm{m}$，它与 $R$ 是"对偶"关系（串联的损耗 vs 并联的损耗）。

### 2.2.2 电报方程的推导

> **【思考】**
> 为什么低频的基尔霍夫定律在微波频段"失效"？失效之后我们用什么代替它？

答案不是"抛弃基尔霍夫定律"，而是**把定律用在无穷小的线元上，然后取极限**。这就是"从整体到局部"的思想。

#### （1）取线元，建等效电路

在线上取一小段 $\Delta z\ll\lambda$ 的线元。因为 $\Delta z$ 远小于波长，这一小段内部的电压、电流在**同一时刻**近似均匀，可以当作**集总参数电路**处理：串联臂上挂 $R\Delta z$ 与 $L\Delta z$，并联臂上挂 $G\Delta z$ 与 $C\Delta z$。

#### （2）由基尔霍夫定律列式并取极限

沿线的电压变化来自串联臂上的压降，电流变化来自并联臂上的分流：

$$
\begin{cases}
u(z+\Delta z,t)-u(z,t)=-R\Delta z\,i(z,t)-L\Delta z\dfrac{\partial i(z,t)}{\partial t}\\[2mm]
i(z+\Delta z,t)-i(z,t)=-G\Delta z\,u(z+\Delta z,t)-C\Delta z\dfrac{\partial u(z+\Delta z,t)}{\partial t}
\end{cases}
$$

两边同除以 $\Delta z$，并令 $\Delta z\to0$（此时差商成为偏导数，$u(z+\Delta z,t)\to u(z,t)$），得到**均匀传输线方程的时域微分形式**：

$$
\frac{\partial u(z,t)}{\partial z}=-Ri(z,t)-L\frac{\partial i(z,t)}{\partial t},
\qquad
\frac{\partial i(z,t)}{\partial z}=-Gu(z,t)-C\frac{\partial u(z,t)}{\partial t}
\tag{2-2-2}
$$

**这两个方程的物理含义**：

> **【核心概念】**
> - 第一式：**单位长度上的电压变化，等于单位长度 $R$ 上的电压变化与单位长度 $L$ 上的电压变化之和**（串联臂吃掉电压）；
> - 第二式：**单位长度上的电流变化，等于单位长度 $G$ 上的电流变化与单位长度 $C$ 上的电流变化之和**（并联臂分掉电流）。
> 两式中的负号表示"沿 $+z$ 方向，电压与电流都在减小"。

**量纲检查**：$[\partial u/\partial z]=\mathrm{V/m}$，$[Ri]=\Omega/\mathrm{m}\cdot\mathrm{A}=\mathrm{V/m}$ ✓；$[Gu]=\mathrm{S/m}\cdot\mathrm{V}=\mathrm{A/m}=[\partial i/\partial z]$ ✓。量纲自洽说明推导没有遗漏系数。

### 2.2.3 相量法：把微积分方程变成复代数方程

时域方程里既有空间导数又有时间导数，直接求解很麻烦。我们"不喜欢微分"，于是用**相量法（phasor method）**把时间导数消掉。

设 $x(t)=A\cos(\omega t+\varphi)=\mathrm{Re}\!\left[Ae^{j\varphi}e^{j\omega t}\right]$，定义**相量**为

$$
\dot X=Ae^{j\varphi}
\tag{2-2-3}
$$

它只携带**幅度与初相角**两个信息，"$\omega$"被约定在 $e^{j\omega t}$ 中隐去了。对时间求导：

$$
\frac{dx(t)}{dt}=\mathrm{Re}\!\left[\dot X\frac{d}{dt}e^{j\omega t}\right]=\mathrm{Re}\!\left[j\omega \dot X e^{j\omega t}\right]
\quad\Longleftrightarrow\quad
\frac{dx(t)}{dt}\ \Leftrightarrow\ j\omega \dot X
\tag{2-2-4}
$$

> **【记忆技巧】**
> 相量法的全部魔法就是一句话：**时域求导 $\Leftrightarrow$ 相量域乘 $j\omega$**。它把微分方程降为代数方程，把积分方程也降为代数方程。请务必记住这句提醒：**虽然表面上没有 $\omega$，但心中始终牢记 $\omega$**——$\omega$ 藏在 $j\omega L$、$j\omega C$ 里，最后一定要"还"回去（把相量结果写成时域瞬时值时必须带上 $e^{j\omega t}$）。

令 $u(z,t)=\mathrm{Re}[U(z)e^{j\omega t}]$、$i(z,t)=\mathrm{Re}[I(z)e^{j\omega t}]$，代入式 (2-2-2)，消去公共因子 $e^{j\omega t}$，得到**均匀传输线方程的相量形式**：

$$
\frac{dU(z)}{dz}=-(R+j\omega L)I(z)=-ZI(z),
\qquad
\frac{dI(z)}{dz}=-(G+j\omega C)U(z)=-YU(z)
\tag{2-2-5}
$$

其中

$$
Z=R+j\omega L\ \ (\text{单位长度串联阻抗},\ \Omega/\mathrm{m}),
\qquad
Y=G+j\omega C\ \ (\text{单位长度并联导纳},\ \mathrm{S/m})
\tag{2-2-6}
$$

> **【核心概念】**
> 相量形式的微波传输线中，$U$ 与 $I$ **不仅与 $t$ 有关（通过 $e^{j\omega t}$），还与 $z$ 有关**。这就是**波动性**的来源：$U(z)$ 是复函数，它的幅度与相位都随位置变化，沿线各点的电压"各不相同、各有相位"。
> 而式 (2-2-5) 也回答了 2.1 节的疑问：**金属导体不适合传输微波（趋肤效应），为什么均匀传输线、波导还都是金属做的？——因为微波不在导体中传输，而在导体所包围的介质中传输，金属只提供边界与引导。**

### 2.2.4 通解、传播常数与特性阻抗

#### （1）消元得到二阶方程

将式 (2-2-5) 的第一式两边对 $z$ 求导，再代入第二式：

$$
\frac{d^{2}U(z)}{dz^{2}}=-Z\frac{dI(z)}{dz}=ZY\,U(z)
$$

同理对 $I$ 操作。于是得到一对**二阶常微分方程**：

$$
\frac{d^{2}U(z)}{dz^{2}}-\gamma^{2}U(z)=0,
\qquad
\frac{d^{2}I(z)}{dz^{2}}-\gamma^{2}I(z)=0
\tag{2-2-7}
$$

其中定义了**传播常数（propagation constant）**

$$
\gamma=\sqrt{ZY}=\sqrt{(R+j\omega L)(G+j\omega C)}=\alpha+j\beta
\tag{2-2-8}
$$

- $\alpha$：**衰减常数**，单位 $\mathrm{Np/m}$（奈培每米）或 $\mathrm{dB/m}$，描述波沿传播方向幅度按 $e^{-\alpha z}$ 衰减；
- $\beta$：**相移常数**，单位 $\mathrm{rad/m}$，描述波沿传播方向相位的变化。

> **【易错点】**
> $\gamma$ 是"复数开方"的结果，$\alpha$ 与 $\beta$ 都是正数（或零），**不存在 $\gamma=\alpha+j\beta$ 中 $\beta$ 取负号的物理情形**——方向问题由 $e^{\pm\gamma z}$ 的符号承担，不由 $\beta$ 的符号承担。

#### （2）通解与坐标约定（务必先读这一段）

二阶方程的通解是两个指数函数的线性组合。**在写出通解之前，必须先声明坐标方向与时间约定**，否则后面所有的 $\pm j\beta z$ 都会打架。

> **【核心概念】**
> **本书统一采用如下约定**：
> 1. **时间约定**：取 $e^{j\omega t}$（即 $u(z,t)=\mathrm{Re}[U(z)e^{j\omega t}]$）。
> 2. **坐标约定**：取**负载为坐标原点**，$z$ 轴**由负载指向信源**，即 $z$ 是"从负载向信源量得的距离"；$z=0$ 在负载端，$z=l$ 在信源（输入端）。
> 在这个约定下，**入射波沿 $-z$ 方向传播**（从信源流向负载），**反射波沿 $+z$ 方向传播**。于是通解写为
> $$U(z)=A_1e^{\gamma z}+A_2e^{-\gamma z},\qquad
> I(z)=\frac{1}{Z_0}\left(A_1e^{\gamma z}-A_2e^{-\gamma z}\right)
> \tag{2-2-9}$$
> 其中 $A_1e^{\gamma z}$ 是**入射波** $U^{+}(z)$，$A_2e^{-\gamma z}$ 是**反射波** $U^{-}(z)$，即 $U(z)=U^{+}(z)+U^{-}(z)$。

**为什么入射波带 $e^{+\gamma z}$？** 用**等相面法**验证。令 $A_1=|A_1|e^{j\theta_1}$，则入射波的瞬时值为

$$
u^{+}(z,t)=\mathrm{Re}\!\left[|A_1|e^{\alpha z}e^{j(\beta z+\theta_1)}e^{j\omega t}\right]
=|A_1|e^{\alpha z}\cos(\omega t+\beta z+\theta_1)
$$

**等相面**（相位为常数的面）满足

$$
\omega t+\beta z+\theta_1=\text{const}
\quad\Longrightarrow\quad
z=\frac{\text{const}-\theta_1-\omega t}{\beta}
\quad\Longrightarrow\quad
v_p=\frac{dz}{dt}=-\frac{\omega}{\beta}<0
$$

$v_p<0$ 说明入射波沿 $-z$ 方向运动，即**从信源（$z=l$）流向负载（$z=0$）**，与约定完全一致。同理，反射波 $u^{-}(z,t)=|A_2|e^{-\alpha z}\cos(\omega t-\beta z+\theta_2)$ 的等相面给出 $v_p=+\omega/\beta>0$，沿 $+z$ 方向从负载流向信源，确实是被反射回去的波。

**关于坐标方向的说明（重要）**：不同的教材可能取相反的 $z$ 轴（以信源为原点、指向负载），此时通解写成 $U(z)=A_1e^{-\gamma z}+A_2e^{\gamma z}$，相应地把反射系数写成 $\Gamma(z)=\Gamma_le^{+j2\beta z}$。**两套写法只是"从哪头量距离"的差别，物理结论（$Z_{\mathrm{in}}$、$\rho$、$|\Gamma|$、$v_p$）完全相同**。请读者在解题时**先声明自己的约定，然后全程一致**。本书为了与史密斯圆图"顺时针向信源"的标准用法一致，统一采用上述 $z$ 由负载指向信源的约定。

#### （3）由通解求电流，定义特性阻抗

把 $U(z)=A_1e^{\gamma z}+A_2e^{-\gamma z}$ 代入式 (2-2-5) 的第一式：

$$
I(z)=-\frac{1}{Z}\frac{dU(z)}{dz}=-\frac{\gamma}{Z}\left(A_1e^{\gamma z}-A_2e^{-\gamma z}\right)
=\frac{1}{Z_0}\left(A_1e^{\gamma z}-A_2e^{-\gamma z}\right)
$$

其中

$$
Z_0=\frac{Z}{\gamma}=\frac{Z}{\sqrt{ZY}}=\sqrt{\frac{Z}{Y}}
=\sqrt{\frac{R+j\omega L}{G+j\omega C}}
\tag{2-2-10}
$$

称为**特性阻抗（characteristic impedance）**。它也可以由"入射波电压与入射波电流之比"定义：

$$
Z_0=\frac{U^{+}(z)}{I^{+}(z)}=\frac{A_1e^{\gamma z}}{\dfrac{A_1}{Z_0}e^{\gamma z}}=Z_0,
\qquad
Z_0=\frac{U^{-}(z)}{-I^{-}(z)}
\tag{2-2-11}
$$

（注意反射波电流带负号，这是由式 (2-2-9) 中 $-A_2e^{-\gamma z}$ 决定的：反射波的电压与电流反相。）

**量纲与意义**：$[Z/Y]=[\Omega/\mathrm{m}\cdot\mathrm{m}/\mathrm{S}]=\Omega^{2}$，开方为 $\Omega$，自洽。**$Z_0$ 与 $z$ 无关**，只由 $R,L,C,G$ 与 $\omega$ 决定，因此被称为传输线的**固有参数**。

#### （4）写成时域瞬时值

设 $A_1=|A_1|e^{j\theta_1}$、$A_2=|A_2|e^{j\theta_2}$、$Z_0=|Z_0|e^{j\varphi_0}$，把相量结果乘 $e^{j\omega t}$ 取实部，得到**时域瞬时值表达式**：

$$
\begin{aligned}
u(z,t)&=|A_1|e^{\alpha z}\cos(\omega t+\beta z+\theta_1)+|A_2|e^{-\alpha z}\cos(\omega t-\beta z+\theta_2)\\[1mm]
i(z,t)&=\frac{|A_1|}{|Z_0|}e^{\alpha z}\cos(\omega t+\beta z+\theta_1-\varphi_0)
-\frac{|A_2|}{|Z_0|}e^{-\alpha z}\cos(\omega t-\beta z+\theta_2-\varphi_0)
\end{aligned}
\tag{2-2-12}
$$

**逐项解读**：

- $e^{\alpha z}$、$e^{-\alpha z}$：**幅度因子**。入射波沿 $-z$ 传播，$z$ 越小（越靠近负载）幅度越小，所以它的幅度因子是 $e^{\alpha z}$（从信源到负载衰减 $e^{-\alpha l}$）；
- $\cos(\omega t\pm\beta z+\theta)$：**相位因子**，$\pm$ 号决定传播方向；
- 电流表达式中两波都带 $1/|Z_0|$，且**入射波与反射波的电流项符号相反**（第二项前的负号）。

> **【易错点】**
> 当 $Z_0$ 是复数时，$\varphi_0\neq0$，**电压波与电流波之间存在一个固有相位差 $\varphi_0$**。只有当传输线无耗（或损耗很小时），$Z_0$ 才近似为实数、$\varphi_0\approx0$，才能说"电压与电流同相"。

### 2.2.5 边界条件：$A_1$、$A_2$ 怎么定

通解中的 $A_1$、$A_2$ 是待定常数，必须由**边界条件**确定。工程上有三种给法：

1. **终端条件**：已知负载端的电压 $U_l$ 与电流 $I_l$（最常用）；
2. **始端条件**：已知信源端的电压 $U_{\mathrm{in}}$ 与电流 $I_{\mathrm{in}}$；
3. **源阻抗条件**：已知信源电动势 $E_g$ 与内阻抗 $Z_g$（最彻底，可直接求出沿线所有量）。

#### CASE 1：终端条件

已知 $z=0$ 处 $U(0)=U_l$、$I(0)=I_l$。代入式 (2-2-9)：

$$
\begin{cases}
A_1+A_2=U_l\\[1mm]
\dfrac{1}{Z_0}\left(A_1-A_2\right)=I_l
\end{cases}
\quad\Longrightarrow\quad
A_1=\frac{U_l+I_lZ_0}{2},\qquad A_2=\frac{U_l-I_lZ_0}{2}
\tag{2-2-13}
$$

代回并把指数组合成双曲函数（$\mathrm{ch}\,x=\dfrac{e^{x}+e^{-x}}{2}$、$\mathrm{sh}\,x=\dfrac{e^{x}-e^{-x}}{2}$）：

$$
U(z)=U_l\cosh\gamma z+I_lZ_0\sinh\gamma z,
\qquad
I(z)=I_l\cosh\gamma z+\frac{U_l}{Z_0}\sinh\gamma z
\tag{2-2-14}
$$

**这就是"局部到整体、完美的闭环"**：只用了终端两个数和一个特性阻抗，就得到了整条线上任意点的电压电流。

若传输线**无耗**（$\gamma=j\beta$，$\cosh j\beta z=\cos\beta z$，$\sinh j\beta z=j\sin\beta z$），式 (2-2-14) 化为

$$
U(z)=U_l\cos\beta z+jI_lZ_0\sin\beta z,
\qquad
I(z)=I_l\cos\beta z+j\frac{U_l}{Z_0}\sin\beta z
\tag{2-2-15}
$$

由 $Z_{\mathrm{in}}(z)=U(z)/I(z)$ 立刻得到无耗线的输入阻抗公式（2.3 节将详细讨论）：

$$
Z_{\mathrm{in}}(z)=\frac{U(z)}{I(z)}
=Z_0\frac{U_l\cos\beta z+jI_lZ_0\sin\beta z}{I_lZ_0\cos\beta z+jU_l\sin\beta z}
=Z_0\frac{Z_l+jZ_0\tan\beta z}{Z_0+jZ_l\tan\beta z}
\tag{2-2-16}
$$

> **【核心概念】**
> **输入阻抗与负载阻抗是"相通"的**：
> - **负载阻抗是 $z=0$ 处的输入阻抗**：$Z_{\mathrm{in}}(0)=Z_l$；
> - **输入阻抗是从 $z$ 点向负载看过去的、包含了整段线的"等效负载阻抗"**。
> 这句话是本章最重要的思想：**一段传输线的作用，就是把它终端的负载阻抗"变换"成另一个阻抗**。$\lambda/4$ 变换器、枝节调配器，全都建立在这一点上。

### 2.2.6 本节考点清单

> **【考点】**
> - **题型**：简答（长线判据、电报方程的物理含义、相量法的作用、为什么入射波是 $e^{+\gamma z}$）、推导（由基尔霍夫定律推电报方程、由终端条件推式 (2-2-14)）、计算（给定 $U_l$、$I_l$ 求沿线电压电流）。
> - **常见设问**：①"写出电报方程并说明各项物理意义"；②"为什么可以用相量法？相量法把什么变成了什么？"；③"$A_1$、$A_2$ 如何确定？三种边界条件是什么？"；④"为什么 $Z_0$ 与 $z$ 无关？"
> - **易错点**：①忘记 $\Delta z\to0$ 这一步，把差分方程当微分方程；②相量域算出结果后忘记"乘 $e^{j\omega t}$ 取实部"回到时域；③坐标方向与 $\pm\gamma z$ 不匹配，导致入射波与反射波认错；④把 $Z_0=\sqrt{Z/Y}$ 写成 $Z_0=\sqrt{Y/Z}$。
> - **难度**：★★★

## 2.3 均匀传输线工作特性参数与状态参量

本节引入**六个量**，请务必分清它们的"身份"：

| 类别 | 量 | 由什么决定 | 是否随位置/负载变化 |
|---|---|---|---|
| **工作特性参数**（固有） | 特性阻抗 $Z_0$ | 传输线结构、材料、$\omega$ | **无关** |
| | 传播常数 $\gamma=\alpha+j\beta$ | 传输线结构、材料、$\omega$ | **无关** |
| | 相速 $v_p$、波长 $\lambda$ | 传输线结构、材料、$\omega$ | **无关** |
| **状态参量**（工作状态） | 输入阻抗 $Z_{\mathrm{in}}(z)$ | $Z_0$、$Z_l$、$\omega$、$z$ | **都变** |
| | 反射系数 $\Gamma(z)$ | $Z_0$、$Z_l$、$z$ | **都变** |
| | 驻波比 $\rho$ | $Z_0$、$Z_l$（与 $z$ 无关！） | 与 $z$ 无关 |

> **【易错点】**
> $\rho$ 虽然属于"状态参量"，但它在**无耗线上与位置 $z$ 无关**（因为 $|\Gamma(z)|=|\Gamma_l|$ 是常数）。这一点考试中经常用"沿线驻波比处处相等"来设陷阱。

### 2.3.1 特性阻抗 $Z_0$

#### （1）定义与三条性质

> **【核心概念】**
> **特性阻抗 $Z_0$** 定义为**导行波的入射波（或反射波）的电压与电流之比**：
> $$Z_0=\frac{U^{+}(z)}{I^{+}(z)}=\frac{U^{-}(z)}{-I^{-}(z)}=\sqrt{\frac{R+j\omega L}{G+j\omega C}}
> \tag{2-3-1}$$
> 注意：它**不是合成波的电压电流之比**！合成波之比是输入阻抗 $Z_{\mathrm{in}}(z)$，那是状态参量。

三条性质：

1. **只由 $R,L,C,G$ 与 $\omega$ 决定**，与信源、负载无关；
2. **与位置 $z$ 无关**，沿整条均匀线处处相同（这正是"均匀"的含义）；
3. 一般是**复数**，是传输线的**固有参数**（也称"特性阻抗""波阻抗"）。

#### （2）三种情形

**情形一：无耗线（$R=G=0$）**

$$
Z_0=\sqrt{\frac{j\omega L}{j\omega C}}=\sqrt{\frac{L}{C}}\quad(\text{实数})
\tag{2-3-2}
$$

**实数**这一点极其重要：无耗线的 $Z_0$ 是纯电阻性的，所以沿线**电压波与电流波同相**，这是后面所有"驻波"结论的基础。

**情形二：小损耗线（$R\ll\omega L$，$G\ll\omega C$）**

$$
Z_0=\sqrt{\frac{L}{C}}\sqrt{\frac{1+\dfrac{R}{j\omega L}}{1+\dfrac{G}{j\omega C}}}
\approx\sqrt{\frac{L}{C}}\left[1+j\frac{1}{2}\left(\frac{G}{\omega C}-\frac{R}{\omega L}\right)\right]
\tag{2-3-3}
$$

推导用了小量近似 $\sqrt{1+x}\approx1+x/2$ 与 $1/(1+x)\approx1-x$。结果是"**实数 + 一个很小的虚部**"，工程上通常直接当作实数处理。

**情形三：工程常用公式**

| 结构 | 公式 | 说明 |
|---|---|---|
| 双导体传输线（导线直径 $d$、间距 $D$） | $Z_0=\dfrac{120}{\sqrt{\varepsilon_r}}\ln\dfrac{2D}{d}\ \Omega$ | 空气中 $\varepsilon_r=1$，$120\pi\approx377\ \Omega$ 为自由空间波阻抗 |
| 无耗同轴线（内半径 $a$、外半径 $b$） | $Z_0=\dfrac{60}{\sqrt{\varepsilon_r}}\ln\dfrac{b}{a}\ \Omega$ | $60=\dfrac{1}{2\pi}\sqrt{\dfrac{\mu_0}{\varepsilon_0}}\cdot 2\pi$ 的工程化写法 |

> **【工程应用】**
> **为什么标准同轴电缆是 50 Ω 与 75 Ω？**
> - **50 Ω**：是"**功率容量最大**"（约 $30\ \Omega$）与"**衰减最小**"（约 $77\ \Omega$）两个要求的**折中**，且便于机械加工。因此 50 Ω 成为射频与微波系统的通用标准（测试仪器、同轴接头、微带线）。
> - **75 Ω**：接近**衰减最小点**（$77\ \Omega$ 附近），适合长距离传输小功率信号，如电视信号、有线电视（CATV）系统。
> 记住这两个数字背后是"**功率—损耗折中**"与"**损耗最小**"两种不同的工程目标。

#### （3）两个必须澄清的误解

> **【易错点】**
> - $Z_0$ 的单位是 $\Omega$，但它**不表示损耗**！它是"行波状态下电压与电流的比例关系"，是一个**比值**，不是耗能元件；
> - $Z_0$ 也**不是电阻**。你可以用万用表测一根同轴电缆两端的电阻，得到的可能是开路（$\infty$）或短路（$0$），与它的 $Z_0=50\ \Omega$ 毫无关系。$Z_0$ 只在**行波状态**下才有"$U/I$"的意义。
> - 常见错误：认为"$Z_0$ 越小的线损耗越大"。损耗由 $\alpha$ 描述，与 $Z_0$ 没有这种简单关系。

### 2.3.2 传播常数 $\gamma=\alpha+j\beta$

$$
\gamma=\sqrt{(R+j\omega L)(G+j\omega C)}=\alpha+j\beta
\tag{2-3-4}
$$

**物理意义**：$\gamma$ 描述波沿传播方向"**幅度衰减 + 相位滞后**"的快慢。

- $\alpha$——**衰减常数**，单位 $\mathrm{Np/m}$（奈培/米）或 $\mathrm{dB/m}$。换算关系：$1\ \mathrm{Np}=8.686\ \mathrm{dB}$（因为 $\ln 10=2.3026$，$20\lg e=8.686$）。工程上常用 $\mathrm{dB/m}$，因为它可以直接与功率的十倍对数关系对上。
- $\beta$——**相移常数**，单位 $\mathrm{rad/m}$，与波长锁定：$\beta=2\pi/\lambda$。

**无耗线（$R=G=0$）**：

$$
\gamma=\sqrt{j\omega L\cdot j\omega C}=j\omega\sqrt{LC}
\quad\Longrightarrow\quad
\alpha=0,\qquad \beta=\omega\sqrt{LC}
\tag{2-3-5}
$$

此时常用 $j\beta$ 代替 $\gamma$，传输线上只有相位变化、没有幅度衰减。

**小损耗线**：由式 (2-3-4) 提取 $j\omega\sqrt{LC}$ 并作小量近似：

$$
\gamma=j\omega\sqrt{LC}\left(1+\frac{R}{j\omega L}\right)^{1/2}\left(1+\frac{G}{j\omega C}\right)^{1/2}
\approx j\omega\sqrt{LC}+\frac{R}{2}\sqrt{\frac{C}{L}}+\frac{G}{2}\sqrt{\frac{L}{C}}
$$

即

$$
\alpha\approx\frac{R}{2}\sqrt{\frac{C}{L}}+\frac{G}{2}\sqrt{\frac{L}{C}}
=\frac{R}{2Z_0}+\frac{GZ_0}{2},
\qquad
\beta\approx\omega\sqrt{LC}
\tag{2-3-6}
$$

**逐项解读**：$\alpha$ 分成两项，第一项 $R/(2Z_0)$ 是**导体损耗**贡献，第二项 $GZ_0/2$ 是**介质损耗**贡献。低频时往往导体损耗占优（$R$ 相对大）；频率升高后 $R\propto\sqrt{f}$ 而 $G\propto f$，**介质损耗逐渐占主导**——这也是高频必须选择低损耗介质基板的原因。

> **【核心概念】**
> **实际系统既不会理想无耗，也不会损耗很大——"低损耗"是常态。** 所以式 (2-3-5) 与式 (2-3-6) 这两个近似式，才是工程分析中用得最多的公式。理想无耗线是"抓住主要矛盾"的模型，小损耗线是"在无耗基础上补一个衰减项"的模型。

### 2.3.3 相速 $v_p$ 与波长 $\lambda$

#### （1）相速

**相速（phase velocity）**定义为"等相位面沿传输方向移动的速度"。对入射波，等相面

$$
\omega t+\beta z=\text{const}
\quad\Longrightarrow\quad
v_p=\frac{dz}{dt}=-\frac{\omega}{\beta}
$$

对反射波，等相面 $\omega t-\beta z=\text{const}$ 给出 $v_p=+\omega/\beta$。把两者统一写成

$$
v_p=\frac{\omega}{\beta}
\tag{2-3-7}
$$

符号相应理解为：**"$-$"对应沿 $-z$ 的入射波，"$+$"对应沿 $+z$ 的反射波**。无耗线代入式 (2-3-5)：

$$
v_p=\frac{\omega}{\beta}=\frac{1}{\sqrt{LC}}
\tag{2-3-8}
$$

**量纲检查**：$[1/\sqrt{LC}]=1/\sqrt{\mathrm{H/m}\cdot\mathrm{F/m}}=\mathrm{m/s}$ ✓。

> **【核心概念】**
> **有耗线的 $v_p$ 与频率 $\omega$ 有关**（因为 $\beta$ 不再是 $\omega$ 的线性函数），这意味着**不同频率的分量以不同速度传播**——这就是**色散波（dispersive wave）**。
> **"为什么叫色散？"** 这个名字来自光学：白光通过棱镜后，不同颜色（不同频率）的光折射角不同，被"散开"成光谱，所以叫"色散"。在传输线上，如果一个信号含有多个频率分量，它们到达终端的时刻不同，合成的波形就会**畸变**——这与棱镜把白光散开是同一类物理现象。**无耗线没有色散**（$v_p=1/\sqrt{LC}$ 与频率无关），是理想的"无色散"信道。

#### （2）波长

**波长 $\lambda$** 是"一个振动周期内波传播的距离"，即**相位相差 $2\pi$ 的距离**：

$$
\lambda=\frac{2\pi}{\beta}=\frac{2\pi v_p}{\omega}=\frac{v_p}{f}
\tag{2-3-9}
$$

无耗情况下：

- **介质中**（$\mu_r=1$，相对介电常数 $\varepsilon_r$）：$v_p=\dfrac{1}{\sqrt{LC}}=\dfrac{c}{\sqrt{\varepsilon_r}}$，于是
  $$
  \lambda=\frac{c}{f\sqrt{\varepsilon_r}}
  \tag{2-3-10}
  $$
- **空气中**（$\varepsilon_r=1$）：$\lambda=\dfrac{c}{f}$。

> **【考点】**
> 微波技术中**公式推导都是相通的**：$\beta=\omega\sqrt{LC}$、$v_p=1/\sqrt{LC}$、$\lambda=v_p/f$ 这三条在无耗线上等价，任取两条即可推出第三条。**有耗也是成立的**：只要把有耗线的 $\gamma=\alpha+j\beta$ 代入 $v_p=\omega/\beta$ 与 $\lambda=2\pi/\beta$，公式形式完全不变，只是 $\beta$ 不再是 $\omega$ 的线性函数。
> 本章讨论的 $\lambda$ 是"**无限大均匀介质或 TEM 传输线中的波长**"。对**非 TEM 波**（如矩形波导中的 TE$_{10}$ 模），波长要换成**波导波长 $\lambda_g$**，且只在 $f>f_c$ 时才能传播——这属于第三章的内容。

### 2.3.4 状态参量（1）：输入阻抗 $Z_{\mathrm{in}}(z)$

#### （1）定义与物理图像

> **【核心概念】**
> **输入阻抗**定义为传输线上任意一点 $z$ 处**合成波**电压与电流之比：
>
> $$
> Z_{\mathrm{in}}(z)=\frac{U(z)}{I(z)}
> \tag{2-3-11}
> $$
> 它"① 类似欧姆定律，② 具有波动性（与 $z$ 有关）"。

为什么说"类似而不等于"欧姆定律？因为欧姆定律描述的是**一个电阻**上"电压与电流的瞬时比例"，而 $Z_{\mathrm{in}}(z)$ 描述的是"**从该点向负载看过去，整段传输线加上负载构成的等效阻抗**"。随着 $z$ 变化，这个"看过去"的距离在变，驻波图样在变，所以 $Z_{\mathrm{in}}(z)$ 也在变。

#### （2）核心公式的推导

以终端条件式 (2-2-14) 为出发点（有耗一般情形）：

$$
Z_{\mathrm{in}}(z)=\frac{U_l\cosh\gamma z+I_lZ_0\sinh\gamma z}
{I_l\cosh\gamma z+\dfrac{U_l}{Z_0}\sinh\gamma z}
=\frac{U_l+I_lZ_0\tanh\gamma z}{I_l+\dfrac{U_l}{Z_0}\tanh\gamma z}
$$

分子分母同乘 $Z_0/I_l$，并注意 $Z_l=U_l/I_l$，得

$$
Z_{\mathrm{in}}(z)=Z_0\frac{Z_l+Z_0\tanh\gamma z}{Z_0+Z_l\tanh\gamma z}
\quad(\text{有耗})
\qquad\Longleftrightarrow\qquad
Z_{\mathrm{in}}(z)=Z_0\frac{Z_l+jZ_0\tan\beta z}{Z_0+jZ_l\tan\beta z}
\quad(\text{无耗})
\tag{2-3-12}
$$

式 (2-3-12) 右端是本章**使用频率最高的公式**，请务必背到"看到 $Z_l$、$Z_0$、$\beta z$ 就能写出来"。

**验算**：令 $z=0$，得 $Z_{\mathrm{in}}(0)=Z_0\dfrac{Z_l}{Z_0}=Z_l$ ✓；令 $Z_l=Z_0$，得 $Z_{\mathrm{in}}(z)=Z_0$ 对一切 $z$ 成立 ✓（这正是 2.4 节的"行波状态"）。

#### （3）三条 Remark

> **【核心概念】**
> **(a) $Z_{\mathrm{in}}$ 与 $Z_0$、$Z_l$、$\omega$、$z$ 都有关，是复数，且难以直接测量。** 在微波频段，我们无法像低频那样"把表笔接上去量阻抗"（表笔本身就是一段传输线，且会引起反射）。因此工程上转而测量**反射系数 $\Gamma$** 与**驻波比 $\rho$**——它们可以借助定向耦合器与检波器直接测出，再由 $\Gamma$ 反推 $Z_{\mathrm{in}}$。
> **(b) $Z_0$ 与 $Z_{\mathrm{in}}(z)$ 的地位完全不同**：$Z_0$ 与位置和边界条件**无关**，是传输线的**固有特性**；$Z_{\mathrm{in}}(z)$ 取决于位置 $z$ 和边界条件 $Z_l$，是**工作状态**。考试中"求特性阻抗"与"求输入阻抗"是两类完全不同的题。
> **(c) $Z_{\mathrm{in}}(z)$ 的 $\lambda/2$ 重复性与 $\lambda/4$ 变换性**（下面单独推导）。

#### （4）两个重要推论

> **【公式推导】**
> **推论一：二分之波长重复性**
> $$Z_{\mathrm{in}}\!\left(z+\frac{\lambda}{2}\right)
> =Z_0\frac{Z_l+jZ_0\tan\left(\beta z+\pi\right)}{Z_0+jZ_l\tan\left(\beta z+\pi\right)}
> =Z_0\frac{Z_l+jZ_0\tan\beta z}{Z_0+jZ_l\tan\beta z}=Z_{\mathrm{in}}(z)
> \tag{2-3-13}$$
> 用到的关键是 $\beta\cdot\dfrac{\lambda}{2}=\pi$ 与 $\tan(\theta+\pi)=\tan\theta$。
> **物理意义**：沿传输线移动 $\lambda/2$，**阻抗完全复原**。因此无耗传输线上"每隔半波长是一个重复的世界"，这也是史密斯圆图上"转一圈（$360^{\circ}$）等于 $\lambda/2$"的根源。
>
> **推论二：四分之一波长阻抗变换性**
> $$Z_{\mathrm{in}}\!\left(z+\frac{\lambda}{4}\right)\cdot Z_{\mathrm{in}}(z)=Z_0^{2}
> \tag{2-3-14}$$
> 证明：记 $t=\tan\beta z$，由 $\tan(\beta z+\pi/2)=-\cot\beta z=-\dfrac{1}{t}$ 得
> $$Z_{\mathrm{in}}\!\left(z+\frac{\lambda}{4}\right)=Z_0\frac{Z_l-jZ_0/t}{Z_0-jZ_l/t}=Z_0\frac{Z_lt-jZ_0}{Z_0t-jZ_l}$$
> 与 $Z_{\mathrm{in}}(z)=Z_0\dfrac{Z_l+jZ_0t}{Z_0+jZ_lt}$ 相乘，分子分母恰好成对消去，得 $Z_0^{2}$。
> **物理意义**：$\lambda/4$ 线是"**阻抗倒置器**"——它把大阻抗变小、小阻抗变大，且保持乘积为 $Z_0^{2}$。这就是 2.7 节 $\lambda/4$ 阻抗变换器的理论基础。注意：这条性质对**行波、驻波、行驻波都成立**，是传输线的普适规律。

#### （5）【例2.1】距离负载 $0.0375\ \mathrm{m}$ 处的输入阻抗

> **【例题 2-1】**
> 一根特性阻抗为 $Z_0=50\ \Omega$ 的无耗均匀传输线，工作频率 $f=3\ \mathrm{GHz}$，终端接负载 $Z_l=30+j40\ \Omega$。求距离负载 $0.0375\ \mathrm{m}$ 处的输入阻抗。
>
> **思路：** 先由频率求 $\beta$，再算电长度 $\beta z$，代入式 (2-3-12)。算完用**第二条路径（反射系数法）**复核。
>
> **解（路径一：阻抗公式）：**
> $$\lambda=\frac{c}{f}=\frac{3\times10^{8}}{3\times10^{9}}=0.1\ \mathrm{m},\qquad
> \beta=\frac{2\pi}{\lambda}=20\pi\ \mathrm{rad/m}$$
> $$\beta z=20\pi\times0.0375=0.75\pi=135^{\circ},\qquad \tan 0.75\pi=\tan135^{\circ}=-1$$
> 代入
> $$Z_{\mathrm{in}}=Z_0\frac{Z_l+jZ_0\tan\beta z}{Z_0+jZ_l\tan\beta z}
> =50\times\frac{30+j40+j50\times(-1)}{50+j(30+j40)\times(-1)}
> =50\times\frac{30-j10}{90-j30}$$
> 而
> $$\frac{30-j10}{90-j30}=\frac{(30-j10)(90+j30)}{90^{2}+30^{2}}=\frac{2700+j900-j900+300}{9000}=\frac{1}{3}$$
> 所以
> $$Z_{\mathrm{in}}=50\times\frac{1}{3}=16.7\ \Omega$$
>
> **解（路径二：反射系数法复核）：**
> 归一化负载 $\bar Z_l=\dfrac{30+j40}{50}=0.6+j0.8$，终端反射系数
> $$\Gamma_l=\frac{\bar Z_l-1}{\bar Z_l+1}=\frac{-0.4+j0.8}{1.6+j0.8}=j0.5=0.5e^{j\pi/2}$$
> 即 $|\Gamma_l|=0.5$、$\varphi_l=\pi/2$，对应 $\rho=\dfrac{1+0.5}{1-0.5}=3$。在 $z=0.0375\ \mathrm{m}=0.375\lambda$ 处
> $$\Gamma(z)=\Gamma_le^{-j2\beta z}=0.5e^{j\pi/2}\cdot e^{-j1.5\pi}=0.5e^{-j\pi}=-0.5$$
> $$Z_{\mathrm{in}}=Z_0\frac{1+\Gamma(z)}{1-\Gamma(z)}=50\times\frac{1-0.5}{1+0.5}=50\times\frac{1}{3}=16.7\ \Omega$$
> 两条路径结果完全一致。
>
> **讨论（本题的三个教学点）：**
> 1. **为什么结果是纯电阻而不是复数？** 由 $\varphi_l=\pi/2$ 得第一电压波腹点在 $z_{\max}=\dfrac{\varphi_l\lambda}{4\pi}=\dfrac{\lambda}{8}=0.0125\ \mathrm{m}$，第一电压波节点在 $z_{\min}=z_{\max}+\dfrac{\lambda}{4}=0.375\lambda=0.0375\ \mathrm{m}$——**恰好就是题目给的距离**！电压波节处输入阻抗为纯电阻且取最小值 $R_{\min}=\dfrac{Z_0}{\rho}=\dfrac{50}{3}=16.7\ \Omega$。所以答案"看似巧合，实为必然"。
> 2. **与 $0.25\lambda$ 的关系**：$0.375\lambda=\dfrac{\lambda}{2}+\dfrac{3\lambda}{8}$，利用 $\lambda/2$ 重复性，等价于"向负载方向退 $0.125\lambda$"。审题时先把距离对 $\lambda/2$ 取模，往往能立刻看出它落在波腹还是波节上。
> 3. **不要想当然认为答案一定是复数**。本题若把 $\tan0.75\pi$ 的符号写错（误取 $+1$），或漏掉分母 $jZ_l\tan\beta z$ 中的符号，就会得到完全错误的结果。**用 $\Gamma$ 法独立复核，是防止此类错误最有效的手段。**

### 2.3.5 状态参量（2）：反射系数 $\Gamma(z)$

#### （1）定义

> **【核心概念】**
> **反射系数**定义为"反射波的电压（或电流）与入射波的电压（或电流）之比"：
> $$\Gamma_u(z)=\frac{U^{-}(z)}{U^{+}(z)},\qquad
> \Gamma_i(z)=\frac{I^{-}(z)}{I^{+}(z)}=-\Gamma_u(z)
> \tag{2-3-15}$$
> 电压反射系数与电流反射系数**大小相等、符号相反**（因为反射波中电压与电流反相）。工程上不加说明时，$\Gamma$ 一律指**电压反射系数**，统一记为 $\Gamma(z)$。

由通解 $U^{\pm}(z)=A_{1,2}e^{\pm\gamma z}$ 立即得到

$$
\Gamma(z)=\frac{A_2e^{-\gamma z}}{A_1e^{\gamma z}}=\Gamma_le^{-2\gamma z}
=\underbrace{|\Gamma_l|e^{-2\alpha z}}_{\text{幅度}}\cdot\underbrace{e^{j(\varphi_l-2\beta z)}}_{\text{相位}},
\qquad
\Gamma_l=\frac{A_2}{A_1}=\frac{Z_l-Z_0}{Z_l+Z_0}=|\Gamma_l|e^{j\varphi_l}
\tag{2-3-16}
$$

无耗线上 $\alpha=0$：

$$
\Gamma(z)=\Gamma_le^{-j2\beta z}=|\Gamma_l|e^{j(\varphi_l-2\beta z)}
\tag{2-3-17}
$$

**终端反射系数的三种极端情形**：

| $Z_l$ | $\Gamma_l$ | 状态 |
|---|---|---|
| $Z_l=Z_0$ | $0$ | 无反射（匹配） |
| $Z_l=0$（短路） | $-1$ | 全反射，反相 |
| $Z_l=\infty$（开路） | $+1$ | 全反射，同相 |

#### （2）为什么是 $e^{-j2\beta z}$？

> **【思考】**
> 为什么任意点的反射系数比终端反射系数多了一个 $e^{-j2\beta z}$，而不是 $e^{-j\beta z}$？

**答案：一来一回，共走 $2z$。**

反射波是由入射波在负载处"折返"形成的。要从 $z$ 点"看到"负载处的反射，必须让入射波从 $z$ 点走到负载（距离 $z$），再让反射波从负载走回 $z$ 点（距离又是 $z$），**总路程 $2z$**。因此反射波相对于入射波**相位落后 $2\beta z$**，写成相量因子就是 $e^{-j2\beta z}$。

它带来两条直接结论：

- **幅度不变**（无耗时 $|\Gamma(z)|=|\Gamma_l|$ 是常数）：所以史密斯圆图上"沿传输线移动"就是**沿等 $|\Gamma|$ 圆转圈**；
- **相位每 $\lambda/2$ 变化一次**：令 $z\to z+\lambda/2$，相位变化 $-2\beta\cdot\dfrac{\lambda}{2}=-2\pi$，回到原处——这就是**反射系数的二分之波长重复性**，与 $Z_{\mathrm{in}}$ 的重复性完全同源。
- "**每一点都不一样 $\Rightarrow$ 波动性**"：反射系数沿线是复平面上的一条等半径圆弧，它把"位置"变成了"相位"。

#### （3）由 $\Gamma$ 求 $Z_{\mathrm{in}}$，以及"阻抗是怎么测出来的"

由 $U(z)=U^{+}(z)\left[1+\Gamma(z)\right]$ 与 $I(z)=\dfrac{U^{+}(z)}{Z_0}\left[1-\Gamma(z)\right]$：

$$
Z_{\mathrm{in}}(z)=\frac{U(z)}{I(z)}=Z_0\frac{1+\Gamma(z)}{1-\Gamma(z)},
\qquad
\Gamma(z)=\frac{Z_{\mathrm{in}}(z)-Z_0}{Z_{\mathrm{in}}(z)+Z_0}
\tag{2-3-18}
$$

（第二式可结合终端反射系数 $\Gamma_l=\dfrac{Z_l-Z_0}{Z_l+Z_0}$ 一起记忆：**形式完全相同，只是把 $Z_l$ 换成了 $Z_{\mathrm{in}}(z)$**。）

> **【工程应用】**
> **"$Z_{\mathrm{in}}$ 通常由 $\Gamma$ 测量得到"**——这是一句工程味极浓的话。实际操作步骤是：
> 1. 在传输线上用**驻波测量线**或**定向耦合器**测出**驻波比 $\rho$**，得 $|\Gamma_l|=\dfrac{\rho-1}{\rho+1}$；
> 2. 测出**第一个电压波节点到负载的距离 $z_{\min}$**。电压波节处 $\Gamma$ 为负实数（相位 $\pi$），而 $\Gamma_l=\Gamma(z_{\min})e^{+j2\beta z_{\min}}$，故
>    $$\varphi_l=\pi+2\beta z_{\min}=\pi+\frac{4\pi z_{\min}}{\lambda}\pmod{2\pi}
>    \tag{2-3-19}$$
> 3. 由 $\Gamma_l=|\Gamma_l|e^{j\varphi_l}$ 反求 $Z_l=Z_0\dfrac{1+\Gamma_l}{1-\Gamma_l}$。
>
> 这三步就是"**由可观测量（幅值、位置）反推待求量（复数阻抗）**"的典型微波测量思路，也是 2.6 节例题 2.8 的解法。

#### （4）三种状态的判据

$$
|\Gamma(z)|=0\ \Rightarrow\ \text{行波（traveling wave）},\quad
|\Gamma(z)|=1\ \Rightarrow\ \text{驻波（standing wave）},\quad
0<|\Gamma(z)|<1\ \Rightarrow\ \text{行驻波（traveling-standing wave）}
\tag{2-3-20}
$$

其物理含义分别是：**只有入射没有反射**、**入射与反射幅度相等**、**入射强于反射**。

### 2.3.6 状态参量（3）：驻波比 $\rho$

#### （1）为什么还要引入驻波比

反射系数是复数，测量与比较都不方便。驻波比是它的"**幅度版**"：用一个**实数**（且 $1\le\rho<\infty$）描述反射的强弱。

#### （2）从驻波图样推导

设无耗线上 $U(z)=U^{+}(z)+U^{-}(z)$，两者幅度分别为 $|U^{+}|$ 与 $|U^{-}|=|\Gamma_l||U^{+}|$，它们的相位差沿 $z$ 变化。于是合成波幅度在

$$
|U|_{\max}=|U^{+}|+|U^{-}|,
\qquad
|U|_{\min}=|U^{+}|-|U^{-}|
\tag{2-3-21}
$$

之间周期变化（这就是"驻波"的名称来源：某些位置永远最大、某些位置永远最小）。定义

$$
\rho=\frac{|U|_{\max}}{|U|_{\min}}=\frac{|U^{+}|+|U^{-}|}{|U^{+}|-|U^{-}|}
=\frac{1+\dfrac{|U^{-}|}{|U^{+}|}}{1-\dfrac{|U^{-}|}{|U^{+}|}}
=\frac{1+|\Gamma_l|}{1-|\Gamma_l|}
\tag{2-3-22}
$$

反解即得

$$
|\Gamma_l|=\frac{\rho-1}{\rho+1}
\tag{2-3-23}
$$

（注：$\rho$ 也常用 VSWR 表示，即 Voltage Standing Wave Ratio。）

#### （3）三种状态的驻波比

| 状态 | $\vert \Gamma_l\vert $ | $\rho$ | 物理意义 |
|---|---|---|---|
| 行波 | $0$ | $1$ | 无反射，能量全部被负载吸收 |
| 行驻波 | $0<\vert \Gamma_l\vert <1$ | $1<\rho<\infty$ | 部分反射，部分吸收 |
| 驻波 | $1$ | $\to\infty$ | 全反射，能量全部返回 |

#### （4）波腹、波节的位置规律

- **相邻两个电压波腹之间**：$\lambda/2$；**相邻两个电压波节之间**：$\lambda/2$；
- **相邻的电压波腹与电压波节之间**：$\lambda/4$；
- **电压波腹处对应电流波节，电压波节处对应电流波腹**（因为电压与电流此消彼长）。

> **【思考】**
> 行波、驻波、行驻波，哪一种状态最好？

**答案是行波**，理由有三条：

1. **功率全部送到负载**。驻波状态下入射功率与反射功率大小相等，净传输功率为零（2.5 节将证明 $P=0$）；行驻波则有一部功率被反射回去；
2. **沿线电压、电流恒定**，没有波腹，不会出现"局部电压过高"；
3. **对信源最安全**。反射波回到信源，可能造成信源频率牵引、输出功率不稳，甚至损坏功率管。

> **【工程应用】**
> 在工程中，"行波状态"是通过**阻抗匹配**逼近的。一般要求 $\rho<1.5$（对应 $|\Gamma|<0.2$），雷达与精密测量系统要求 $\rho<1.1$。$\rho$ 越小，说明系统越接近理想行波。

#### （5）【例2.2】终端反射系数、任意点反射系数与驻波比

> **【例题 2-2】**
> 一根特性阻抗为 $Z_0=50\ \Omega$ 的无耗均匀传输线，终端接 $100\ \Omega$ 的负载。求终端反射系数、距负载 $0.2\lambda$ 处的反射系数、驻波比。
>
> **解：**
> **（1）终端反射系数**（$Z_l=100\ \Omega$ 为实数，$\Gamma_l$ 为实数）
> $$\Gamma_l=\frac{Z_l-Z_0}{Z_l+Z_0}=\frac{100-50}{100+50}=\frac{1}{3}$$
> 因为 $\Gamma_l>0$，说明负载处电压为**波腹**（$\varphi_l=0$）。
>
> **（2）距负载 $0.2\lambda$ 处的反射系数**
> $$\Gamma(0.2\lambda)=\Gamma_le^{-j2\beta z}=\frac{1}{3}e^{-j\,2\cdot\frac{2\pi}{\lambda}\cdot0.2\lambda}
> =\frac{1}{3}e^{-j0.8\pi}$$
> 幅度不变（$|\Gamma|=1/3$），**相位顺时针转了 $0.8\pi=144^{\circ}$**。
>
> **（3）驻波比**
> $$\rho=\frac{1+|\Gamma_l|}{1-|\Gamma_l|}=\frac{1+1/3}{1-1/3}=2$$
>
> **讨论：** 本题 $Z_l$ 为纯阻且大于 $Z_0$，因此 $\Gamma_l=\dfrac{1}{3}$ 是**正实数**，$\varphi_l=0$：负载处即**第一电压波腹点**（$z_{\max}=0$），第一电压波节点在 $z_{\min}=\lambda/4$ 处。$\rho=2$ 表示电压波腹是波节的 2 倍，波腹值为 $|U^{+}|(1+1/3)=\dfrac{4}{3}|U^{+}|$，波节值为 $\dfrac{2}{3}|U^{+}|$。
> **拓展：** 若把负载换成 $Z_l=25\ \Omega$（小于 $Z_0$），则 $\Gamma_l=-\dfrac{1}{3}$，$\rho$ 仍为 2，但**波腹与波节的位置互换**：负载处变成波节，$\lambda/4$ 处变成波腹。这说明 **$\rho$ 只反映反射的"大小"，不反映"相位"，因此单凭 $\rho$ 不能确定负载**——必须同时知道波节点的位置（见例题 2.8）。

### 2.3.7 本节考点清单

> **【考点】**
> - **题型**：填空（$Z_0$ 定义、$\gamma$ 的实虚部名称与单位、$1\ \mathrm{Np}=8.686\ \mathrm{dB}$）、简答（$Z_0$ 与 $Z_{\mathrm{in}}$ 的区别、为什么是 50 Ω/75 Ω、为什么叫色散）、计算（$Z_{\mathrm{in}}$、$\Gamma$、$\rho$ 三者互算）。
> - **常见设问**：①"$Z_0$ 的定义是什么？为什么它不表示损耗？"②"证明 $Z_{\mathrm{in}}(z+\lambda/2)=Z_{\mathrm{in}}(z)$ 与 $Z_{\mathrm{in}}(z)Z_{\mathrm{in}}(z+\lambda/4)=Z_0^{2}$"；③"已知 $\rho$ 与 $z_{\min}$，如何求 $Z_l$？"；④"$\Gamma$ 中 $e^{-j2\beta z}$ 是怎么来的？"
> - **易错点**：①把 $Z_0$ 当成负载阻抗或电阻；②把 $\Gamma(z)$ 的指数写成 $e^{-j\beta z}$（漏掉"一来一回"的 2）；③忘记 $\Gamma_i=-\Gamma_u$；④$Z_{\mathrm{in}}$ 公式中分子分母的 $\tan$ 项位置写反；⑤认为 $\rho$ 随位置变化。
> - **难度**：★★★★

## 2.4 无耗均匀传输线的状态分析

### 2.4.0 总纲：一切取决于 $Z_l$ 与 $Z_0$ 的关系

无耗线 $\gamma=j\beta$，反射系数只剩下相位旋转。此时整条线的工作状态**只取决于负载阻抗 $Z_l$ 与特性阻抗 $Z_0$ 的关系**，而且只有三种可能：

$$
|\Gamma_l|=\left|\frac{Z_l-Z_0}{Z_l+Z_0}\right|
\begin{cases}
=0, & Z_l=Z_0\ \text{——行波状态（无反射）}\\
=1, & Z_l=0,\ \infty,\ \pm jX_l\ \text{——驻波状态（全反射）}\\
\in(0,1), & Z_l=R_l+jX_l,\ R_l>0\ \text{——行驻波状态（部分反射）}
\end{cases}
\tag{2-4-1}
$$

> **【核心概念】**
> **"反射意味着阻抗变化"**——这是本章的认识里程碑。反射的强弱由"负载阻抗偏离特性阻抗的程度"决定：完全相等 $\Rightarrow$ 不反射；完全不吸收（短路、开路、纯电抗）$\Rightarrow$ 全反射；部分吸收 $\Rightarrow$ 部分反射。
> $Z_l=Z_0$ 的过程称为**阻抗匹配（load matching）**，它是**微波工程的核心问题**。

### 2.4.1 行波状态（$Z_l=Z_0$，无反射）

#### （1）基本关系

$\Gamma_l=0$，由式 (2-3-22) 得 $\rho=1$。线上只剩入射波：

$$
U(z)=U^{+}(z)=A_1e^{j\beta z},
\qquad
I(z)=I^{+}(z)=\frac{A_1}{Z_0}e^{j\beta z}
\tag{2-4-2}
$$

令 $A_1=|A_1|e^{j\theta_1}$，时域瞬时值为

$$
u(z,t)=|A_1|\cos(\omega t+\beta z+\theta_1),
\qquad
i(z,t)=\frac{|A_1|}{Z_0}\cos(\omega t+\beta z+\theta_1)
\tag{2-4-3}
$$

#### （2）四条性质

> **【小结】**
> **行波状态的四条性质**：
> **(1) 沿线 $|U|$、$|I|$ 不变，且任意 $z$ 处 $U$ 与 $I$ 同相**——没有波腹波节，电压电流"同步"前进；
> **(2) $\rho=1$，$\Gamma(z)=0$**——沿线处处无反射；
> **(3) 对任意 $z$，$Z_{\mathrm{in}}(z)=Z_0$**——这是行波状态最"漂亮"的性质：无论从哪一点看进去，看到的都是 $Z_0$；
> **(4) 微波以固定功率单向传输**：
> $$P=\frac{1}{2}\mathrm{Re}\!\left[U(z)I^{*}(z)\right]
> =\frac{1}{2}\mathrm{Re}\!\left[A_1e^{j\beta z}\cdot\frac{A_1^{*}}{Z_0}e^{-j\beta z}\right]
> =\frac{|A_1|^{2}}{2Z_0}
> \tag{2-4-4}$$
> 功率与 $z$ 无关，说明**能量一路上没有损失、也没有返回**，全部单向流走。

性质 (3) 的验证很直接：把 $Z_l=Z_0$ 代入 $Z_{\mathrm{in}}(z)=Z_0\dfrac{Z_l+jZ_0\tan\beta z}{Z_0+jZ_l\tan\beta z}$，分子分母同时约去，得 $Z_{\mathrm{in}}(z)\equiv Z_0$。

> **【工程应用】**
> 行波状态意味着"**负载把入射功率全部吸收，线上任何位置看进去都是 $Z_0$**"。这正是微波系统追求的目标：只有在这种状态下，信源才始终看到恒定的 $Z_0$ 负载，输出功率才最大、频率才最稳定。

### 2.4.2 驻波状态之一：终端短路（CASE 1）

#### （1）全反射的条件

$|\Gamma_l|=1$ 要求 $|Z_l-Z_0|=|Z_l+Z_0|$。对无耗线（$Z_0$ 为实数），这个条件和它的物理解释是：

| 负载 | $\Gamma_l$ | 为什么全反射 |
|---|---|---|
| $Z_l=0$（短路） | $-1$ | 电压被强制为零，能量无处可去 |
| $Z_l=\infty$（开路） | $+1$ | 电流被强制为零，能量无处可去 |
| $Z_l=\pm jX_l$（纯电抗） | $e^{j\varphi_l}$ | **电抗元件只储能、不耗能**，一个周期内吸收的能量又全部送回 |

#### （2）完整推导

$Z_l=0\Rightarrow\Gamma_l=-1$，于是 $\Gamma(z)=\Gamma_le^{-j2\beta z}=-e^{-j2\beta z}$。代入合成波表达式：

$$
U(z)=A_1e^{j\beta z}\left[1+\Gamma(z)\right]
=A_1\left(e^{j\beta z}-e^{-j\beta z}\right)=2jA_1\sin\beta z
\tag{2-4-5}
$$

$$
I(z)=\frac{A_1}{Z_0}e^{j\beta z}\left[1-\Gamma(z)\right]
=\frac{A_1}{Z_0}\left(e^{j\beta z}+e^{-j\beta z}\right)=\frac{2A_1}{Z_0}\cos\beta z
\tag{2-4-6}
$$

令 $A_1=|A_1|e^{j\theta_1}$，回到时域：

$$
u(z,t)=2|A_1|\sin\beta z\cos\!\left(\omega t+\theta_1+\frac{\pi}{2}\right),
\qquad
i(z,t)=\frac{2|A_1|}{Z_0}\cos\beta z\cos(\omega t+\theta_1)
\tag{2-4-7}
$$

**注意瞬时的"反相"**：$u$ 比 $i$ 多一个 $\pi/2$ 相位，所以两者**在时间上正交**。

> **【核心概念】**
> **短路线的四条结论**：
> 1. **电压波节在 $z=n\dfrac{\lambda}{2}$ 处**（$n=0,1,2,\dots$），即**终端本身是电压波节、电流波腹**；
> 2. **电压波腹在 $z=(2n+1)\dfrac{\lambda}{4}$ 处**，与波节交替出现，相邻波腹（波节）间距 $\lambda/2$，波腹与波节间距 $\lambda/4$；
> 3. **$U$ 与 $I$ 相位差 $\pi/2$**，故 $P=\dfrac{1}{2}\mathrm{Re}[UI^{*}]=0$：**无功率传输**（能量只在信源与线之间往复交换）；
> 4. $Z_{\mathrm{in}}(z)=\dfrac{U(z)}{I(z)}=jZ_0\tan\beta z$，**为纯电抗**：$0<z<\lambda/4$ 时呈**感性**，$\lambda/4<z<\lambda/2$ 时呈**容性**，$\rho\to\infty$。

第 4 条是工程上极其有用的一条：**一段短路线可以当成电感或电容用**（长度小于 $\lambda/4$ 为电感，介于 $\lambda/4$ 与 $\lambda/2$ 之间为电容），这就是"枝节调配器"与"谐振腔"的物理基础。

> **【记忆技巧】**
> 驻波的直觉图像：**悬崖边的海浪**（前进波与反射波叠加，形成起伏不定但位置固定的波峰波谷）、**乐器发声**（弦上驻波决定音高）、**微波炉加热**（腔内驻波形成"热点"）、**两车正面相撞**（动量相消但能量并未消失，转化为形变/热）。它们的共同点是：**两个方向相反的波叠加，某些位置永远为零，某些位置永远最大，能量不能净传输**。

### 2.4.3 驻波状态之二：终端开路（CASE 2）

$Z_l=\infty\Rightarrow\Gamma_l=+1$，$\Gamma(z)=e^{-j2\beta z}$：

$$
U(z)=A_1e^{j\beta z}\left[1+e^{-j2\beta z}\right]=2A_1\cos\beta z,
\qquad
I(z)=\frac{A_1}{Z_0}\left(e^{j\beta z}-e^{-j2\beta z}e^{j\beta z}\right)=\frac{2jA_1}{Z_0}\sin\beta z
\tag{2-4-8}
$$

瞬时时域值：

$$
u(z,t)=2|A_1|\cos\beta z\cos(\omega t+\theta_1),
\qquad
i(z,t)=\frac{2|A_1|}{Z_0}\sin\beta z\cos\!\left(\omega t+\theta_1+\frac{\pi}{2}\right)
\tag{2-4-9}
$$

#### 短路与开路的对照

| 项目 | 终端短路（$Z_l=0$） | 终端开路（$Z_l=\infty$） |
|---|---|---|
| 终端反射系数 | $\Gamma_l=-1$ | $\Gamma_l=+1$ |
| 沿线反射系数 | $\Gamma(z)=-e^{-j2\beta z}$ | $\Gamma(z)=e^{-j2\beta z}$ |
| 电压 $U(z)$ | $2jA_1\sin\beta z$ | $2A_1\cos\beta z$ |
| 电流 $I(z)$ | $\dfrac{2A_1}{Z_0}\cos\beta z$ | $\dfrac{2jA_1}{Z_0}\sin\beta z$ |
| 输入阻抗 | $jZ_0\tan\beta z$ | $-jZ_0\cot\beta z$ |
| 终端（$z=0$） | 电压**波节**、电流波腹 | 电压**波腹**、电流波节 |
| 电压波节位置 | $z=n\dfrac{\lambda}{2}$ | $z=(2n+1)\dfrac{\lambda}{4}$ |
| 电压波腹位置 | $z=(2n+1)\dfrac{\lambda}{4}$ | $z=n\dfrac{\lambda}{2}$ |
| 驻波比 / 功率 | $\rho\to\infty$ / $P=0$ | $\rho\to\infty$ / $P=0$ |

**两者只差 $\lambda/4$**：把 $z\to z-\lambda/4$ 代入短路线公式，$\tan\left(\beta z-\dfrac{\pi}{2}\right)=-\cot\beta z$，恰好变成开路线的输入阻抗。这条"差 $\lambda/4$"的规律在微波元件设计中反复出现。

> **【工程应用】**
> **理想的终端开路在微波电路中无法直接实现**：线端开口会向外**辐射**能量，等效于并联了一个辐射电导，不再是纯粹的"电流为零"。
> 工程上的做法是：**在需要开路的端口处接一段 $\lambda/4$ 的短路线**——因为 $\lambda/4$ 短路线从另一端看进去恰好是开路（$jZ_0\tan(\beta\cdot\lambda/4)=jZ_0\tan(\pi/2)\to\infty$）。短路线不辐射、结构紧凑，因此"$\lambda/4$ 短路线"是微波电路中实现"理想开路"的标准手段。

### 2.4.4 驻波状态之三：纯电抗负载（CASE 3）

$Z_l=jX_l$（电抗储能元件，不吸收能量）。此时

$$
\Gamma_l=\frac{jX_l-Z_0}{jX_l+Z_0}=e^{j\varphi_l},
\qquad
|\Gamma_l|=1,
\qquad
\varphi_l=\pi-2\arctan\frac{X_l}{Z_0}
\tag{2-4-11}
$$

（因为 $|jX_l-Z_0|=|jX_l+Z_0|$，分子分母模相等。）

#### （1）分析方法：以短路为标准状态，沿线上"搬移" $\Delta z$

> **【核心概念】**
> 纯电抗负载依然是**全反射、驻波状态**，因此也可以看成"某一段短路线的输入阻抗"。具体做法是：**以短路为标准状态，把短路线的参考点沿传输线移动 $\Delta z$**。

推导：把 $Z_l=jX_l$ 代入输入阻抗公式

$$
Z_{\mathrm{in}}(z)=Z_0\frac{jX_l+jZ_0\tan\beta z}{Z_0+j\cdot jX_l\tan\beta z}
=jZ_0\frac{X_l+Z_0\tan\beta z}{Z_0-X_l\tan\beta z}
$$

利用正切和角公式 $\tan(A+B)=\dfrac{\tan A+\tan B}{1-\tan A\tan B}$，令

$$
\tan\beta\Delta z=\frac{X_l}{Z_0}
\quad\Longrightarrow\quad
\Delta z=\frac{1}{\beta}\arctan\frac{X_l}{Z_0}=\frac{\lambda}{2\pi}\arctan\frac{X_l}{Z_0}
\tag{2-4-12}
$$

则

$$
Z_{\mathrm{in}}(z)=jZ_0\frac{\tan\beta z+\tan\beta\Delta z}{1-\tan\beta z\tan\beta\Delta z}
=jZ_0\tan\beta(z+\Delta z)
\tag{2-4-13}
$$

即：**只要把坐标原点"平移" $\Delta z$，电抗负载就等价于一段短路线**。

#### （2）结论：$\Delta z$ 的符号决定"往哪边走"

| 负载性质 | $X_l$ | $\Delta z$ | 等效说法 |
|---|---|---|---|
| 感性 | $X_l>0$ | $\Delta z>0$ | 相当于**向信源方向**延长 $\Delta z$（短路线长度 $<\lambda/4$，呈感性） |
| 容性 | $X_l<0$ | $\Delta z<0$ | 相当于**向负载方向**移动 $\vert\Delta z\vert$（短路线长度 $>\lambda/4$，呈容性） |
| 短路 | $X_l=0$ | $\Delta z=0$ | 标准状态本身 |

> **【考点】**
> **"$\Delta z$ 往哪边移"是考试常用的一个小陷阱**：$\Delta z>0$ 表示"在短路线的短路点之外**再延伸一段线**"，等效于感性；$\Delta z<0$ 表示"从短路线往回退"，等效于容性。判断时只要记住**"小于 $\lambda/4$ 的短路线是电感，大于 $\lambda/4$ 的短路线是电容"**即可，不必死记符号。

#### （3）驻波状态的统一性质

> **【小结】**
> 无论短路、开路还是纯电抗，驻波状态都有以下共同特征：
> 1. $|\Gamma_l|=1$，$\rho\to\infty$；
> 2. $U$ 与 $I$ **相位差 $\pi/2$**，净传输功率 $P=0$（无功振荡）；
> 3. $Z_{\mathrm{in}}(z)$ **为纯电抗**——纯电抗不能耗散能量；
> 4. 电压波腹（电流波节）与电压波节（电流波腹）**交替出现**，间距分别为 $\lambda/2$ 与 $\lambda/4$；
> 5. 电压、电流的**包络（振幅分布）不随时间移动**，只有各点在自己的幅度上做简谐振荡——这就是"驻"的含义。

### 2.4.5 行驻波状态（$Z_l=R_l+jX_l$，$R_l>0$）

一般情形下 $|\Gamma_l|<1$，线上既有行波成分（净传输功率）又有驻波成分（振荡），故称**行驻波**。

#### （1）终端反射系数的两个分量

$$
\Gamma_l=\frac{R_l+jX_l-Z_0}{R_l+jX_l+Z_0}
=\frac{\left[(R_l-Z_0)+jX_l\right]\left[(R_l+Z_0)-jX_l\right]}{(R_l+Z_0)^{2}+X_l^{2}}
=\frac{\left(R_l^{2}+X_l^{2}-Z_0^{2}\right)+j\,2X_lZ_0}{(R_l+Z_0)^{2}+X_l^{2}}
$$

于是

$$
|\Gamma_l|=\sqrt{\frac{(R_l-Z_0)^{2}+X_l^{2}}{(R_l+Z_0)^{2}+X_l^{2}}},
\qquad
\varphi_l=\arctan\frac{2X_lZ_0}{R_l^{2}+X_l^{2}-Z_0^{2}}
\tag{2-4-14}
$$

**注意**：$\varphi_l$ 的表达式只给出 $\tan\varphi_l$ 的值，**必须按分子的符号（$2X_lZ_0$）与分母的符号（$R_l^2+X_l^2-Z_0^2$）分象限确定**。这正是下面 6 种情形的由来：

| 序号 | 条件 | $\varphi_l$ | 工作状态 |
|---|---|---|---|
| (1) | $R_l<Z_0,\ X_l=0$ | $\varphi_l=\pi$ | 负载处为**电压波节**（$\Gamma_l$ 负实数） |
| (2) | $R_l>Z_0,\ X_l=0$ | $\varphi_l=0$ | 负载处为**电压波腹**（$\Gamma_l$ 正实数） |
| (3) | $R_l^{2}+X_l^{2}=Z_0^{2}$（即 $\vert Z_l\vert=Z_0$） | $\varphi_l=+\pi/2\ (X_l>0)$，$-\pi/2\ (X_l<0)$ | 负载处既非波腹也非波节；第一波腹/波节均偏离负载 $\lambda/8$ |
| (4) | $X_l>0$（**感性**） | $\varphi_l\in(0,\pi)$ | $\Gamma_l$ 落在**上半平面** |
| (5) | $X_l<0$（**容性**） | $\varphi_l\in(-\pi,0)$ | $\Gamma_l$ 落在**下半平面** |
| (6) | $R_l=Z_0,\ X_l=0$ | $\Gamma_l=0$，$\varphi_l$ 无定义 | **行波**状态 |

> **【易错点】**
> 情形 (3) 的条件是 $\vert Z_l\vert=Z_0$（**模相等**），不是 $R_l=Z_0$！当 $\vert Z_l\vert=Z_0$ 时式 (2-4-14) 的分母为零，$\tan\varphi_l\to\infty$，故 $\varphi_l=\pm\pi/2$。例题 2.3 正是这种情形（$\vert40-j30\vert=50=Z_0$）。

#### （2）沿线电压、电流的幅度分布

由 $U(z)=A_1e^{j\beta z}\left[1+\Gamma_le^{-j2\beta z}\right]$，令 $\Gamma_l=|\Gamma_l|e^{j\varphi_l}$：

$$
|U(z)|=|A_1|\sqrt{1+|\Gamma_l|^{2}+2|\Gamma_l|\cos(2\beta z-\varphi_l)}
\tag{2-4-15}
$$

$$
|I(z)|=\frac{|A_1|}{Z_0}\sqrt{1+|\Gamma_l|^{2}-2|\Gamma_l|\cos(2\beta z-\varphi_l)}
\tag{2-4-16}
$$

> **【公式推导】**
> 推导要点（建议自己动手推一遍）：由 $\left|1+re^{j\theta}\right|^{2}=(1+r\cos\theta)^{2}+(r\sin\theta)^{2}=1+r^{2}+2r\cos\theta$，取 $r=|\Gamma_l|$、$\theta=\varphi_l-2\beta z$ 即得式 (2-4-15)；电流表达式中括号内是 $1-\Gamma_le^{-j2\beta z}$，故交叉项取负号，得式 (2-4-16)。**注意两条曲线的最大值、最小值位置是错开的**（相差 $\lambda/4$），这正对应"电压波腹处是电流波节"。

#### （3）波腹点与波节点位置（必考）

$$
|U|_{\max}\ \text{处}:\ \cos(2\beta z-\varphi_l)=1
\ \Longrightarrow\
\boxed{z_{\max}=\frac{\varphi_l\lambda}{4\pi}+\frac{n\lambda}{2}}
\tag{2-4-17}
$$

$$
|U|_{\min}\ \text{处}:\ \cos(2\beta z-\varphi_l)=-1
\ \Longrightarrow\
\boxed{z_{\min}=\frac{\varphi_l\lambda}{4\pi}+(2n+1)\frac{\lambda}{4}}
\tag{2-4-18}
$$

**取 $n$ 的原则**：取使 $z_{\max}$（或 $z_{\min}$）为**最小正值**的整数 $n$，得到的就是**第一电压波腹点**（或第一电压波节点）。若 $\varphi_l<0$，$n=0$ 会给出负距离，此时必须取 $n=1$——这是本题型最常见的失分点。

#### （4）波腹点、波节点处的输入阻抗

> **【公式推导】**
> **证明：波腹点与波节点的输入阻抗均为实数。**
> 在波腹点 $z_{\max}$，$2\beta z_{\max}-\varphi_l=2n\pi$，于是
> $$\Gamma(z_{\max})=\Gamma_le^{-j2\beta z_{\max}}=|\Gamma_l|e^{j(\varphi_l-2\beta z_{\max})}=|\Gamma_l|e^{-j2n\pi}=|\Gamma_l|$$
> 是**正实数**，代入 $Z_{\mathrm{in}}=Z_0\dfrac{1+\Gamma}{1-\Gamma}$ 得
> $$R_{\max}=Z_{\mathrm{in}}(z_{\max})=Z_0\frac{1+|\Gamma_l|}{1-|\Gamma_l|}=Z_0\rho
> \tag{2-4-19}$$
> 在波节点 $z_{\min}$，$2\beta z_{\min}-\varphi_l=(2n+1)\pi$，
> $$\Gamma(z_{\min})=|\Gamma_l|e^{-j(2n+1)\pi}=-|\Gamma_l|$$
> 是**负实数**，故
> $$R_{\min}=Z_{\mathrm{in}}(z_{\min})=Z_0\frac{1-|\Gamma_l|}{1+|\Gamma_l|}=\frac{Z_0}{\rho}
> \tag{2-4-20}$$
> 两者相乘得
> $$R_{\max}\cdot R_{\min}=Z_0\rho\cdot\frac{Z_0}{\rho}=Z_0^{2}
> \tag{2-4-21}$$
> 这正好与 $\lambda/4$ 变换性 $Z_{\mathrm{in}}(z)Z_{\mathrm{in}}(z+\lambda/4)=Z_0^{2}$ 一致——**波腹点与波节点刚好相隔 $\lambda/4$**，两条结论互相印证。

**物理解读**：$\rho$ 的物理意义可以"读"出来——**电压波腹处的输入阻抗是 $Z_0$ 的 $\rho$ 倍，波节处是 $Z_0$ 的 $1/\rho$**。工程上测得 $\rho$ 后，只要再找到波腹/波节的位置，就把"看不见的负载阻抗"变成了"看得见的驻波图样"。

#### （5）四种负载的分情形讨论

| 情形 | $Z_l$ | $\varphi_l$ | 第一波腹点 $z_{\max}$ | 第一波节点 $z_{\min}$ |
|---|---|---|---|---|
| (1) 纯阻，$R_l<Z_0$ | $R_l$ | $\pi$ | $\lambda/4$ | $0$（**负载处即波节**） |
| (2) 纯阻，$R_l>Z_0$ | $R_l$ | $0$ | $0$（**负载处即波腹**） | $\lambda/4$ |
| (3) 感性 | $R_l+jX_l,\ X_l>0$ | $0<\varphi_l<\pi$ | $0<z_{\max}<\lambda/4$ | $\lambda/4<z_{\min}<\lambda/2$ |
| (4) 容性 | $R_l+jX_l,\ X_l<0$ | $-\pi<\varphi_l<0$ | $\lambda/4<z_{\max}<\lambda/2$ | $0<z_{\min}<\lambda/4$ |

> **【记忆技巧】**
> 四种情形可以用一句口诀概括：**"阻小负载处是节，阻大负载处是腹；感性把腹往负载侧拉，容性把节往负载侧拉。"**
> 更本质的记忆方式是抓住 $\Gamma_l$ 在复平面上的位置：$\varphi_l=\pi$（负实轴，波节）、$\varphi_l=0$（正实轴，波腹）、$\varphi_l>0$（上半平面，感性）、$\varphi_l<0$（下半平面，容性）。

#### （6）【例2.3】终端反射系数、驻波比与第一波腹/波节点

> **【例题 2-3】**
> 一根特性阻抗为 $Z_0=50\ \Omega$ 的无耗均匀传输线，终端接 $Z_l=40-j30\ \Omega$ 的负载。求终端反射系数、驻波比、第一电压波腹点与第一电压波节点的位置。
>
> **解：**
> **（1）终端反射系数**
> $$\Gamma_l=\frac{Z_l-Z_0}{Z_l+Z_0}=\frac{40-j30-50}{40-j30+50}=\frac{-10-j30}{90-j30}$$
> 分子分母同乘 $90+j30$：
> $$\Gamma_l=\frac{(-10-j30)(90+j30)}{90^{2}+30^{2}}
> =\frac{-900-j300-j2700+900}{9000}=\frac{-j3000}{9000}=-\frac{j}{3}=\frac{1}{3}e^{-j\pi/2}$$
> 即 $|\Gamma_l|=\dfrac{1}{3}$，$\varphi_l=-\dfrac{\pi}{2}$。
> **（2）驻波比**
> $$\rho=\frac{1+|\Gamma_l|}{1-|\Gamma_l|}=\frac{1+1/3}{1-1/3}=2$$
> **（3）第一电压波腹点**：由式 (2-4-17)
> $$z_{\max}=\frac{\varphi_l\lambda}{4\pi}+\frac{n\lambda}{2}=-\frac{\lambda}{8}+\frac{n\lambda}{2}$$
> $n=0$ 给出 $-\lambda/8<0$（不合理），故取 $n=1$：$z_{\max}=\dfrac{3\lambda}{8}$。
> **（4）第一电压波节点**：由式 (2-4-18)
> $$z_{\min}=\frac{\varphi_l\lambda}{4\pi}+(2n+1)\frac{\lambda}{4}=-\frac{\lambda}{8}+\frac{\lambda}{4}=\frac{\lambda}{8}\quad(n=0)$$
>
> **验算**：在 $z=\lambda/8$ 处，$\beta z=\pi/4$，$\tan\beta z=1$，
> $$Z_{\mathrm{in}}=50\times\frac{0.8-j0.6+j}{1+j(0.8-j0.6)}=50\times\frac{0.8+j0.4}{1.6+j0.8}=25\ \Omega=\frac{Z_0}{\rho}$$
> 确实是**波节**（$R_{\min}=25\ \Omega$）。在 $z=3\lambda/8$ 处，$\tan\beta z=-1$，
> $$Z_{\mathrm{in}}=50\times\frac{0.8-j0.6-j}{1-j(0.8-j0.6)}=50\times\frac{0.8-j1.6}{0.4-j0.8}=100\ \Omega=Z_0\rho$$
> 确实是**波腹**（$R_{\max}=100\ \Omega$）。
>
> **讨论（三个教学点）：**
> 1. **本题属于情形 (3)**：$|Z_l|=\sqrt{40^{2}+30^{2}}=50\ \Omega=Z_0$，故 $\varphi_l=\pm\pi/2$，取 $\varphi_l=-\pi/2$（$X_l<0$，容性）。这解释了为什么答案异常"整齐"。
> 2. **$\varphi_l<0$ 时 $n$ 必须取 1**：第一波腹点不在 $\lambda/8$ 而在 $3\lambda/8$。可以用"物理常识"快速校验：容性负载使**波节向负载侧移动**，所以第一波节应当在 $0<z<\lambda/4$ 内（本题为 $\lambda/8$），而第一波腹则被"挤"到 $3\lambda/8$。
> 3. **升华**：本题的第二种问法更常见——"已知 $z_{\min}$ 与 $\rho$，求 $Z_l$"。两种问法是同一条链的两端：
>    $$Z_l\ \xrightarrow{\ \Gamma_l\ }\ |\Gamma_l|,\varphi_l\ \xrightarrow{\ \text{式(2-4-17)(2-4-18)}\ }\ z_{\max},z_{\min}
>    \qquad\text{或}\qquad
>    \rho,z_{\min}\ \xrightarrow{\ \text{式(2-3-23)(2-3-19)}\ }\ Z_l$$
>    这就是**"输入阻抗 $\Leftrightarrow$ 负载"**的双向通道，也是 2.6 节史密斯圆图要一图打尽的全部内容。

### 2.4.6 本节考点清单

> **【考点】**
> - **题型**：工作状态判断（给 $Z_l$ 判断行波/驻波/行驻波）、波形作图（画 $|U(z)|$、$|I(z)|$、标波腹波节）、计算（$\Gamma_l$、$\rho$、$z_{\max}$、$z_{\min}$、$Z_{\mathrm{in}}$ 互算）、证明（$R_{\max}R_{\min}=Z_0^{2}$、波腹波节处阻抗为实数）。
> - **常见设问**：①"$Z_l$ 为何值时出现驻波？为什么纯电抗能造成全反射？"②"短路线的电压波节在哪些位置？终端是什么？"③"为什么驻波状态下没有功率传输？"④"$\varphi_l<0$ 时如何确定第一波腹点？"
> - **易错点**：①把"电压波腹"与"电流波腹"位置搞反（电压波腹 ↔ 电流波节）；②$z_{\max}$、$z_{\min}$ 公式中 $\varphi_l\lambda/(4\pi)$ 项漏写 $\pi$ 或错写成 $\varphi_l\lambda/(2\pi)$；③$\varphi_l<0$ 时忘记取 $n=1$；④误认为纯电抗负载时线上"处处没有能量"——能量是**振荡**的，只是**净传输为零**。
> - **难度**：★★★★★

## 2.5 传输线的传输功率、效率和损耗

### 2.5.1 有耗线上的电压、电流与功率

有耗线 $\gamma=\alpha+j\beta$，$\alpha>0$。为便于分析，先假设**损耗不大、$Z_0$ 近似为实数**。由式 (2-2-9) 与式 (2-3-16)：

$$
U(z)=A_1e^{\alpha z}\left(e^{j\beta z}+\Gamma_le^{-j\beta z}\right),
\qquad
I(z)=\frac{A_1}{Z_0}e^{\alpha z}\left(e^{j\beta z}-\Gamma_le^{-j\beta z}\right)
\tag{2-5-1}
$$

**注意幅度因子 $e^{\alpha z}$**：它同时出现在两个"波"的前面，含义是"**以负载为参照，越往信源方向（$z$ 越大）波的幅度越大**"。这符合物理直觉——波从信源出发向负载传播时一路衰减，所以它在信源端最强、在负载端最弱。

> **【易错点】**
> 在式 (2-5-1) 中，$e^{\alpha z}$ 是**公因子**，$e^{-2\gamma z}=e^{-2\alpha z}e^{-j2\beta z}$ 才是反射系数的相对因子。把两者混在一起，是"有耗线功率公式"最常见的错误来源。

### 2.5.2 传输功率

定义某点 $z$ 的**传输功率（净功率）**为

$$
P(z)=\frac{1}{2}\mathrm{Re}\!\left[U(z)I^{*}(z)\right]
=\frac{1}{2}\mathrm{Re}\!\left[\frac{|A_1|^{2}}{Z_0}e^{2\alpha z}\left(e^{j\beta z}+\Gamma_le^{-j\beta z}\right)\left(e^{-j\beta z}-\Gamma_l^{*}e^{j\beta z}\right)\right]
$$

把括号乘开，注意 $e^{j\beta z}e^{-j\beta z}=1$：

$$
\left(1-\Gamma_l^{*}e^{j2\beta z}+\Gamma_le^{-j2\beta z}-|\Gamma_l|^{2}\right)
=\underbrace{\left(1-|\Gamma_l|^{2}\right)}_{\text{实数}}-\underbrace{2j\,\mathrm{Im}\!\left[\Gamma_le^{-j2\beta z}\right]}_{\text{纯虚数（取实部后消失）}}
$$

于是

$$
P(z)=\frac{|A_1|^{2}}{2Z_0}\left(e^{2\alpha z}-|\Gamma_l|^{2}e^{-2\alpha z}\right)
=\underbrace{\frac{|A_1|^{2}}{2Z_0}e^{2\alpha z}}_{P_{\mathrm{in}}(z)}
-\underbrace{\frac{|A_1|^{2}|\Gamma_l|^{2}}{2Z_0}e^{-2\alpha z}}_{P_r(z)}
\tag{2-5-2}
$$

即**净功率 = 入射波功率 − 反射波功率**：

$$
P_{\mathrm{in}}(z)=\frac{|A_1|^{2}}{2Z_0}e^{2\alpha z},
\qquad
P_r(z)=\frac{|A_1|^{2}|\Gamma_l|^{2}}{2Z_0}e^{-2\alpha z},
\qquad
\frac{P_r(z)}{P_{\mathrm{in}}(z)}=\left|\Gamma(z)\right|^{2}
\tag{2-5-3}
$$

> **【核心概念】**
> **反射波功率等于"入射波功率乘以该点反射系数的模平方"**，即 $P_r(z)=|\Gamma(z)|^{2}P_{\mathrm{in}}(z)$。这才是普适的写法；工程上有时候简写成 $P_r=|\Gamma_l|^{2}P_{\mathrm{in}}$，那是**只看负载端（$z=0$）**或忽略损耗的情形。
> 互易定理告诉我们：$|\Gamma(z)|^{2}$ 是"**功率反射系数**"，而 $\Gamma(z)$ 本身是"**电压反射系数**"，两者之间差一个平方——考试中常在这里设陷阱。

**两个关键位置的功率**：

- **负载处（$z=0$）——负载吸收的功率**
  $$
  P(0)=\frac{|A_1|^{2}}{2Z_0}\left(1-|\Gamma_l|^{2}\right)
  \tag{2-5-4}
  $$
  匹配时 $|\Gamma_l|=0$，$P(0)=\dfrac{|A_1|^{2}}{2Z_0}$ 最大，**入射功率全部被负载吸收**。
- **始端（$z=l$）——信源送出的功率**
  $$
  P(l)=\frac{|A_1|^{2}}{2Z_0}\left(e^{2\alpha l}-|\Gamma_l|^{2}e^{-2\alpha l}\right)
  \tag{2-5-5}
  $$

### 2.5.3 传输效率

> **【核心概念】**
> **传输效率**定义为"**负载吸收的功率与信源送出的功率之比**"：
> $$\eta=\frac{P(0)}{P(l)}
> =\frac{1-|\Gamma_l|^{2}}{e^{2\alpha l}-|\Gamma_l|^{2}e^{-2\alpha l}}
> \tag{2-5-6}$$

**两种极限情形**：

- **阻抗匹配**（$|\Gamma_l|=0$）：传输效率**最高**
  $$
  \eta_{\max}=e^{-2\alpha l}
  \tag{2-5-7}
  $$
  它**只取决于传输线的损耗**（$\alpha l$），与负载无关。这也是工程上"$\alpha$ 越小、线越短，效率越高"的定量表达。式 (2-5-6) 也可改写为
  $$
  \eta=e^{-2\alpha l}\cdot\frac{1-|\Gamma_l|^{2}}{1-|\Gamma_l|^{2}e^{-4\alpha l}}
  \tag{2-5-8}
  $$
- **全反射**（$|\Gamma_l|=1$）：$P(0)=0$，$\eta=0$，全部功率被反射回去（有耗线上反射波还要再衰减一次）。

> **【工程应用】**
> 式 (2-5-6) 说明：**失配不仅使负载得不到全部功率，还使线上的损耗"雪上加霜"**——入射波与反射波在同一段线上各走一遍，都要按 $e^{-\alpha l}$ 衰减，总损耗相当于"走了两趟"。因此微波系统既要求**低损耗线**（降低 $\alpha l$），也要求**良好匹配**（降低 $|\Gamma_l|$）。

#### 【例2.4】效率、驻波比与回波损耗的综合计算

> **【例题 2-4】**
> 一根 $50\ \Omega$ 同轴线长 $l=20\ \mathrm{m}$，衰减常数 $\alpha=0.1\ \mathrm{dB/m}$，终端接负载使线上驻波比 $\rho=2$。求：(1) 终端反射系数模值；(2) 匹配时的传输效率；(3) 实际传输效率；(4) 回波损耗。
>
> **解：**
> **(1)** $|\Gamma_l|=\dfrac{\rho-1}{\rho+1}=\dfrac{2-1}{2+1}=\dfrac{1}{3}$。
> **(2)** 先统一量纲：$\alpha=0.1\ \mathrm{dB/m}=\dfrac{0.1}{8.686}=1.15\times10^{-2}\ \mathrm{Np/m}$，故
> $$\alpha l=1.15\times10^{-2}\times20=0.230\ \mathrm{Np},\qquad
> \eta_{\max}=e^{-2\alpha l}=e^{-0.460}=0.631$$
> （等价算法：单向损耗 $0.1\times20=2\ \mathrm{dB}$，功率因子 $10^{-2/10}=0.631$ ✓）
> **(3)** 代入式 (2-5-6)：
> $$\eta=\frac{1-\left(\frac{1}{3}\right)^{2}}{e^{0.460}-\left(\frac{1}{3}\right)^{2}e^{-0.460}}
> =\frac{0.889}{1.584-0.070}=0.587$$
> **(4)** 回波损耗（见 2.5.4 节定义）
> $$L_r=-20\lg|\Gamma_l|=-20\lg\frac{1}{3}=20\lg3=9.54\ \mathrm{dB}$$
>
> **讨论：** 匹配时的效率为 $63.1\%$，失配（$\rho=2$）后降到 $58.7\%$，**损失了约 $4.4$ 个百分点**。这说明：**失配对效率的伤害，与线本身的损耗是同量级的**，不能只顾"用好线"而忽略"接好负载"。

### 2.5.4 回波损耗与插入损耗

#### （1）回波损耗（Return Loss）

> **【核心概念】**
> **回波损耗**定义为一个点上的**入射波功率与反射波功率之比**取分贝：
> $$L_r=10\lg\frac{P_{\mathrm{in}}(z)}{P_r(z)}\ \mathrm{dB}
> =-10\lg|\Gamma(z)|^{2}=-20\lg|\Gamma(z)|\ \mathrm{dB}
> \tag{2-5-9}$$
> **物理意义**：$L_r$ 越大，说明反射回来的功率越少、匹配越好。理想匹配时 $|\Gamma|=0$，$L_r\to+\infty\ \mathrm{dB}$。

> **【易错点】**
> **关于"回波损耗"的两种定义，必须说清以免歧义：**
> - **定义 A（推荐，也是本书采用的定义）**：$L_r=10\lg\dfrac{P_{\mathrm{in}}}{P_r}=-20\lg|\Gamma|$，**取正值，越大越好**。$\rho=2$ 时 $L_r=9.54\ \mathrm{dB}$。
> - **定义 B**：直接取反射系数的分贝值 $20\lg|\Gamma|\le0$，此时是**负数，越接近 $0$ 越好**。它常被记作 $S_{11}$（dB），例如 $S_{11}=-9.54\ \mathrm{dB}$。
> **记法建议**：凡是看到"回波损耗 $XX\ \mathrm{dB}$"，先看符号——正数按定义 A 理解（越大越好），负数按定义 B 理解（越接近 0 越好）。两者只是相差一个负号，**物理含义完全一致：都表示反射的强弱**。
> 因此"$L_r$ 下降表示反射下降"这句话，**只在定义 B（负值）下成立**；按定义 A，则是"**$L_r$ 下降表示反射上升（匹配变差）**"。答题时务必先声明定义。

#### （2）插入损耗（Insertion Loss）

$$
L_i=10\lg\frac{P_{\mathrm{in}}}{P_t}\ \mathrm{dB}
\tag{2-5-10}
$$

其中 $P_t$ 是**到达负载（或被负载吸收）的功率**。它是"**输入功率有多少没能送到负载**"的度量，因此**损耗越大、失配越严重，$L_i$ 越大**。理想无耗且完全匹配时 $L_i=0\ \mathrm{dB}$。

> **【易错点】**
> 插入损耗与回波损耗不是一回事：**回波损耗只描述"反射回去多少"，插入损耗描述"最终没送到负载多少"**。一个纯电抗失配（无耗）系统可以有很小的插入损耗（能量只是反射回信源，并未被消耗），但它一定有严重的回波损耗（反射强）。

### 2.5.5 功率的单位：dBm 与 dBW

> **【记忆技巧】**
> 工程上功率的"对数单位"有两种基准：
> $$\mathrm{dBm}=10\lg\frac{P}{1\ \mathrm{mW}},\qquad \mathrm{dBW}=10\lg\frac{P}{1\ \mathrm{W}}
> \tag{2-5-11}$$
> 两者的关系是**固定的 $30\ \mathrm{dB}$**：$\mathrm{dBm}=\mathrm{dBW}+30$。

| 功率 | $\mathrm{dBm}$ | $\mathrm{dBW}$ |
|---|---|---|
| $1\ \mu\mathrm{W}$ | $-30$ | $-60$ |
| $1\ \mathrm{mW}$ | $0$ | $-30$ |
| $0.1\ \mathrm{W}$ | $20$ | $-10$ |
| $1\ \mathrm{W}$ | $30$ | $0$ |
| $10\ \mathrm{W}$ | $40$ | $10$ |
| $100\ \mathrm{W}$ | $50$ | $20$ |

> **【工程应用】**
> dBm 的好处是把"乘除"变成"加减"：一个增益 $20\ \mathrm{dB}$ 的放大器把 $-10\ \mathrm{dBm}$ 的输入变成 $+10\ \mathrm{dBm}$（$10\ \mathrm{mW}$）；一段损耗 $3\ \mathrm{dB}$ 的电缆再接 $20\ \mathrm{dB}$ 增益，净增益就是 $17\ \mathrm{dB}$。**只要单位统一，链路预算就是一条加法链**——这是微波系统设计中"链路计算"的基本功。

### 2.5.6 本节考点清单

> **【考点】**
> - **题型**：填空（效率定义、dBm 与 dBW 差 $30\ \mathrm{dB}$、$1\ \mathrm{Np}=8.686\ \mathrm{dB}$）、计算（$P(z)$、$\eta$、$L_r$、$L_i$）、简答（为什么匹配时效率最高、回波损耗两种定义）。
> - **常见设问**：①"写出有耗线上任意点的传输功率表达式，并说明 $e^{2\alpha z}$ 与 $e^{-2\alpha z}$ 的含义"；②"传输效率在什么条件下最高？最高值是多少？"；③"$\rho=2$ 时回波损耗是多少 dB？"
> - **易错点**：①把 $P_r/P_{\mathrm{in}}$ 写成 $|\Gamma|$ 而不是 $|\Gamma|^{2}$；②$\mathrm{Np}$ 与 $\mathrm{dB}$ 混用（$1\ \mathrm{Np}=8.686\ \mathrm{dB}$，是近似 $20\lg e$）；③把 $\eta_{\max}=e^{-2\alpha l}$ 写成 $e^{-\alpha l}$（**功率**衰减是电压衰减的平方）；④dBm 与 dBW 相差 $30\ \mathrm{dB}$ 而不是 $10\ \mathrm{dB}$。
> - **难度**：★★★

## 2.6 史密斯圆图（Smith Chart）

微波工程中反复出现三类问题：**$Z\leftrightarrow\Gamma\leftrightarrow\rho$ 的换算**、**沿线阻抗的变换**、**阻抗匹配的设计**。这三种计算都可以用公式完成，但公式里全是 $\tan$ 与复数的乘除，容易出错、也看不出"物理图像"。

**史密斯圆图（Smith Chart）**用一个图把这三件事一网打尽：**它把整个右半阻抗平面（$R\ge0$ 的无穷大区域）一一映射到反射系数平面上的单位圆内**。它的价值在于——**复数的乘除运算变成了图上的"转圈"与"读数"**。

> **【考点】**
> 史密斯圆图是本章**必考工具**，考试要求：
> 1. 会**看懂**圆图（等 $r$ 圆、等 $x$ 圆、等 $\rho$ 圆、波长标尺、三个特殊点）；
> 2. 会**用圆图**做四类计算（阻抗↔导纳、求 $\Gamma$ 与 $\rho$、求任意点 $Z_{\mathrm{in}}$、由 $\rho$ 与 $z_{\min}$ 反求 $Z_l$）；
> 3. 会用**单枝节匹配**的圆图设计（2.7 节）；
> 4. 会用计算机辅助工具（Smith 软件）验证结果。

### 2.6.1 史密斯圆图的核心思想

> **【核心概念】**
> 圆图的构造建立在三个层层递进的思想上：
> **(1) 归一化思想**：不同系统的 $Z_0$ 不同，直接画 $Z$ 无法通用，因此统一除以 $Z_0$，把问题变成"归一化阻抗 $\bar z$ 与 $\Gamma$ 的一一对应"。
> **(2) 以反射系数为基底**：因为 $|\Gamma(z)|\le1$ 恒成立（无源负载），整个 $\Gamma$ 平面中**有用的只有单位圆内部**；而且沿传输线移动时 $|\Gamma|$ **不变**、只有相位变化，于是"沿线移动"就是"**沿同心圆转圈**"。
> **(3) 套覆等阻抗圆**：在 $\Gamma$ 平面里，等电阻线与等电抗线恰好都是**圆**（这是 $\bar z=\dfrac{1+\Gamma}{1-\Gamma}$ 这个分式线性变换的"天然几何性质"），把它们画上去，就得到了可以直接读数的圆图。

#### （1）归一化

$$
\bar Z_{\mathrm{in}}(z)=\frac{Z_{\mathrm{in}}(z)}{Z_0},
\qquad
\Gamma(z)=\frac{\bar Z_{\mathrm{in}}(z)-1}{\bar Z_{\mathrm{in}}(z)+1},
\qquad
\bar Z_{\mathrm{in}}(z)=\frac{1+\Gamma(z)}{1-\Gamma(z)}
\tag{2-6-1}
$$

归一化后，$Z_0\rightarrow1$，三个特殊点变成了：$\bar z=0\Rightarrow\Gamma=-1$，$\bar z=1\Rightarrow\Gamma=0$，$\bar z=\infty\Rightarrow\Gamma=+1$。这三个点就是圆图上的**短路点、匹配点、开路点**。

#### （2）以反射系数为基底

$$
\Gamma(z)=\Gamma_le^{-j2\beta z}=|\Gamma_l|e^{j(\varphi_l-2\beta z)}=|\Gamma_l|e^{j\theta},
\qquad
\theta=\varphi_l-2\beta z=-\frac{4\pi z}{\lambda}+\varphi_l
\tag{2-6-2}
$$

**三条读数规则**（这三条必须背熟）：

- **径向读 $|\Gamma|$**：点到圆心的距离就是 $|\Gamma|$；由 $|\Gamma|=\dfrac{\rho-1}{\rho+1}$，也可以**直接读等 $\rho$ 圆**；
- **角向读相位**：$\theta<0$ 表示"相位滞后"，在图上表现为**顺时针**；
- **沿线移动的方向**：
  - $z>0$（**向信源**，即从负载向输入端走）$\Rightarrow\theta$ 减小 $\Rightarrow$ **顺时针转**；
  - $z<0$（**向负载**走）$\Rightarrow\theta$ 增大 $\Rightarrow$ **逆时针转**；
  - 转一周 $360^{\circ}$ 对应相位变化 $2\pi$，即 $\theta$ 变化 $2\beta z=2\pi\Rightarrow z=\dfrac{\lambda}{2}$，所以**圆图转一圈 = 沿线走 $\lambda/2$**。

> **【记忆技巧】**
> **"顺时针向信源、逆时针向负载"**——把这八个字写在草稿纸右上角，能避免圆图题里一半的方向错误。
> 顺带回答一个常见疑问："**为什么反射系数和输入阻抗都有二分之波长重复性？**"因为沿线移动 $\lambda/2$ 时相位变化 $2\beta\cdot\dfrac{\lambda}{2}=2\pi$，$\Gamma$ 回到原值；而 $Z_{\mathrm{in}}$ 是 $\Gamma$ 的函数，自然也随之复原。**同一件事的两种表述。**

#### （3）套覆等阻抗圆

设归一化阻抗 $\bar Z=r+jx$，代入 $\bar Z=\dfrac{1+\Gamma}{1-\Gamma}$（$\Gamma=\Gamma_r+j\Gamma_i$）：

$$
r+jx=\frac{1+\Gamma_r+j\Gamma_i}{1-\Gamma_r-j\Gamma_i}
=\frac{\left(1+\Gamma_r+j\Gamma_i\right)\left(1-\Gamma_r+j\Gamma_i\right)}{\left(1-\Gamma_r\right)^{2}+\Gamma_i^{2}}
=\frac{1-\Gamma_r^{2}-\Gamma_i^{2}+j2\Gamma_i}{\left(1-\Gamma_r\right)^{2}+\Gamma_i^{2}}
$$

分离实部与虚部：

$$
r=\frac{1-\Gamma_r^{2}-\Gamma_i^{2}}{\left(1-\Gamma_r\right)^{2}+\Gamma_i^{2}},
\qquad
x=\frac{2\Gamma_i}{\left(1-\Gamma_r\right)^{2}+\Gamma_i^{2}}
\tag{2-6-3}
$$

**这两个式子各自就是一个圆方程**：

> **【公式推导】**
> **CASE 1：等 $r$ 圆**
> 由 $r\left[\left(1-\Gamma_r\right)^{2}+\Gamma_i^{2}\right]=1-\Gamma_r^{2}-\Gamma_i^{2}$ 整理：
> $$(r+1)\left(\Gamma_r^{2}+\Gamma_i^{2}\right)-2r\Gamma_r+(r-1)=0$$
> 两边除以 $(r+1)$ 并配方：
> $$\left(\Gamma_r-\frac{r}{1+r}\right)^{2}+\Gamma_i^{2}=\left(\frac{1}{1+r}\right)^{2}
> \tag{2-6-4}$$
> 即**圆心在 $\left(\dfrac{r}{1+r},\ 0\right)$、半径为 $\dfrac{1}{1+r}$ 的圆**。$r=0$ 时退化为单位圆本身（$|\Gamma|=1$）；$r\to\infty$ 时退化为点 $(1,0)$（开路点）。所有等 $r$ 圆**都内切于点 $(1,0)$**。
>
> **CASE 2：等 $x$ 圆**
> 由 $x\left[\left(1-\Gamma_r\right)^{2}+\Gamma_i^{2}\right]=2\Gamma_i$ 整理：
> $$\Gamma_r^{2}-2\Gamma_r+1+\Gamma_i^{2}-\frac{2}{x}\Gamma_i=0
> \Longrightarrow
> \left(\Gamma_r-1\right)^{2}+\left(\Gamma_i-\frac{1}{x}\right)^{2}=\frac{1}{x^{2}}
> \tag{2-6-5}$$
> 即**圆心在 $\left(1,\ \dfrac{1}{x}\right)$、半径为 $\dfrac{1}{\vert x\vert}$ 的圆**。$x>0$（感性）时圆心在**上半平面**，$x<0$（容性）时圆心在**下半平面**，$x=0$ 时退化为**实轴**（纯阻线）。所有等 $x$ 圆**也内切于点 $(1,0)$**。

#### （1）圆图上的"六件东西"

| 元素 | 数学表达式 | 图上位置 |
|---|---|---|
| 单位圆（$r=0$） | $\vert\Gamma\vert=1$ | 圆图的外边界，对应**纯电抗** |
| 等 $r$ 圆 | 圆心 $\left(\dfrac{r}{1+r},0\right)$，半径 $\dfrac{1}{1+r}$ | 一族内切于开路点的圆 |
| 等 $x$ 圆 | 圆心 $\left(1,\dfrac{1}{x}\right)$，半径 $\dfrac{1}{\vert x\vert}$ | 一族内切于开路点的圆弧，上感下容 |
| 实轴 | $x=0$ | **纯阻线**：左端 $-1$（短路），中间 $0$（匹配），右端 $+1$（开路） |
| 等 $|\Gamma|$ 圆（又称**等反射系数圆**） | $\vert\Gamma\vert=\text{const}$ | **以匹配点 $(0,0)$ 为圆心的一族同心圆**——这是圆图上"移动观察点"的轨道 |
| 等 $\rho$ 圆 | $\vert\Gamma\vert=\dfrac{\rho-1}{\rho+1}$ | 与等 $\vert\Gamma\vert$ 圆**完全重合**（因为 $\rho$ 由 $\vert\Gamma\vert$ 唯一决定） |
| 波长标尺 | $\theta=-4\pi z/\lambda$ | 外圈刻度，"向信源"刻度顺时针增加 |

> **【核心概念】**
> **等反射系数圆是史密斯圆图上唯一"能走"的圆。** 沿传输线移动观察点时，$\vert\Gamma\vert$ 保持不变、只有相位随 $z$ 变化（式 2-3-10），所以在圆图上就是从当前点出发，**沿着过该点、以原点为圆心的那个等反射系数圆旋转**。旋转角度由 $2\beta z=4\pi z/\lambda$ 决定，一周 $360^{\circ}$ 恰好对应 $\lambda/2$。
>
> 请注意区分三组容易混淆的圆：
> - **等 $r$ 圆、等 $x$ 圆**：描述"一个具体的阻抗值长什么样"，是**静态的读数网格**；
> - **等反射系数圆（等 $|\Gamma|$ 圆）**：描述"沿线移动时轨迹如何变化"，是**动态的运动轨道**；
> - **等 $\rho$ 圆**：与等反射系数圆是**同一族圆的两个名字**——因为 $\rho=\dfrac{1+|\Gamma|}{1-|\Gamma|}$ 是 $\vert\Gamma\vert$ 的单调函数，两者一一对应。
>
> 考试中"沿等反射系数圆顺时针转 $0.2\lambda$""以原点为圆心画等 $|\Gamma|$ 圆"这类操作，都是指这一族圆。

#### （2）三个特殊点与驻波比标定

- **短路点 $(-1,0)$**：$r=0$、$x=0$，$\Gamma=-1$；
- **开路点 $(1,0)$**：$r=\infty$、$x=\infty$，$\Gamma=+1$；
- **匹配点 $(0,0)$**：$r=1$、$x=0$，$\Gamma=0$，**这是所有等 $\rho$ 圆的圆心**。

**驻波比标定**：在正实轴上，$\Gamma_i=0$、$\Gamma_r>0$，由式 (2-6-3) 第一个式子可解出 $r=\dfrac{1+\Gamma_r}{1-\Gamma_r}$。而驻波比 $\rho$ 与 $\Gamma_r$ 的关系为

$$
\Gamma_r=\frac{\rho-1}{\rho+1}
\quad\Longleftrightarrow\quad
\rho=\frac{1+\Gamma_r}{1-\Gamma_r}=r\quad(\text{沿正实轴})
\tag{2-6-6}
$$

**结论**：正实轴上的 $r$ 值就是 $\rho$ 值，与式 (2-3-23) 完全一致；**等 $\rho$ 圆就是以原点为圆心的同心圆**，$\rho$ 越大圆越大，$\rho=1$ 退化为原点（匹配点）。

#### （3）等导纳圆图

由 $\Gamma$ 求归一化导纳：

$$
\bar Y(z)=\frac{Y(z)}{Y_0}=\frac{1}{\bar Z(z)}=\frac{1-\Gamma(z)}{1+\Gamma(z)}
\tag{2-6-7}
$$

对比归一化阻抗 $\bar Z=\dfrac{1+\Gamma}{1-\Gamma}$，可见

$$
\bar Y(\Gamma)=\bar Z(-\Gamma)
\tag{2-6-8}
$$

即：**把阻抗圆图整体绕原点旋转 $180^{\circ}$（等价于 $\Gamma\to-\Gamma=\Gamma e^{j\pi}$），就得到导纳圆图。**

> **【记忆技巧】**
> 转 $180^{\circ}$ 的含义是：阻抗圆图上的**短路点 $(-1,0)$ 变成开路点**（短路的导纳是开路，$\infty$），**匹配点不动**（$Y_0=1/Z_0$），上半平面的感性变成下半平面的容性（电感的导纳是容性）。三条对应关系一次记住，就不必再背导纳圆图的构造了。

### 2.6.3 圆图的使用方法与步骤

#### （1）标准操作流程（阻抗 → 任意点输入阻抗）

> **【考点】**
> **圆图操作的"五步法"**：
> **第 1 步 归一化**：把负载阻抗除以 $Z_0$，得 $\bar Z_l=r_l+jx_l$（这一步**绝不能省**）。
> **第 2 步 定点**：在圆图上找 $r=r_l$ 的等 $r$ 圆与 $x=x_l$ 的等 $x$ 圆弧的**交点**，即 $\bar Z_l$。
> **第 3 步 求 $\Gamma$**：量出该点到圆心的距离（用单位圆半径 $1$ 作标尺），得 $|\Gamma_l|$；读出该点的角度（从正实轴逆时针为正），得 $\varphi_l$。
> **第 4 步 求 $\rho$**：由 $|\Gamma_l|$ 所在的等 $\rho$ 圆读 $\rho$，或用 $\rho=\dfrac{1+|\Gamma_l|}{1-|\Gamma_l|}$；也可以直接沿等 $|\Gamma|$ 圆转到**正实轴**，读到的 $r$ 值就是 $\rho$。
> **第 5 步 沿线移动**：以圆心为轴、沿该等 $|\Gamma|$ 圆**顺时针旋转**
> $$\Delta\theta=2\beta z=\frac{4\pi z}{\lambda}=720^{\circ}\cdot\frac{z}{\lambda}
> \tag{2-6-9}$$
> 到新位置后读 $r$、$x$，乘以 $Z_0$ 即得 $Z_{\mathrm{in}}(z)$。

#### （2）四类典型问题的圆图做法

| 问题 | 圆图做法 |
|---|---|
| **求导纳 $Y$** | 找到 $\bar Z$ 点后，**绕原点转 $180^{\circ}$** 得 $\bar Y$，再乘 $Y_0=1/Z_0$ |
| **求 $\Gamma$ 与 $\rho$** | 直接量半径（$\vert \Gamma\vert $）与角度（$\varphi$）；$\rho$ 由等 $\rho$ 圆读出 |
| **求 $Z_{\mathrm{in}}(z)$** | 沿等 $\vert \Gamma\vert $ 圆顺时针转 $720^{\circ}\cdot z/\lambda$ |
| **由 $\rho$ 与 $z_{\min}$ 反求 $Z_l$** | 在**正实轴**上取 $r=\rho$（这是波腹点，阻抗为 $Z_0\rho$）；沿等 $\vert \Gamma\vert $ 圆**逆时针**（向负载）转 $720^{\circ}\cdot z_{\min}/\lambda$；读出 $\bar Z_l$ 并乘 $Z_0$ |

> **【易错点】**
> **圆图使用的三条 Remark（考试高频）**：
> (1) **使用打印/纸质圆图前必须归一化**——圆图上所有的 $r$、$x$ 都是归一化值，直接标实际阻抗会得到相差 $Z_0$ 倍的错误结果；
> (2) **使用计算机软件时不用手工归一化，但必须预先设定工作频率 $f$ 与特性阻抗 $Z_0$**——软件内部完成归一化，而 $f$ 决定"每转一圈代表多少电长度"，$Z_0$ 决定实际阻抗的换算；
> (3) **使用软件时只能"顺时针向信源"旋转**：若需要"向负载"方向走 $z/\lambda$，就等价于向信源方向走 $\left(\dfrac{1}{2}-\dfrac{z}{\lambda}\right)$（利用 $\lambda/2$ 周期性）。这条规则源于软件的波长标尺实现方式，务必记住，否则方向会完全走反。

#### （3）学习要求

1. **会用 Smith 软件**：能输入 $Z_0$、$f$、负载阻抗，读出 $\Gamma$、$\rho$、任意点的 $Z_{\mathrm{in}}$，并完成单枝节匹配设计；
2. **会用纸质圆图**独立完成 2.6.4 节的全部例题，并与解析法结果互相对照——**"手算 + 圆图"两条腿走路，是本章唯一可靠的学习方法**。

### 2.6.4 圆图例题四则（解析法与圆图法对照）

> **【例题 2-5】**
> 已知阻抗 $Z=30+j40\ \Omega$，特性阻抗 $Z_0=50\ \Omega$，求导纳 $Y$。
>
> **解析法：**
> 归一化：$\bar Z=\dfrac{30+j40}{50}=0.6+j0.8$。
> $$Y=\frac{1}{Z}=\frac{1}{30+j40}=\frac{30-j40}{30^{2}+40^{2}}=\frac{30-j40}{2500}=0.012-j0.016\ \mathrm{S}$$
> 即 $Y=12-j16\ \mathrm{mS}$。也可用归一化导纳验证：$\bar Y=\dfrac{1}{\bar Z}=\dfrac{1}{0.6+j0.8}=0.6-j0.8$，而 $Y=\bar Y/Z_0=\dfrac{0.6-j0.8}{50}=12-j16\ \mathrm{mS}$ ✓
> **圆图法：**
> ① 归一化得 $\bar Z=0.6+j0.8$；② 在圆图上找到 $r=0.6$ 与 $x=0.8$ 的交点（上半平面，感性）；③ **绕原点旋转 $180^{\circ}$** 得到 $\bar Y$ 点；④ 读得 $\bar Y=0.6-j0.8$（注意 $r$ 与 $g$、$x$ 与 $b$ 的读数互换且 $b$ 变号）；⑤ 乘 $Y_0=\dfrac{1}{50}\ \mathrm{S}$ 得 $Y=12-j16\ \mathrm{mS}$。
>
> **讨论**：**"转 $180^{\circ}$ 求导纳"是圆图最常用的技巧之一**，尤其在并联枝节匹配中，因为并联问题必须用导纳处理。它的原理就是式 (2-6-8)：$\bar Y(\Gamma)=\bar Z(-\Gamma)$。

> **【例题 2-6】**
> 已知无耗传输线特性阻抗 $Z_0=75\ \Omega$，某点的输入阻抗为 $Z=50+j50\ \Omega$，求反射系数的模值与驻波比。
>
> **解析法：**
> 归一化：$\bar Z=\dfrac{50+j50}{75}=\dfrac{2}{3}+j\dfrac{2}{3}$。
> $$\Gamma=\frac{\bar Z-1}{\bar Z+1}=\frac{-\frac{1}{3}+j\frac{2}{3}}{\frac{5}{3}+j\frac{2}{3}}=\frac{-1+j2}{5+j2}$$
> 分子分母同乘 $5-j2$：
> $$\Gamma=\frac{(-1+j2)(5-j2)}{5^{2}+2^{2}}=\frac{-5+j2+j10+4}{29}=\frac{-1+j12}{29}$$
> $$|\Gamma|=\frac{\sqrt{1+144}}{29}=\frac{\sqrt{145}}{29}=\frac{12.04}{29}=0.415$$
> $$\rho=\frac{1+|\Gamma|}{1-|\Gamma|}=\frac{1.415}{0.585}=2.42$$
> **圆图法：**
> ① 归一化得 $\bar Z=0.667+j0.667$；② 在圆图上定位该点；③ 以圆心到该点的距离（单位圆半径为 1）量得 $|\Gamma|\approx0.415$；④ 沿等 $|\Gamma|$ 圆转到正实轴，读得 $r=2.42$，即 $\rho=2.42$。
>
> **讨论**：注意本题的 $Z_0=75\ \Omega$ 而 $Z_0$ 不等于 $50\ \Omega$——**必须先归一化再上圆图**，这就是 Remark (1) 的实战意义。

> **【例题 2-7】**
> 已知无耗传输线的特性阻抗 $Z_0=50\ \Omega$，负载阻抗 $Z_l=40-j30\ \Omega$。求距离负载 $0.2\lambda$ 处的输入阻抗。
>
> **解析法：**
> 归一化 $\bar Z_l=0.8-j0.6$，终端反射系数（同例题 2-3）
> $$\Gamma_l=\frac{\bar Z_l-1}{\bar Z_l+1}=\frac{-0.2-j0.6}{1.8-j0.6}=-\frac{j}{3}=\frac{1}{3}e^{-j\pi/2}$$
> 在 $z=0.2\lambda$ 处，$2\beta z=\dfrac{4\pi\times0.2\lambda}{\lambda}=0.8\pi$，故
> $$\Gamma(0.2\lambda)=\frac{1}{3}e^{-j\pi/2}e^{-j0.8\pi}=\frac{1}{3}e^{-j1.3\pi}$$
> 因为 $e^{-j1.3\pi}=\cos(-234^{\circ})+j\sin(-234^{\circ})=-0.5878+j0.8090$，所以
> $$\Gamma(0.2\lambda)=\frac{1}{3}\left(-0.5878+j0.8090\right)=-0.1959+j0.2697$$
> $$Z_{\mathrm{in}}=Z_0\frac{1+\Gamma}{1-\Gamma}=50\times\frac{0.8041+j0.2697}{1.1959-j0.2697}=50\times\left(0.5914+j0.3589\right)=29.6+j17.9\ \Omega$$
> （也可用 $\tan$ 公式复核：$\beta z=72^{\circ}$，$\tan72^{\circ}=3.078$，代入式 (2-3-12) 得同一结果。）
> **圆图法：**
> ① 归一化得 $\bar Z_l=0.8-j0.6$，找到该点（下半平面，容性）；② 量得 $|\Gamma_l|=1/3$；③ 沿该等 $|\Gamma|$ 圆**顺时针**转 $720^{\circ}\times0.2=144^{\circ}$；④ 读新点的 $r$、$x$：$r\approx0.59$、$x\approx+0.36$；⑤ 乘 $Z_0$：$Z_{\mathrm{in}}\approx29.6+j17.9\ \Omega$。
>
> **讨论**：$Z_l$ 是容性的（$X_l<0$），转 $0.2\lambda$ 后 $X>0$ 变为感性——**"沿线移动 $\lambda/4$ 以内，电抗的符号可以发生一次改变（经过纯阻点）"**。这个"经过纯阻点"的现象在圆图上表现为：等 $|\Gamma|$ 圆与实轴的**两个交点**，就是线上的两个纯阻点（波腹点与波节点）。

> **【例题 2-8】**
> 已知无耗传输线的特性阻抗 $Z_0=50\ \Omega$，测得传输线上的驻波比 $\rho=5$，电压波节点出现在 $z_{\min}=\lambda/3$ 处。求负载阻抗。
>
> **解析法：**
> **第 1 步**：由 $\rho=5$ 得
> $$|\Gamma_l|=\frac{\rho-1}{\rho+1}=\frac{5-1}{5+1}=\frac{2}{3}$$
> **第 2 步**：由电压波节点位置定相位。电压波节处 $\Gamma$ 为负实数（相位 $\pi$），而 $\Gamma_l=\Gamma(z_{\min})e^{+j2\beta z_{\min}}$，故
> $$\varphi_l=\pi+2\beta z_{\min}=\pi+\frac{4\pi z_{\min}}{\lambda}
> =\pi+\frac{4\pi}{3}=\frac{7\pi}{3}\equiv\frac{\pi}{3}\pmod{2\pi}$$
> **第 3 步**：构造 $\Gamma_l$ 并反求 $Z_l$
> $$\Gamma_l=\frac{2}{3}e^{j\pi/3}=\frac{2}{3}\left(\frac{1}{2}+j\frac{\sqrt{3}}{2}\right)=0.3333+j0.5774$$
> $$Z_l=Z_0\frac{1+\Gamma_l}{1-\Gamma_l}=50\times\frac{1.3333+j0.5774}{0.6667-j0.5774}
> =50\times\left(0.7143+j1.4846\right)=35.7+j74.2\ \Omega$$
> **验算**：$\left|\dfrac{Z_l-50}{Z_l+50}\right|=\dfrac{75.6}{113.4}=0.667$ ✓，相位 $\varphi_l=60^{\circ}$ ✓，与 $z_{\min}=\lambda/3$ 一致。
> **圆图法：**
> ① 由 $\rho=5$ 在**正实轴**上找到 $r=5$ 的点（该点是电压波腹点，$\bar Z=\rho=5$）；② 沿该等 $|\Gamma|$ 圆（半径 $\dfrac{\rho-1}{\rho+1}=\dfrac{2}{3}$）**逆时针（向负载）**转 $720^{\circ}\times\dfrac{1}{3}=240^{\circ}$；③ 读得该点 $\bar Z_l\approx0.71+j1.48$；④ 乘 $Z_0$ 得 $Z_l\approx35.7+j74.2\ \Omega$。
>
> **讨论（本类题目的通用套路）：**
> **"$\rho$ 定大小、$z_{\min}$ 定相位"**是微波阻抗测量的基本方法。因为 $\rho$ 只给出 $|\Gamma|$，波形图样可以整体"平移"，所以必须再用**一个位置信息**（波节点或波腹点的位置）才能唯一确定 $Z_l$。本题中 $z_{\min}=\lambda/3>\lambda/4$，说明第一波节点离负载较远，负载必然是**感性**的（$\varphi_l=\pi/3>0$）——这与"感性负载把波腹拉向负载侧、把波节推向信源侧"的结论一致。

### 2.6.5 本节考点清单

> **【考点】**
> - **题型**：作图读数（在圆图上标点、读数）、计算（用圆图完成 $Z\to Y$、$Z_l\to Z_{\mathrm{in}}$、$\rho,z_{\min}\to Z_l$）、简答（圆图的三个核心思想、为什么转一圈是 $\lambda/2$、为什么导纳圆图转 $180^{\circ}$）。
> - **常见设问**：①"写出等 $r$ 圆、等 $x$ 圆的圆心与半径"；②"$z$ 增大时在圆图上怎么转？为什么？"③"已知 $\bar Z$，如何在圆图上求 $\bar Y$？"④"由 $\rho$ 与 $z_{\min}$ 求 $Z_l$ 的步骤？"
> - **易错点**：①**忘记归一化**；②把"转一圈 = $\lambda$"记成"转一圈 = $\lambda/2$"的反面；③方向搞反（顺时针/逆时针）；④由 $\rho$ 求 $Z_l$ 时从**原点**出发而不是从**正实轴 $r=\rho$** 出发；⑤忘了软件里只能顺时针向信源转。
> - **难度**：★★★★★

## 2.7 阻抗匹配

### 2.7.1 为什么匹配是微波技术的核心

由 2.5 节可知：**失配 $\Rightarrow$ 反射 $\Rightarrow$ 净传输功率下降、效率降低、线上出现高压（可能击穿）、反射波回到信源造成频率牵引甚至损坏功放**。因此，"**让系统工作在行波状态（或接近行波状态）**"成为微波系统设计的第一要务。这就是本章乃至全课程的落点：**微波技术的核心就是匹配，匹配的目的是保证最大功率传输（并保护信源）。**

### 2.7.2 三种匹配状态

> **【核心概念】**
> **（1）负载阻抗匹配**：$Z_l=Z_0$，$\Gamma_l=0$，**负载端无反射**。
> 这是最常见的匹配要求：让负载把入射功率全部吸收掉。实现手段是**阻抗匹配器**（第六章讨论其具体电路，如枝节、阶梯变换器、L 型网络等）。
> **（2）源阻抗匹配**：电源内阻 $Z_g=Z_0$，**反射波回到信源后不再被反射**。
> 它解决的是"信源侧"的问题：即使负载端有反射，反射波回到信源也会被 $Z_g=Z_0$ 吸收而不再次反射，避免波在源与负载之间"来回弹跳"形成驻波。实现手段是**阻抗匹配器**以及**去耦衰减器／隔离器**（后者用铁氧体材料把反射功率"吸收"掉，实现单向传输）。
> **（3）共轭阻抗匹配**：$Z_g$ 为复数时，由**最大功率传输定理**，要求
> $$Z_{\mathrm{in}}=Z_g^{*}
> \tag{2-7-1}$$
> 此时负载获得最大功率
> $$P_{\max}=\frac{E_g^{2}}{8R_g}
> \tag{2-7-2}$$
> 其中 $E_g$ 为信源电动势幅度，$R_g=\mathrm{Re}[Z_g]$。

**式 (2-7-2) 的推导**：共轭匹配时 $Z_{\mathrm{in}}=Z_g^{*}=R_g-jX_g$，回路总阻抗为 $Z_g+Z_{\mathrm{in}}=2R_g$，故回路电流 $I=E_g/(2R_g)$，负载吸收的有功功率

$$
P=\frac{1}{2}|I|^{2}R_g=\frac{1}{2}\cdot\frac{E_g^{2}}{4R_g^{2}}\cdot R_g=\frac{E_g^{2}}{8R_g}\quad\text{（验算通过）}
$$

**三者的关系**：当 $Z_g$、$Z_0$、$Z_l$ **均为实数**时，$Z_g=Z_0$ 与 $Z_l=Z_0$ 同时成立就等价于 $Z_{\mathrm{in}}=Z_g^{*}$（因为 $Z_{\mathrm{in}}=Z_l=Z_0=Z_g=Z_g^{*}$）。所以在这个特例下，**三种匹配是同一件事**。

> **【易错点】**
> "阻抗匹配"与"共轭匹配"不能混为一谈：
> - $Z_l=Z_0$ 是**传输线**意义下的匹配（沿线无反射，$Z_0$ 是实数时同时满足最大功率传输）；
> - $Z_{\mathrm{in}}=Z_g^{*}$ 是**电路**意义下的共轭匹配（只保证负载获得最大功率，不保证沿线无反射——若 $Z_g$ 是复数，则 $Z_{\mathrm{in}}=Z_g^{*}$ 时线上照样有驻波）。
> 题目问"匹配"时要看清问的是哪一种。

### 2.7.3 $\lambda/4$ 阻抗变换法

#### （1）基本原理

由 $\lambda/4$ 变换性 $Z_{\mathrm{in}}(z)Z_{\mathrm{in}}(z+\lambda/4)=Z_0^{2}$，若在特性阻抗为 $Z_{01}$ 的 $\lambda/4$ 线段终端接负载 $Z_l$，则该段线在输入端呈现的阻抗为

$$
Z_{\mathrm{in}}\!\left(\frac{\lambda}{4}\right)
=Z_{01}\frac{Z_l+jZ_{01}\tan\left(\frac{2\pi}{\lambda}\cdot\frac{\lambda}{4}\right)}{Z_{01}+jZ_l\tan\left(\frac{2\pi}{\lambda}\cdot\frac{\lambda}{4}\right)}
=Z_{01}\frac{Z_l+jZ_{01}\tan\frac{\pi}{2}}{Z_{01}+jZ_l\tan\frac{\pi}{2}}
=\frac{Z_{01}^{2}}{Z_l}
\tag{2-7-3}
$$

（利用 $|\tan(\pi/2)|\to\infty$ 时分子分母同除以 $\tan(\pi/2)$ 取极限。）

> **【核心概念】**
> **$\lambda/4$ 线是"阻抗倒置器"**：$Z_{\mathrm{in}}=\dfrac{Z_{01}^{2}}{Z_l}$。
> - 若 $Z_l$ 是**实数** $R_l$，只要取 $Z_{01}=\sqrt{Z_0R_l}$，就有 $Z_{\mathrm{in}}=\dfrac{Z_0R_l}{R_l}=Z_0$，**匹配完成**；
> - 若 $Z_l$ 是**复数** $R_l+jX_l$，则 $Z_{\mathrm{in}}=\dfrac{Z_{01}^{2}}{R_l+jX_l}$ 仍然是复数，**单靠一段 $\lambda/4$ 线无法匹配**。

#### （2）实数负载的情形

$$
Z_{01}=\sqrt{Z_0R_l}
\tag{2-7-4}
$$

**例**：$Z_0=50\ \Omega$，$Z_l=100\ \Omega$，则 $Z_{01}=\sqrt{50\times100}=70.7\ \Omega$。

若 $R_l<Z_0$（例如 $R_l=25\ \Omega$），则 $Z_{01}=\sqrt{50\times25}=35.4\ \Omega$，仍然可以匹配，只是需要一段**特性阻抗更低**（即导体更粗、间距更小）的线段。**这就是 $\lambda/4$ 变换器的工程约束：$Z_{01}$ 必须在可实现范围内。**

#### （3）复数负载的情形：先把负载"变成"纯阻

> **【核心思路】**
> **非实数怎么办？——加一段特性阻抗为 $Z_0$ 的传输线，把负载变换到"波腹点"或"波节点"上。**
> 由 2.4.5 节，电压波腹点处 $Z_{\mathrm{in}}=R_{\max}=Z_0\rho$（纯阻），波节点处 $Z_{\mathrm{in}}=R_{\min}=\dfrac{Z_0}{\rho}$（纯阻）。在这两个位置，负载的"电抗部分被线段的变换作用抵消掉了"。
> 于是匹配步骤为：
> 1. 由 $\rho$ 求出 $R_{\max}=Z_0\rho$ 与 $R_{\min}=\dfrac{Z_0}{\rho}$；
> 2. 从负载向信源走，找到第一个波腹点（距离 $z_{\max}$）或第一个波节点（距离 $z_{\min}$），在该处接 $\lambda/4$ 变换器；
> 3. 取 $Z_{01}=\sqrt{Z_0R_{\max}}=Z_0\sqrt{\rho}$（接在波腹点）或 $Z_{01}=\sqrt{Z_0R_{\min}}=\dfrac{Z_0}{\sqrt{\rho}}$（接在波节点）。

#### （4）$\lambda/4$ 变换器的致命弱点：窄带

因为 $\lambda=\dfrac{c}{f}$，$\lambda/4$ 只在**某一个特定频率 $f_0$** 上成立。当工作频率偏离 $f_0$ 时，变换段的电长度不再是 $\pi/2$，$Z_{\mathrm{in}}$ 立刻偏离 $Z_0$，$\rho$ 迅速上升。

$$
\text{变换段长度}\ l=\frac{\lambda_0}{4}=\frac{c}{4f_0}\ \text{固定}
\quad\Longrightarrow\quad
f\neq f_0\ \text{时}\ \beta l=\frac{2\pi f}{c}\cdot\frac{c}{4f_0}=\frac{\pi}{2}\cdot\frac{f}{f_0}\neq\frac{\pi}{2}
$$

> **【工程应用】**
> **$\lambda/4$ 阻抗变换器是"窄带器件"**。要展宽带宽，办法是用**多节（阶梯）变换器**：把一段 $\lambda/4$ 换成多段长度各为 $\lambda/4$、特性阻抗依次过渡的线段，使总反射在更宽的频带内保持很小（第六章将给出二项式变换器与切比雪夫变换器）。这与"枝节越多带宽越宽"是同一个思路。

#### 【例2.9】$\lambda/4$ 变换器的设计（承接例题 2.3）

> **【例题 2-9】**
> $Z_0=50\ \Omega$ 的无耗传输线终端接 $Z_l=40+j30\ \Omega$。要求用 $\lambda/4$ 变换器实现匹配，求变换段特性阻抗与安装位置。
>
> **解：**
> **第 1 步：求 $\rho$。**
> $$\bar Z_l=\frac{40+j30}{50}=0.8+j0.6,\qquad
> \Gamma_l=\frac{-0.2+j0.6}{1.8+j0.6}=\frac{j}{3}=\frac{1}{3}e^{j\pi/2},\qquad
> \rho=\frac{1+1/3}{1-1/3}=2$$
> **第 2 步：求波腹点、波节点位置**（与例题 2.3 完全相同的载荷，只是 $X_l$ 反号）。
> $$z_{\max}=\frac{\varphi_l\lambda}{4\pi}=\frac{\lambda}{8},\qquad
> z_{\min}=z_{\max}+\frac{\lambda}{4}=\frac{3\lambda}{8}$$
> **第 3 步：两个方案。**
> - **方案 A（接在波腹点 $z_{\max}=\lambda/8$ 处）**：$R_{\max}=Z_0\rho=100\ \Omega$，
>   $$Z_{01}=\sqrt{Z_0R_{\max}}=\sqrt{50\times100}=70.7\ \Omega$$
> - **方案 B（接在波节点 $z_{\min}=3\lambda/8$ 处）**：$R_{\min}=\dfrac{Z_0}{\rho}=25\ \Omega$，
>   $$Z_{01}=\sqrt{Z_0R_{\min}}=\sqrt{50\times25}=35.4\ \Omega$$
>
> **讨论：** 两个方案都可行，选择哪一个取决于**可实现性**：$70.7\ \Omega$ 通常比 $35.4\ \Omega$ 更容易实现（$Z_0$ 与导体尺寸的关系是单调的）。此外方案 A 的变换段离负载更近、总长度更短，工程上更常用。
> **注意**：本题中 $z_{\max}=\lambda/8$ 与例题 2.3 的 $z_{\min}=\lambda/8$ 是**同一个位置**，只是 $X_l$ 的符号相反（一个感性、一个容性），读者可以借此体会"**波腹与波节的位置由 $X_l$ 的符号决定**"。

### 2.7.4 枝节调配器（Stub）

**枝节（stub）**是一段"终端短路或开路"的传输线支路，把它并接或串接在主传输线上，用它的**纯电抗**去抵消负载引入的电抗。

#### （1）枝节的种类与选型

| 分类 | 形式 | 特点 |
|---|---|---|
| 按数量 | 单枝节 / 双枝节 / 多枝节 | **枝节越多，带宽越宽，但结构越复杂**；本章重点掌握**单枝节** |
| 按接入方式 | 串联 / 并联 | 串联用**阻抗**计算，并联用**导纳**计算 |
| 按终端 | 短路 / 开路 | **微波会辐射，无法实现理想开路**，故工程上多用短路线 |

> **【工程应用】**
> 为什么"理想开路"难以实现？因为线端开口会向空间**辐射**能量，等效于并联了一个辐射电导，且这个电导随频率变化。工程上的做法是把"开路"用一段 $\lambda/4$ 短路线来代替（见 2.4.3 节）。因此实际枝节调配器几乎都是"**短路枝节**"。

#### （2）串联单枝节调配器

**结构与思路**：在距负载 $l_1$ 处**串联**一段长度为 $l_2$、终端短路的枝节，使从该处向负载看的总输入阻抗 $Z_{\mathrm{in}}=Z_0$。

> **【核心概念】**
> **思路：$l_1$ 负责"实部匹配（R-matching）"，$l_2$ 负责"虚部匹配（jX-matching）"。**
> - $l_1$ 的任务：让 $l_1$ 处的输入阻抗（向负载看）**实部等于 $Z_0$**，即落在史密斯圆图的 $r=1$ 圆上；此时 $Z_B=R_1+jX_1=Z_0+jX_1$；
> - $l_2$ 的任务：用短路枝节的**纯电抗**抵消 $X_1$，即 $X_1+Z_0\tan\beta l_2=0$。

**数学表述**：

$$
Z_B=Z_{\mathrm{in}}(l_1)=R_1+jX_1,
\qquad
Z_{\mathrm{stub}}=jZ_0\tan\beta l_2,
$$
$$
Z_{\mathrm{in}}=Z_B+Z_{\mathrm{stub}}=R_1+j\left(X_1+Z_0\tan\beta l_2\right)=Z_0
\quad\Longrightarrow\quad
\begin{cases}
R_1=Z_0\\[1mm]
X_1+Z_0\tan\beta l_2=0
\end{cases}
\tag{2-7-5}
$$

**"实部 = $Z_0$"这个条件在圆图上有几个解？** 记 $\Gamma(z)=|\Gamma_l|e^{j\theta}$，由式 (2-6-3)

$$
r=\frac{1-|\Gamma_l|^{2}}{1-2|\Gamma_l|\cos\theta+|\Gamma_l|^{2}}=1
\quad\Longrightarrow\quad
\cos\theta=|\Gamma_l|
\quad\Longrightarrow\quad
\theta=\pm\arccos|\Gamma_l|=\pm\,2\arctan\frac{1}{\sqrt{\rho}}
$$

进而

$$
x=\frac{2|\Gamma_l|\sin\theta}{1-|\Gamma_l|^{2}}=\pm\frac{\rho-1}{\sqrt{\rho}}
\tag{2-7-6}
$$

> **【公式推导】**
> **为什么有两组解？** 因为式 $r=1$ 在圆图上表示"**等 $|\Gamma|$ 圆与 $r=1$ 圆的两个交点**"——一个在上半平面（$x=+\dfrac{\rho-1}{\sqrt{\rho}}$，呈感性），一个在下半平面（$x=-\dfrac{\rho-1}{\sqrt{\rho}}$，呈容性）。对应到线上，就是两个不同的 $l_1$；相应地，$l_2$ 也取两个不同的值（一个提供容抗、一个提供感抗）。**这就是"两组解"的几何来源。**

**结果公式**（以第一电压波节点 $z_{\min}$ 为参考，向信源方向量）：

$$
l_1=z_{\min}+\frac{\lambda}{2\pi}\arctan\sqrt{\rho}
\qquad\text{或}\qquad
l_1=z_{\min}+\frac{\lambda}{2\pi}\left(\pi-\arctan\sqrt{\rho}\right)
\tag{2-7-7}
$$

$$
l_2=\frac{\lambda}{2\pi}\arctan\frac{\rho-1}{\sqrt{\rho}}
\qquad\text{或}\qquad
l_2=\frac{\lambda}{2\pi}\left(\pi-\arctan\frac{\rho-1}{\sqrt{\rho}}\right)
\tag{2-7-8}
$$

**两组解的配对关系**是：**$l_1$ 取第一式（落在 $r=1$ 圆的感性交点）时，$l_2$ 取第二式（枝节呈容性）；$l_1$ 取第二式时，$l_2$ 取第一式。**

> **【记忆技巧】**
> 若 $R_l<Z_0$ 且负载本身就在电压波节点上（$z_{\min}=0$），式 (2-7-7) 第一式就退化为
> $$l_1=\frac{\lambda}{2\pi}\arctan\sqrt{\rho}
> \tag{2-7-9}$$
> 这就是最常考的一条"枝节位置公式"。当 $\rho=2$ 时还有巧合：$\dfrac{\rho-1}{\sqrt{\rho}}=\dfrac{1}{\sqrt{\rho}}$，于是式 (2-7-8) 的两种写法
> $$l_2=\frac{\lambda}{2\pi}\arctan\frac{1}{\sqrt{\rho}}=0.098\lambda
> \quad\text{或}\quad
> l_2=\frac{\lambda}{2\pi}\left(\pi-\arctan\frac{1}{\sqrt{\rho}}\right)=0.402\lambda$$
> 请特别注意：**$\dfrac{\rho-1}{\sqrt{\rho}}$ 与 $\dfrac{1}{\sqrt{\rho}}$ 只在 $\rho=2$ 时相等**，一般情形下不能混用。若要"取最小的 $l_1$"，可以减去 $\lambda/2$（利用 $\lambda/2$ 重复性）。

#### 【例2.10】串联短路枝节的设计

> **【例题 2-10】**
> $Z_0=50\ \Omega$，$f=300\ \mathrm{MHz}$，$Z_l=40+j30\ \Omega$。求串联短路枝节的长度 $l_1$（距负载的距离）与 $l_2$（枝节长度）。
>
> **解：**
> **第 1 步：求 $\lambda$ 与 $\rho$、$z_{\min}$。**
> $$\lambda=\frac{c}{f}=\frac{3\times10^{8}}{3\times10^{8}}=1\ \mathrm{m}$$
> $$\bar Z_l=\frac{40+j30}{50}=0.8+j0.6,\qquad
> \Gamma_l=\frac{-0.2+j0.6}{1.8+j0.6}=\frac{j}{3}=\frac{1}{3}e^{j\pi/2}
> \quad\Longrightarrow\quad
> |\Gamma_l|=\frac{1}{3},\ \varphi_l=\frac{\pi}{2},\ \rho=2$$
> $$z_{\max}=\frac{\varphi_l\lambda}{4\pi}=\frac{\lambda}{8}=0.125\ \mathrm{m},
> \qquad
> z_{\min}=z_{\max}+\frac{\lambda}{4}=\frac{3\lambda}{8}=0.375\ \mathrm{m}$$
> **第 2 步：求两组解的 $l_1$。**
> $$\frac{\lambda}{2\pi}\arctan\sqrt{\rho}=\frac{1}{2\pi}\arctan1.414=\frac{1}{2\pi}\times0.9553=0.152\ \mathrm{m}$$
> $$\frac{\lambda}{2\pi}\left(\pi-\arctan\sqrt{\rho}\right)=\frac{1}{2\pi}\left(3.1416-0.9553\right)=0.348\ \mathrm{m}$$
> **第一组解：** $l_1=z_{\min}+0.152=0.527\ \mathrm{m}$，减去 $\lambda/2=0.5\ \mathrm{m}$ 得
> $$l_1'=0.027\ \mathrm{m}=0.027\lambda$$
> **第二组解：** $l_1=z_{\min}+0.348=0.723\ \mathrm{m}$，减去 $\lambda/2$ 得
> $$l_1''=0.223\ \mathrm{m}=0.223\lambda$$
> **第 3 步：求对应的 $l_2$。**
> $$\frac{\rho-1}{\sqrt{\rho}}=\frac{2-1}{1.414}=0.7071,\qquad \arctan0.7071=0.6155\ \mathrm{rad}$$
> $$l_2^{(1)}=\frac{\lambda}{2\pi}\left(\pi-0.6155\right)=\frac{2.5261}{2\pi}=0.402\ \mathrm{m}
> \qquad(\text{与 }l_1'=0.027\ \mathrm{m}\text{ 配对})$$
> $$l_2^{(2)}=\frac{\lambda}{2\pi}\times0.6155=\frac{0.6155}{2\pi}=0.098\ \mathrm{m}
> \qquad(\text{与 }l_1''=0.223\ \mathrm{m}\text{ 配对})$$
>
> **验算：**
> - 取 $l_1'=0.027\ \mathrm{m}$（$\beta l_1=0.027\times2\pi=0.1696\ \mathrm{rad}=9.72^{\circ}$，$\tan\beta l_1=0.1713$）：
>   $$Z_B=50\times\frac{0.8+j0.6+j0.1713}{1+j(0.8+j0.6)\times0.1713}
>   =50\times\frac{0.8+j0.7713}{0.8972+j0.1370}=50\times\left(1+j0.7071\right)$$
>   即 $Z_B=50+j35.4\ \Omega$，实部恰为 $Z_0$ ✓ 需要枝节提供 $X=-35.4\ \Omega$：
>   $$Z_{\mathrm{stub}}=j50\tan\left(2\pi\times0.402\right)=j50\tan144.7^{\circ}=-j35.4\ \Omega\ \text{（验算通过）}$$
>   总阻抗 $50+j35.4-j35.4=50\ \Omega=Z_0$ ✓ **匹配完成**。
> - 取 $l_1''=0.223\ \mathrm{m}$ 时 $Z_B=50-j35.4\ \Omega$，枝节 $Z_{\mathrm{stub}}=j50\tan(2\pi\times0.098)=j50\tan35.3^{\circ}=+j35.4\ \Omega$，同样得 $50\ \Omega$ ✓
>
> **讨论（两个要点）：**
> 1. **如何理解 $l_2$ 的取值？** 短路枝节的输入电抗是 $jZ_0\tan\beta l_2$，它**以 $\lambda/2$ 为周期**：$\tan\beta\left(l_2+\dfrac{\lambda}{2}\right)=\tan(\beta l_2+\pi)=\tan\beta l_2$。所以 $l_2$ 与 $l_2+\lambda/2$ 完全等效，工程上取短的那个。本例 $l_2^{(1)}=0.402\ \mathrm{m}$，因为 $0.402=0.5-0.098$，$\tan(2\pi\times0.402)=\tan(-2\pi\times0.098)=-\tan(2\pi\times0.098)$，**一个"长于 $\lambda/4$ 的短路线"呈现的是容性电抗**——这正是它能抵消感性负载的原因。这条性质也是"微波电容"的实现方式。
> 2. **$\lambda/2$ 周期性带来"多解"**：$l_1$ 可以加任意 $\lambda/2$、$l_2$ 也可以加任意 $\lambda/2$，所以在圆图上"把负载点顺时针转圈，每转半圈就遇到一次 $r=1$ 圆"。解题时只要**取最小正值**即可。
>
> **一句话总结：会思路（$l_1$ 管实部、$l_2$ 管虚部），会计算（两组解任选其一），考试时就能灵活应对各种问法。**

#### （3）并联单枝节调配器

**结构与思路**：在距负载 $l_1$ 处**并联**一段长度为 $l_2$、终端短路的枝节。因为并联电路的总量是**导纳相加**，所以必须把问题换算到**导纳域**：

$$
Y_{\mathrm{in}}=Y_{\mathrm{in}1}+Y_{\mathrm{in}2},
\qquad
Y_{\mathrm{in}1}=G_1+jB_1\ (\text{从枝节处向负载看}),
\qquad
Y_{\mathrm{in}2}=-jY_0\cot\beta l_2\ (\text{短路枝节})
$$

匹配条件：

$$
G_1=Y_0=\frac{1}{Z_0},
\qquad
B_1+B_2=0
\quad\Longrightarrow\quad
\text{G-matching} + \text{jB-matching}
\tag{2-7-10}
$$

（短路枝节的输入导纳由 $Z_{\mathrm{in}}=jZ_0\tan\beta l$ 取倒数得到：$Y_{\mathrm{in}}=\dfrac{1}{jZ_0\tan\beta l}=-jY_0\cot\beta l$。）

**方法与串联完全对偶**：只需把"阻抗"换成"导纳"，由 $g=1$ 的条件 $\cos\theta=-|\Gamma_l|$ 可推出 $b_1=\pm\dfrac{\rho-1}{\sqrt{\rho}}$，再由 $\tan\beta l_2=\dfrac{1}{b_1}$ 求解。

> **【小结】**
> **串联与并联单枝节对照表**（均以第一电压波节点 $z_{\min}$ 为参考向信源量取）：
>
> | 项目 | 串联单枝节 | 并联单枝节 |
> |---|---|---|
> | 匹配条件 | $R_1=Z_0$，$X_1+Z_0\tan\beta l_2=0$ | $G_1=Y_0$，$B_1+B_2=0$ |
> | 枝节的量 | 电抗 $jZ_0\tan\beta l_2$ | 电纳 $-jY_0\cot\beta l_2$ |
> | 待抵消量 | $x_1=\pm\dfrac{\rho-1}{\sqrt{\rho}}$ | $b_1=\pm\dfrac{\rho-1}{\sqrt{\rho}}$ |
> | $l_1$ | $\dfrac{\lambda}{2\pi}\arctan\sqrt{\rho}$ 或 $\dfrac{\lambda}{2\pi}\left(\pi-\arctan\sqrt{\rho}\right)$ | $\dfrac{\lambda}{2\pi}\arctan\dfrac{1}{\sqrt{\rho}}$ 或 $\dfrac{\lambda}{2\pi}\arctan\sqrt{\rho}$ |
> | $l_2$ | $\dfrac{\lambda}{2\pi}\arctan\dfrac{\rho-1}{\sqrt{\rho}}$ 或 $\dfrac{\lambda}{2\pi}\left(\pi-\arctan\dfrac{\rho-1}{\sqrt{\rho}}\right)$ | $\dfrac{\lambda}{2\pi}\arctan\dfrac{\sqrt{\rho}}{\rho-1}$ 或 $\dfrac{\lambda}{2\pi}\left(\pi-\arctan\dfrac{\sqrt{\rho}}{\rho-1}\right)$ |
>
> （表中 $l_1$ 需再加上 $z_{\min}$，并可任意加减 $\lambda/2$ 取最小正值。）
> **解题提示**：判题时先看"串"还是"并"——**串用 $Z$、并用 $Y$**；再算出 $\rho$ 与 $z_{\min}$；最后按上表套公式并配对，两组解任选其一即为正确解。

### 2.7.5 本节考点清单

> **【考点】**
> - **题型**：简答（三种匹配状态的定义与区别、为什么匹配是核心、$\lambda/4$ 变换器的带宽问题）、计算与设计（$\lambda/4$ 变换器 $Z_{01}$、单枝节 $l_1$ 与 $l_2$）、圆图设计（在圆图上完成单枝节匹配）。
> - **常见设问**：①"阻抗匹配、源阻抗匹配、共轭匹配分别是什么？何时等价？"②"$Z_l$ 为复数时如何用 $\lambda/4$ 变换器匹配？"③"为什么单枝节匹配有两组解？"④"并联枝节为什么必须用导纳计算？"
> - **易错点**：①把共轭匹配 $Z_{\mathrm{in}}=Z_g^{*}$ 写成 $Z_{\mathrm{in}}=Z_g$；②$\lambda/4$ 变换器的 $Z_{01}$ 忘记开方；③复数负载直接套 $Z_{01}=\sqrt{Z_0R_l}$（应先变换到波腹/波节点）；④$l_2$ 公式中把 $\dfrac{\rho-1}{\sqrt{\rho}}$ 与 $\dfrac{1}{\sqrt{\rho}}$ 混用（仅在 $\rho=2$ 时相等）；⑤并联枝节用阻抗计算。
> - **难度**：★★★★★

### 2.7.6 电长度（ELL）表示法与双枝节匹配（EE5425 拓展）

> **【核心概念】**
> **电长度**（Electrical Length, ELL）把传输线的物理长度 $l$ 用它在波长 $\lambda$ 中所占的比例来表示，而不是用米、厘米这样的物理尺度：
> $$\theta=\beta l=\frac{2\pi l}{\lambda}\tag{2-7-6}$$
> 单位可取弧度，也常换算成角度（$\theta=360^{\circ}\times l/\lambda$）。电长度的本质是一个**归一化相位量**——它只依赖比值 $l/\lambda$，与频率本身无关。这正是 EE5425 课程及大多数微波工程文献描述枝节、线段长度时偏好写 $l=0.125\lambda$ 而不是 $l=3.75\ \mathrm{cm}$ 的原因：同一个电长度的设计，换到任意工作频率只需按新波长重新折算物理尺寸，设计规则（圆图上的旋转角度、匹配条件）完全不变。

在史密斯圆图上，沿传输线移动物理长度 $l$，反射系数的相位变化是 $-2\beta l$（系数 $2$ 来自入射波与反射波往返各走一趟 $\beta l$），因此圆图上**转过的角度是 $2\theta$，而不是 $\theta$**。这是初学者最容易漏乘 $2$ 的地方：电长度本身只转了 $\theta$，但圆图刻度对应的是双程相位 $2\theta$。

> **【易错点】**
> 查圆图外圈"向信源/向负载波长数"刻度时，一圈 $1.0$ 刻度对应物理长度 $\lambda/2$（而不是 $\lambda$），因为 $2\theta=2\pi$ 时 $\theta=\pi$，即 $l=\lambda/2$。这与 2.4 节驻波图 $\lambda/2$ 周期性的结论是同一件事的两种表述。

**双枝节匹配器**（double-stub matching / double-stub tuner）是单枝节匹配的推广：用两个并联短路（或开路）枝节，枝节间距 $d$ 固定（常取 $\lambda/8$、$3\lambda/8$ 或 $\lambda/4$），只调节两个枝节的长度 $l_1,l_2$ 来实现匹配，不需要像单枝节那样沿主线寻找插入点。它在工程上更受欢迎的原因是：**枝节位置可以预先固定在连接器/法兰处**，调试时只需拧动可调短路活塞，不必在任意位置切割或打孔主传输线。
