> **【公式推导】**
> 设负载导纳归一化为 $\bar Y_l=g_l+jb_l$，经过长度 $d_0$（负载到第一枝节的固定线段，若负载不直接在枝节处）变换到第一枝节处为 $\bar Y_1=g_1+jb_1$。第一枝节只能并联纯电纳 $jb_{s1}$，所以它只能**沿等电导圆 $g=g_1$ 上下滑动**，无法直接改变 $g_1$。要使信号经过间距 $d$ 后落到 $g=1$ 圆上，第一枝节调出的点必须恰好落在一个特殊的辅助圆——把标准 $g=1$ 圆绕圆图原点反向旋转电长度 $2\beta d$ 得到的圆（因为"将 $g=1$ 圆上的点沿线倒退 $d$"等价于"把该圆整体转回 $-2\beta d$"）。数学条件为：
> $$g_1=\frac{1}{1+\tan^{2}\beta d}\Big[1\pm\sqrt{(1+\tan^{2}\beta d)\sec^{2}\beta d-\tan^{2}\beta d\,g_1^{2}}\Big]\quad(\text{简化形式，需配合圆图读数})$$
> 实际工程设计不手算此式，而是：①在圆图上画出 $g=1$ 圆绕原点转 $-2\beta d$ 后的辅助圆；②用枝节 1 把 $\bar Y_1$ 沿 $g_1$ 圆调到辅助圆上，得到 $l_1$；③该点经过间距 $d$ 后必然落在真正的 $g=1$ 圆上，记此时的 $\bar Y_2=1+jb_2$；④枝节 2 提供 $-jb_2$ 将其调到圆心 $\bar Y=1$，得到 $l_2$。

> **【例题 2-10】**
> 取 $d=\lambda/8$（即 $\beta d=45^{\circ}$），已知变换到第一枝节处的归一化负载导纳 $\bar Y_1=1+j1$（恰为教学简化值）。求两枝节长度 $l_1,l_2$（设枝节为并联短路线）。
>
> **解：**
> 因 $g_1=1$ 已经等于目标电导，辅助圆在 $g_1=1$ 处与 $g=1$ 本圆的交点之一就是 $b_1=1$ 本身（简化情形，验证设计流程而非一般公式）。于是枝节 1 不需要改变电导，只需把 $b_1=1$ 调到辅助圆要求的电纳值 $b_1'=0$（使之后移相后电纳归零），即枝节 1 需贡献 $jb_{s1}=-j1$：对并联短路枝节 $\bar Y_{s}=-j\cot\beta l_1=-j1\Rightarrow\cot\beta l_1=1\Rightarrow\beta l_1=45^{\circ}\Rightarrow l_1=\lambda/8$。
> 此时 $\bar Y_1'=1+j0$，经过 $d=\lambda/8$（$\beta d=45^{\circ}$）变换后，由圆图旋转 $2\beta d=90^{\circ}$，$\bar Y_1'=1$ 本身在圆图原点的匹配点附近，变换后近似仍为 $\bar Y_2\approx1+j1$（该简化例中变换引入的电纳增量约为 $j1$，与枝节 1 情形对称）。枝节 2 需提供 $-j1$ 抵消：同理 $\beta l_2=45^{\circ}\Rightarrow l_2=\lambda/8$。
> **答**：$l_1=l_2=\lambda/8$（此题数值经过简化选取，目的是演示"读辅助圆 → 求 $l_1$ → 旋转 $d$ → 求 $l_2$"的完整设计步骤；真实工程设计须在圆图上逐点作图或用数值迭代求解一般 $\bar Y_l$）。

双枝节匹配存在**匹配禁区**（forbidden region）：当负载导纳落在辅助圆"内部"某个区域时，无论怎样调节枝节 1 的电纳，调出的点都无法到达辅助圆（因为等电导圆与辅助圆不相交），此时固定间距 $d$ 的双枝节匹配器**无法实现匹配**，必须改变枝节间距、增加第三个枝节（三枝节匹配器），或改用单枝节方案。禁区的物理根源是：枝节只能移动电纳而不能移动电导，一旦负载电导本身超出了辅助圆所能覆盖的电导范围，单纯调相位无法弥补。

| 对比项 | 单枝节匹配 | 双枝节匹配 |
|---|---|---|
| 可调自由度 | 枝节位置 $l_1$（沿线移动）+ 枝节长度 $l_2$ | 两个枝节长度 $l_1,l_2$（位置固定） |
| 是否需知道负载精确位置 | 需要（必须能在任意 $l_1$ 处插入枝节） | 不需要（枝节位置预先固定，只需知道负载导纳本身） |
| 带宽 | 较窄（单一频点严格匹配） | 更窄（多一级变换，色散影响更明显） |
| 结构复杂度 | 低（一个可调短路/开路枝节） | 中等（两个枝节 + 固定间距段，可能存在禁区） |
| 典型应用 | 实验室可调配、同轴线现场调试 | 波导/同轴连接器集成式调配器、不便切割主线的场合 |

> **【考点】**
> - **常见设问**：①"电长度与物理长度的区别？为什么圆图上转的是 $2\theta$？"②"双枝节匹配的设计步骤是什么？辅助圆是怎么来的？"③"双枝节匹配为什么会出现禁区？如何避开或补救？"④"双枝节与单枝节相比，各自的优缺点是什么？"
> - **易错点**：①把电长度 $\theta=\beta l$ 与圆图旋转角弄混，少乘了系数 $2$；②以为双枝节可以像单枝节一样任意调节电导，忽视枝节只能调电纳这一限制；③忘记双枝节间距是**固定值**（设计前就要选定 $d$），把它当成可调量。
> - **难度**：★★★★

## 本章小结

1. **微波传输线**是传输微波信息与能量的各类传输系统的总称。信息主线要求"载频越高、速率越高"（1G 到 6G 的演进），能量主线关心 $E=P\cdot T$、能量效率与无线输能。传输线的本质作用是**引导**：把能量约束在横截面远小于波长的"管道"内。
2. **铜导线不能传输微波**，根源是**趋肤效应**：电流被挤到厚度 $\delta=\sqrt{\rho/(\pi f\mu)}$ 的表层，有效导电面积急剧缩小，$R_0\propto\sqrt f$（铜在 $10\ \mathrm{GHz}$ 时 $\delta\approx0.66\ \mu\mathrm{m}$，单位长度电阻比低频增大约 $1500$ 倍）。但**微波并不在金属中传输，而是在导体包围的介质中传输**，金属只起引导与边界约束作用。
3. **长线判据** $l\gtrsim\lambda/10$：此时沿线电压电流不再是同一时刻的同一值，必须引入分布参数 $R,L,C,G$（单位分别为 $\Omega/\mathrm{m}$、$\mathrm{H/m}$、$\mathrm{F/m}$、$\mathrm{S/m}$，$R$ 对应导体损耗、$G$ 对应介质损耗、$L$ 与 $C$ 对应磁场与电场储能）。
4. **电报方程**由基尔霍夫定律用在 $\Delta z\ll\lambda$ 线元上取极限得到；用**相量法**（$\mathrm{d}/\mathrm{d}t\Leftrightarrow j\omega$）化为相量形式 $\dfrac{dU}{dz}=-ZI$、$\dfrac{dI}{dz}=-YU$；消元得二阶方程 $\dfrac{d^2U}{dz^2}-\gamma^2U=0$，$\gamma=\sqrt{ZY}=\alpha+j\beta$。
5. **特性阻抗** $Z_0=\sqrt{Z/Y}$ 是**入射波（或反射波）电压与电流之比**，与 $z$、信源、负载无关，是**固有参数**；它单位是 $\Omega$ 但**不表示损耗、不是电阻**。无耗时 $Z_0=\sqrt{L/C}$ 为实数；工程标准 50 Ω 是功率与损耗的折中、75 Ω 接近衰减最小点。
6. **状态参量**（随负载、位置变化）：输入阻抗 $Z_{\mathrm{in}}(z)=Z_0\dfrac{Z_l+jZ_0\tan\beta z}{Z_0+jZ_l\tan\beta z}$，具有 **$\lambda/2$ 重复性**与 **$\lambda/4$ 变换性** $Z_{\mathrm{in}}(z)Z_{\mathrm{in}}(z+\lambda/4)=Z_0^{2}$；反射系数 $\Gamma(z)=\Gamma_le^{-j2\beta z}$（"一来一回 $2z$"），$\Gamma_l=\dfrac{Z_l-Z_0}{Z_l+Z_0}$；驻波比 $\rho=\dfrac{1+|\Gamma_l|}{1-|\Gamma_l|}$，$|\Gamma_l|=\dfrac{\rho-1}{\rho+1}$。四者之间可任意互算，**$\Gamma$ 是桥梁**。
7. **三种工作状态**：行波（$Z_l=Z_0$，$\rho=1$，沿线 $|U|$ 恒定、$Z_{\mathrm{in}}\equiv Z_0$、功率单向传输，**最好**）；驻波（$Z_l=0,\infty,\pm jX$，$\rho\to\infty$，$U$ 与 $I$ 差 $\pi/2$、$P=0$、$Z_{\mathrm{in}}$ 为纯电抗，波腹波节间距 $\lambda/4$）；行驻波（一般情形，$1<\rho<\infty$，波腹点 $R_{\max}=Z_0\rho$、波节点 $R_{\min}=Z_0/\rho$，$R_{\max}R_{\min}=Z_0^{2}$）。波腹点 $z_{\max}=\dfrac{\varphi_l\lambda}{4\pi}+\dfrac{n\lambda}{2}$，波节点 $z_{\min}=\dfrac{\varphi_l\lambda}{4\pi}+(2n+1)\dfrac{\lambda}{4}$，**取最小正值**。
8. **功率与损耗**：$P(z)=\dfrac{|A_1|^{2}}{2Z_0}\left(e^{2\alpha z}-|\Gamma_l|^{2}e^{-2\alpha z}\right)$（净功率 = 入射 − 反射，$P_r=|\Gamma|^{2}P_{\mathrm{in}}$）；匹配时效率最高 $\eta_{\max}=e^{-2\alpha l}$；回波损耗 $L_r=-20\lg|\Gamma|$（越大越好），插入损耗 $L_i=10\lg(P_{\mathrm{in}}/P_t)$；$\mathrm{dBm}$ 与 $\mathrm{dBW}$ 相差 $30\ \mathrm{dB}$。
9. **史密斯圆图**把 $\mathrm{Re}[Z]\ge0$ 的整个半平面映射到 $|\Gamma|\le1$ 的单位圆内。**三个核心思想**：归一化、以 $\Gamma$ 为基底（沿线移动 = 等 $|\Gamma|$ 圆转圈，**顺时针向信源**，一周 $360^{\circ}$ 对应 $\lambda/2$）、套覆等阻抗圆（等 $r$ 圆圆心 $\left(\frac{r}{1+r},0\right)$ 半径 $\frac{1}{1+r}$；等 $x$ 圆圆心 $\left(1,\frac{1}{x}\right)$ 半径 $\frac{1}{|x|}$）。导纳圆图 = 阻抗圆图绕原点转 $180^{\circ}$。
10. **阻抗匹配**是微波技术的核心：负载匹配（$Z_l=Z_0$）、源匹配（$Z_g=Z_0$）、共轭匹配（$Z_{\mathrm{in}}=Z_g^{*}$，$P_{\max}=E_g^{2}/(8R_g)$），实数条件下三者等价。**$\lambda/4$ 变换器** $Z_{\mathrm{in}}=Z_{01}^{2}/Z_l$（实数负载取 $Z_{01}=\sqrt{Z_0R_l}$，复数负载先变换到波腹/波节点），但**只对单一频率有效（窄带）**，宽带需用多节变换器。**单枝节调配器**用 $l_1$ 完成实部匹配、用 $l_2$ 完成虚部匹配，一般有两组解（对应等 $|\Gamma|$ 圆与 $r=1$ 圆的两个交点）。

**一句话收束**：**本章把"微波如何在传输线上传播"这件事彻底讲清了——电压与电流是入射波与反射波的叠加，六个参数（$Z_0$、$\gamma$、$v_p$ 与 $Z_{\mathrm{in}}$、$\Gamma$、$\rho$）描述了它的全部行为，史密斯圆图与阻抗匹配则给了我们设计与测量的工具。后续第三章"场"的分析、第五章"网络"的分析，都要回到这一章建立的语言上来。**

---

### 答案与解析

**1. B。** $Z_0=\sqrt{Z/Y}=\sqrt{(R+j\omega L)/(G+j\omega C)}$ 的定义是"导行波（入射波或反射波）电压与电流之比"，它只由 $R,L,C,G$ 与 $\omega$ 决定，是传输线的**固有参数**，与位置、信源、负载无关。A 错在把 $Z_0$ 当损耗（损耗由 $\alpha$ 描述，$Z_0$ 只是比值）；C 错在把 $Z_0$ 与状态参量 $Z_{\mathrm{in}}(z)$ 混淆（$Z_{\mathrm{in}}$ 才是合成波之比）；D 错在无耗线 $Z_0=\sqrt{L/C}$ 是**实数**。

**2. C。** 无耗线 $\alpha=0$，$|\Gamma(z)|=|\Gamma_l|$ 沿线处处相等，且 $\Gamma$ 的相位每移动 $\lambda/2$ 变化 $2\pi$ 而复原，故 $Z_{\mathrm{in}}$ 也具有 $\lambda/2$ 重复性。A 只对有耗线成立；B 错，无耗线上 $\rho$ 与位置无关；D 错，**波腹与波节间距为 $\lambda/4$**（相邻波腹之间才是 $\lambda/2$）。

**3.** 依次为：$-Ri(z,t)$；$-L\dfrac{\partial i(z,t)}{\partial t}$；$\Omega/\mathrm{m}$；$\mathrm{S/m}$；磁场；电场。
（提示：第一式表示"单位长度上电压的变化 = 单位长度 $R$ 上的电压变化 + 单位长度 $L$ 上的电压变化之和"。）

**4.** 依次为：$z=n\dfrac{\lambda}{2}\ (n=0,1,2,\dots)$；$z=(2n+1)\dfrac{\lambda}{4}$；电压为**波节（零）**；电流为**波腹（最大）**；$Z_{\mathrm{in}}(z)=jZ_0\tan\beta z$（纯电抗）；传输功率 $P=0$。
（解析：短路线 $\Gamma_l=-1$，$U(z)=2jA_1\sin\beta z$，$I(z)=\dfrac{2A_1}{Z_0}\cos\beta z$；$U$ 与 $I$ 相位差 $\pi/2$，故 $P=\dfrac12\mathrm{Re}[UI^{*}]=0$。）

**5.** 依次为：$0.5$；$6.02$；$30$；顺；$\lambda/2$。
（解析：$|\Gamma_l|=\dfrac{\rho-1}{\rho+1}=\dfrac{2}{4}=0.5$；$L_r=-20\lg0.5=20\lg2=6.02\ \mathrm{dB}$；$1\ \mathrm{W}=10\lg(1000\ \mathrm{mW})=30\ \mathrm{dBm}$；圆图上"顺时针向信源"，一周 $360^{\circ}$ 对应相位变化 $2\pi$，即 $2\beta z=2\pi\Rightarrow z=\lambda/2$。）

**6. 解：**
**(1) 终端反射系数。** 归一化负载
$$\bar Z_l=\frac{100-j50}{50}=2-j1,\qquad
\Gamma_l=\frac{\bar Z_l-1}{\bar Z_l+1}=\frac{1-j1}{3-j1}=\frac{(1-j)(3+j)}{3^{2}+1^{2}}=\frac{4-j2}{10}=0.4-j0.2$$
$$|\Gamma_l|=\sqrt{0.4^{2}+0.2^{2}}=\sqrt{0.2}=0.4472,\qquad
\varphi_l=\arctan\frac{-0.2}{0.4}=-26.57^{\circ}=-0.4636\ \mathrm{rad}$$
**(2) 驻波比。**
$$\rho=\frac{1+|\Gamma_l|}{1-|\Gamma_l|}=\frac{1.4472}{0.5528}=2.618$$
**(3) 波腹点与波节点位置。**
$$z_{\max}=\frac{\varphi_l\lambda}{4\pi}+\frac{n\lambda}{2}=-0.0369\lambda+\frac{n\lambda}{2}\ \xrightarrow{\ n=1\ }\ 0.463\lambda$$
$$z_{\min}=\frac{\varphi_l\lambda}{4\pi}+(2n+1)\frac{\lambda}{4}=-0.0369\lambda+\frac{\lambda}{4}=0.213\lambda$$
**验算**：在 $z_{\max}$ 处输入阻抗应为 $Z_0\rho=50\times2.618=130.9\ \Omega$（实数）；在 $z_{\min}$ 处应为 $Z_0/\rho=50/2.618=19.1\ \Omega$（实数）。代入式 (2-3-12) 可验证无误。
**(4) 距负载 $0.1\lambda$ 处的输入阻抗。** $f=1\ \mathrm{GHz}$ 时 $\lambda=0.3\ \mathrm{m}$，$2\beta z=4\pi\times0.1=0.4\pi=72^{\circ}$
$$\Gamma(0.1\lambda)=\Gamma_le^{-j0.4\pi}=0.4472e^{-j(26.57^{\circ}+72^{\circ})}=0.4472e^{-j98.57^{\circ}}=-0.0666-j0.4422$$
$$Z_{\mathrm{in}}=Z_0\frac{1+\Gamma}{1-\Gamma}=50\times\frac{0.9334-j0.4422}{1.0666+j0.4422}=50\times\left(0.600-j0.663\right)=30.0-j33.2\ \Omega$$
（复核：$\beta z=36^{\circ}$，$\tan36^{\circ}=0.7265$，代入 $\tan$ 公式得同一结果。）
**讨论**：$z_{\max}=0.463\lambda$、$z_{\min}=0.213\lambda$，两者相距 $0.25\lambda$ ✓；负载处（$z=0$）的阻抗为 $100-j50$，处于 $z_{\min}$ 之前，说明**容性负载使第一波节出现在离负载 $\lambda/4$ 以内**（本题为 $0.213\lambda$），与 2.4.5 节的规律一致。

**7. 解：**
**(1) 匹配时的传输效率。** 单向损耗
$$\alpha l=0.2\times30=6\ \mathrm{dB}\quad\Longrightarrow\quad
\eta_{\max}=e^{-2\alpha l}=10^{-6/10}=0.2512=25.1\%$$
**(2) 实际效率。** $\rho=1.5\Rightarrow|\Gamma_l|=\dfrac{0.5}{2.5}=0.2$，$|\Gamma_l|^{2}=0.04$，且 $e^{2\alpha l}=1/0.2512=3.981$
$$\eta=\frac{1-|\Gamma_l|^{2}}{e^{2\alpha l}-|\Gamma_l|^{2}e^{-2\alpha l}}
=\frac{0.96}{3.981-0.04\times0.2512}=\frac{0.96}{3.971}=0.2418=24.2\%$$
$$P(0)=P_{\mathrm{in}}\cdot\eta=10\times0.2418=2.42\ \mathrm{W}$$
**(3) 以 dBm 表示的差值。**
$$P_{\mathrm{in}}=10\ \mathrm{W}=40\ \mathrm{dBm},\qquad
P(0)=2.42\ \mathrm{W}=10\lg(2420\ \mathrm{mW})=33.8\ \mathrm{dBm}$$
差值为 $40-33.8=6.2\ \mathrm{dB}$。
**讨论**：线本身的损耗是 $6\ \mathrm{dB}$，加上失配（$\rho=1.5$）后总损耗变成 $6.2\ \mathrm{dB}$，**效率从 $25.1\%$ 降到 $24.2\%$**。可以看到：①这条电缆把 $3/4$ 的功率都吃掉了——**长电缆的损耗远比失配严重**；②在损耗已经很大的系统里，$\rho=1.5$ 带来的额外损失很小，这也是工程上"$\rho<1.5$ 即可接受"的原因之一。**但若线路很短（$\alpha l$ 小），失配就会成为效率的主要杀手。**

**8. 解：**
**(1) 实数负载**：由式 (2-7-4)
$$Z_{01}=\sqrt{Z_0R_l}=\sqrt{50\times100}=\sqrt{5000}=70.7\ \Omega$$
即需要一段特性阻抗为 $70.7\ \Omega$、长度为 $\lambda/4$ 的线段。
**(2) 复数负载**：$f=1\ \mathrm{GHz}$ 时 $\lambda=0.3\ \mathrm{m}$。
**第 1 步：求 $\Gamma_l$ 与 $\rho$。**
$$\bar Z_l=\frac{25+j25}{50}=0.5+j0.5,\qquad
\Gamma_l=\frac{-0.5+j0.5}{1.5+j0.5}=\frac{-0.2+j0.4}{1}=\ -0.2+j0.4$$
（计算过程：$\dfrac{(-0.5+j0.5)(1.5-j0.5)}{1.5^{2}+0.5^{2}}=\dfrac{-0.5+j1}{2.5}=-0.2+j0.4$。）
$$|\Gamma_l|=0.4472,\qquad \rho=\frac{1+0.4472}{1-0.4472}=2.618,\qquad \varphi_l=\arctan\frac{0.4}{-0.2}=116.57^{\circ}$$
**第 2 步：求 $z_{\min}$。**
$$z_{\max}=\frac{\varphi_l\lambda}{4\pi}=\frac{116.57^{\circ}}{720^{\circ}}\lambda=0.162\lambda,\qquad
z_{\min}=z_{\max}+\frac{\lambda}{4}=0.412\lambda$$
**第 3 步：求 $l_1$。** $\arctan\sqrt{\rho}=\arctan1.618=58.28^{\circ}=1.0172\ \mathrm{rad}$
$$l_1^{(1)}=z_{\min}+\frac{\lambda}{2\pi}\arctan\sqrt{\rho}=0.412\lambda+\frac{1.0172}{2\pi}\lambda=0.412\lambda+0.162\lambda=0.574\lambda\ \xrightarrow{\ -\lambda/2\ }\ 0.074\lambda$$
$$l_1^{(2)}=z_{\min}+\frac{\lambda}{2\pi}\left(\pi-\arctan\sqrt{\rho}\right)=0.412\lambda+\frac{3.1416-1.0172}{2\pi}\lambda=0.412\lambda+0.338\lambda=0.750\lambda\ \xrightarrow{\ -\lambda/2\ }\ 0.250\lambda$$
**第 4 步：求 $l_2$。** $\dfrac{\rho-1}{\sqrt{\rho}}=\dfrac{1.618}{1.618}=1$，$\arctan1=45^{\circ}=\pi/4$
$$l_2=\frac{\lambda}{2\pi}\times\frac{\pi}{4}=\frac{\lambda}{8}=0.125\lambda
\qquad\text{或}\qquad
l_2=\frac{\lambda}{2\pi}\left(\pi-\frac{\pi}{4}\right)=\frac{3\lambda}{8}=0.375\lambda$$
**配对结果**（对应 $\lambda=0.3\ \mathrm{m}$）：
- **解 A**：$l_1=0.074\lambda=0.022\ \mathrm{m}$，$l_2=0.375\lambda=0.113\ \mathrm{m}$；
- **解 B**：$l_1=0.250\lambda=0.075\ \mathrm{m}$，$l_2=0.125\lambda=0.038\ \mathrm{m}$。
**验算**：$l_1=0.074\lambda$ 时 $\beta l_1=26.57^{\circ}$、$\tan\beta l_1=0.5$，代入 $\tan$ 公式
$$Z_B=50\times\frac{0.5+j0.5+j0.5}{1+j(0.5+j0.5)\times0.5}=50\times\frac{0.5+j1.0}{0.75+j0.25}=50\times(1+j1.0)=50+j50\ \Omega$$
实部已为 $Z_0=50\ \Omega$ ✓；枝节需提供 $-j50\ \Omega$，即 $50\tan\beta l_2=-50\Rightarrow\tan\beta l_2=-1\Rightarrow\beta l_2=135^{\circ}\Rightarrow l_2=0.375\lambda$ ✓
（解 B 类似：$l_1=0.25\lambda$ 时 $Z_B=50-j50\ \Omega$，枝节 $j50\tan45^{\circ}=+j50\ \Omega$，同样得 $Z_{\mathrm{in}}=50\ \Omega$ ✓。）
**讨论**：两组解在圆图上就是**等 $|\Gamma|=0.447$ 的圆与 $r=1$ 圆的上下两个交点**；解 A 的 $l_1$ 很短（$0.074\lambda$）但枝节较长（$0.375\lambda$，长于 $\lambda/4$，呈容性），解 B 的 $l_1$ 较长但枝节很短（$0.125\lambda<\lambda/4$，呈感性）。**工程上一般选结构更紧凑、更易实现的解**。
