# 第十章 稳定性与振荡器设计

> **【考点】**
> 本章考点地图：
> 1. 由 $|\Gamma_{\mathrm{in}}|>1$ 或 $|\Gamma_{\mathrm{out}}|>1$ 说明放大器自激振荡的物理条件（★★★，概念题，5～8 分）；
> 2. 输出稳定圆、输入稳定圆圆心与半径公式的完整推导，由 $|\Gamma_{\mathrm{in}}|=1$（或 $|\Gamma_{\mathrm{out}}|=1$）边界条件出发（★★★★★，压轴推导题，12～18 分）；
> 3. 判断稳定圆与单位圆位置关系（圆心在圆内/圆外，结合 $|S_{11}|$、$|S_{22}|$ 与 1 的大小），画出稳定区域（★★★★，8～12 分）；
> 4. 用 $K$-$\Delta$ 判据（$K>1$ 且 $|\Delta|<1$）或 $\mu$ 因子（$\mu>1$）判断无条件稳定性（★★★★，必考计算题）；
> 5. 有条件稳定管子的稳定化方法：电阻加载、源极负反馈，及其代价（★★★，设计题）；
> 6. 负阻振荡器设计条件 $\Gamma_{\mathrm{in}}\Gamma_T=1$，起振与幅度稳定机制（★★★★，综合题）。
> **最容易混淆的地方**：$K>1$ 只是**必要**条件，必须同时满足 $|\Delta|<1$ 才是无条件稳定的**充要**条件；而 $\mu>1$ 是**单一**充要条件，不需要联立两式——这是本章设计给出 $\mu$ 因子的根本原因。

---

## 10.1 放大器为什么会自激振荡

### 10.1.1 从有源双端口谈起

微波晶体管放大器本质上是一个**有源双端口网络**（active two-port），用散射矩阵 $[S]$ 描述。与第 7、8 章讨论的无源网络不同，有源器件的 $[S]$ 矩阵**不满足幺正性**（$[S]^+[S]\ne[E]$），这意味着它可以向外**净输出功率**——这正是放大的来源，但同时也埋下了**自激振荡**（self-oscillation）的隐患。

> **【核心概念】**
> 放大器接上信号源（source，反射系数 $\Gamma_S$）与负载（load，反射系数 $\Gamma_L$）后，从输入、输出端口看进去的反射系数分别为
>
> $$\Gamma_{\mathrm{in}}=S_{11}+\frac{S_{12}S_{21}\Gamma_L}{1-S_{22}\Gamma_L}
> \tag{10-1-1}$$
>
> $$\Gamma_{\mathrm{out}}=S_{22}+\frac{S_{12}S_{21}\Gamma_S}{1-S_{11}\Gamma_S}
> \tag{10-1-2}$$
>
> 这两个式子由双端口信号流图经 Mason 增益公式（或直接代数消元）得到：输入端看到的不仅是 $S_{11}$（器件自身的反射），还要加上"信号经 $S_{21}$ 正向传输、被负载 $\Gamma_L$ 反射、再经 $S_{12}$ 反向传输回来"所形成的**反馈项**。$S_{12}\ne0$（内部反馈）正是不稳定的根源之一。

### 10.1.2 自激振荡的判据：反射系数模值大于 1

> **【核心概念】**
> 考虑输入端口：若 $|\Gamma_{\mathrm{in}}|>1$，物理意义是——从输入端口"看进去"的网络（晶体管 + 负载）呈现**负电阻**特性，即它反射回来的波比入射波还强。一旦信号源阻抗与它形成正反馈环路（$\Gamma_S\Gamma_{\mathrm{in}}$ 的乘积使得环路增益 $\ge1$ 且相位满足条件），哪怕没有外部输入信号，电路中的噪声起伏也会被不断放大，形成**自激振荡**（oscillation）。同理，输出端口 $|\Gamma_{\mathrm{out}}|>1$ 也会导致振荡。
>
> 用等效阻抗的语言更直观：$|\Gamma_{\mathrm{in}}|>1\iff \mathrm{Re}[Z_{\mathrm{in}}]<0$（输入呈现负阻）。负阻意味着该端口向外**释放**功率而不是吸收功率；只要外电路（信号源）满足相位匹配，正反馈环路就会自持振荡，电路从"放大器"退化（或主动被设计）为"振荡器"。
>
> **稳定性的定义**：
> - **无条件稳定（unconditionally stable）**：对**任意**满足 $|\Gamma_S|\le1$、$|\Gamma_L|\le1$ 的源、负载组合，都有 $|\Gamma_{\mathrm{in}}|<1$ 且 $|\Gamma_{\mathrm{out}}|<1$。即无论怎么接无源的源与负载，电路都不会振荡。
> - **有条件稳定（conditionally stable，又称潜在不稳定 potentially unstable）**：只在 $\Gamma_S$、$\Gamma_L$ 的**某些**取值范围内稳定，在另一些范围内会出现 $|\Gamma_{\mathrm{in}}|>1$ 或 $|\Gamma_{\mathrm{out}}|>1$，存在振荡风险。

> **【易错点】**
> 误：“$|S_{11}|<1$ 且 $|S_{22}|<1$ 就说明放大器稳定。” 正：$S_{11}$、$S_{22}$ 只是**源、负载均恰好匹配到 $Z_0$**（$\Gamma_S=\Gamma_L=0$）时的反射系数，不能代表接上任意无源负载后的情形。(10-1-1)(10-1-2) 式中的反馈项 $\dfrac{S_{12}S_{21}\Gamma_L}{1-S_{22}\Gamma_L}$ 在某些 $\Gamma_L$ 下可以使 $|\Gamma_{\mathrm{in}}|$ 远大于 $|S_{11}|$，这正是本章要定量分析的内容。

---

## 10.2 稳定圆：从 $|\Gamma_{\mathrm{in}}|=1$ 的边界出发

### 10.2.1 问题的转化

我们要在 $\Gamma_L$ 平面（即 Smith 圆图所在的复平面）上，画出使 $|\Gamma_{\mathrm{in}}|=1$ 的**边界曲线**，这条曲线把 $\Gamma_L$ 平面分成"稳定区"（$|\Gamma_{\mathrm{in}}|<1$）与"不稳定区"（$|\Gamma_{\mathrm{in}}|>1$）。可以证明这条边界曲线恰好是一个**圆**，称为**输出稳定圆**（output stability circle，画在 $\Gamma_L$ 平面，因为它由 $\Gamma_L$ 决定 $\Gamma_{\mathrm{in}}$）。

> **【公式推导】**
> 由 (10-1-1)，令 $|\Gamma_{\mathrm{in}}|=1$：
>
> $$\left|S_{11}+\frac{S_{12}S_{21}\Gamma_L}{1-S_{22}\Gamma_L}\right|=1
> \tag{10-2-1}$$
>
> **第一步，通分**：
>
> $$\left|\frac{S_{11}(1-S_{22}\Gamma_L)+S_{12}S_{21}\Gamma_L}{1-S_{22}\Gamma_L}\right|=1
> $$
>
> 分子整理：$S_{11}-S_{11}S_{22}\Gamma_L+S_{12}S_{21}\Gamma_L=S_{11}-(S_{11}S_{22}-S_{12}S_{21})\Gamma_L$。引入行列式
>
> $$\Delta=S_{11}S_{22}-S_{12}S_{21}
> \tag{10-2-2}$$
>
> 则条件化为
>
> $$|S_{11}-\Delta\Gamma_L|=|1-S_{22}\Gamma_L|
> \tag{10-2-3}$$
>
> **第二步，两边平方**（模的平方 $=$ 自身乘共轭）：
>
> $$(S_{11}-\Delta\Gamma_L)(S_{11}^*-\Delta^*\Gamma_L^*)=(1-S_{22}\Gamma_L)(1-S_{22}^*\Gamma_L^*)
> $$
>
> 展开左边：$|S_{11}|^2-S_{11}\Delta^*\Gamma_L^*-S_{11}^*\Delta\Gamma_L+|\Delta|^2|\Gamma_L|^2$；展开右边：$1-S_{22}\Gamma_L-S_{22}^*\Gamma_L^*+|S_{22}|^2|\Gamma_L|^2$。移项合并：
>
> $$\left(|\Delta|^2-|S_{22}|^2\right)|\Gamma_L|^2-\left(S_{11}\Delta^*-S_{22}^*\right)\Gamma_L^*-\left(S_{11}^*\Delta-S_{22}\right)\Gamma_L+|S_{11}|^2-1=0
> \tag{10-2-4}$$
>
> **第三步，配方成圆的标准式**。一般地，形如 $A|\Gamma|^2-B^*\Gamma^*-B\Gamma+C=0$（$A$、$C$ 为实数）的方程，除以 $A$ 并配方，等价于 $\left|\Gamma-\dfrac{B}{A}\right|^2=\dfrac{|B|^2}{A^2}-\dfrac{C}{A}$，即圆心 $\Gamma_0=B/A$、半径 $r=\sqrt{|B|^2/A^2-C/A}$。对照 (10-2-4)，$A=|\Delta|^2-|S_{22}|^2$，$B=S_{11}^*\Delta-S_{22}$，$C=|S_{11}|^2-1$，于是得到**输出稳定圆**：
>
> $$\boxed{\ \Gamma_0^{(L)}=\frac{\left(S_{22}-\Delta S_{11}^*\right)^*}{|S_{22}|^2-|\Delta|^2}=\frac{\left(S_{22}-\Delta S_{11}^*\right)^{\!*}}{|S_{22}|^2-|\Delta|^2}\ }
> \tag{10-2-5}$$
>
> $$\boxed{\ r_L=\left|\frac{S_{12}S_{21}}{|S_{22}|^2-|\Delta|^2}\right|\ }
> \tag{10-2-6}$$
>
> （圆心表达式常写成 $\Gamma_0^{(L)}=\dfrac{\left(S_{22}-\Delta S_{11}^*\right)^*}{|S_{22}|^2-|\Delta|^2}$，即对 $B/A$ 取共轭后的等价形式；不同教材因 $A,B,C$ 符号约定不同，写法略有差异，但 $|\Gamma_0|$、$r$ 的数值完全一致。）

> **【核心概念】**
> **物理意义**：输出稳定圆是 $\Gamma_L$ 平面上的一条圆周，圆上各点对应的负载恰好使 $|\Gamma_{\mathrm{in}}|=1$（临界状态）。圆的**一侧**是 $|\Gamma_{\mathrm{in}}|<1$（稳定），**另一侧**是 $|\Gamma_{\mathrm{in}}|>1$（不稳定）。圆心、半径都只由晶体管的 $[S]$ 参数决定，与外电路无关——这正是"用器件参数预先判断哪些负载安全"的设计依据。
>
> **量纲检验**：$S_{ij}$ 均为无量纲比值，故 $\Gamma_0$、$r$ 也是无量纲的复数/实数，数值域应与 Smith 圆图的单位圆相比较。

同理，交换下标 $1\leftrightarrow2$（输入与输出互换角色），由 $|\Gamma_{\mathrm{out}}|=1$ 可得**输入稳定圆**（input stability circle，画在 $\Gamma_S$ 平面）：

$$
\Gamma_0^{(S)}=\frac{\left(S_{11}-\Delta S_{22}^*\right)^*}{|S_{11}|^2-|\Delta|^2},\qquad
r_S=\left|\frac{S_{12}S_{21}}{|S_{11}|^2-|\Delta|^2}\right|
\tag{10-2-7}$$

## 10.3 稳定圆与单位圆的位置判断

单纯画出稳定圆还不够，还要判断**单位圆内部**（即 Smith 圆图上所有物理可实现的无源负载 $|\Gamma_L|\le1$）究竟落在稳定圆的哪一侧。判断方法：只需检验**一个特殊点**——通常取 $\Gamma_L=0$（即负载匹配到 $Z_0$）——此时 $\Gamma_{\mathrm{in}}=S_{11}$。

> **【核心概念】**
> 若 $\Gamma_L=0$ 时 $|\Gamma_{\mathrm{in}}|=|S_{11}|<1$，说明**单位圆圆心（原点）本身落在稳定区**；于是：
> - 若稳定圆**包含**原点（即 $|\Gamma_0^{(L)}|<r_L$），则单位圆内大部分区域是稳定的，**不稳定区域是稳定圆与单位圆的交集的一部分**（具体是稳定圆内部与单位圆内部的非重合部分，需结合作图判断）；
> - 若稳定圆**不包含**原点（$|\Gamma_0^{(L)}|>r_L$），则稳定圆内部整体落在不稳定区，单位圆内除去与稳定圆重合的部分都是稳定的。
>
> 反之，若 $|S_{11}|>1$，原点本身就已经不稳定，结论相反。

四种组合情况汇总如下（这是考试中常见的"看图说话"题）：

| 情况 | $|S_{11}|$ 与 1 | 稳定圆是否包含原点 | 单位圆内的稳定区域 |
|---|---|---|---|
| ① | $<1$ | 包含原点 | 单位圆内**去掉**稳定圆与单位圆的重叠部分即为不稳定区，其余为稳定区（原点所在一侧稳定） |
| ② | $<1$ | 不包含原点 | 稳定圆与单位圆的**重叠部分**是不稳定区，其余稳定 |
| ③ | $>1$ | 包含原点 | 原点已不稳定，稳定圆内部为稳定区（与②对称） |
| ④ | $>1$ | 不包含原点 | 稳定圆内部仍不稳定，但判断方式与①相反，需重新代入特殊点核查 |

> **【易错点】**
> 千万不要凭"圆心在单位圆内 = 圆内稳定"这种笼统直觉下结论，必须**代入一个已知点（通常是原点）算出 $|\Gamma_{\mathrm{in}}|$ 或 $|\Gamma_{\mathrm{out}}|$ 的真实值**，再结合圆的位置关系确定哪一侧是稳定区。原理只有一条：稳定圆是边界，边界两侧必有一侧稳定一侧不稳定，**用一个测试点就能一锤定音**。

## 10.4 $K$-$\Delta$ 判据与 $\mu$ 因子

### 10.4.1 稳定系数 $K$（Rollett 稳定系数）的推导

> **【公式推导】**
> 无条件稳定要求**单位圆与两个稳定圆都不相交**（或稳定圆把单位圆完全排除在不稳定区之外）。几何上可证明，这等价于下列条件同时成立：圆心到原点的距离大于半径加 1（圆不相交）且满足一定符号关系。经过整理（过程涉及把 (10-2-5)(10-2-6) 代入"圆不相交"的不等式 $|\Gamma_0|-r>1$ 并化简），可得到一个用 $S$ 参数直接表示的判据：
>
> $$\boxed{\ K=\frac{1-|S_{11}|^2-|S_{22}|^2+|\Delta|^2}{2|S_{12}S_{21}|}\ }
> \tag{10-4-1}$$
>
> 其中 $\Delta=S_{11}S_{22}-S_{12}S_{21}$。$K$ 称为 **Rollett 稳定系数**（1962 年提出）。
>
> **无条件稳定的充要条件**：
>
> $$\boxed{\ K>1\quad\text{且}\quad|\Delta|<1\ }
> \tag{10-4-2}$$
>
> **物理意义**：$K$ 的分子 $1-|S_{11}|^2-|S_{22}|^2+|\Delta|^2$ 综合反映了器件的固有反射（$|S_{11}|^2$、$|S_{22}|^2$ 越小越有利于稳定）与内部正反馈强弱（$|\Delta|$ 过大意味着 $S_{12}S_{21}$ 的反馈作用显著，容易失稳），分母 $2|S_{12}S_{21}|$ 则是增益-反馈乘积的量度。$K$ 越大，器件对负载变化的"容忍度"越高。

> **【易错点】**
> 只满足 $K>1$ 而不检查 $|\Delta|<1$ 是最常见的失分点。$K>1$ 只保证了"不稳定区域不与单位圆相交或被完全排斥在外"这一**部分**几何条件，但如果 $|\Delta|\ge1$，输出端口在**无源负载短路或开路附近**仍可能出现问题（$\Delta$ 关系到整个网络在高反射负载下的行为）。只有**两条同时满足**才是充要条件。

### 10.4.2 单一判据：$\mu$ 因子

> **【核心概念】**
> $K$-$\Delta$ 判据需要同时核对两个不等式，工程上更常用**单一判据** $\mu$ 因子（Edwards-Sinsky，1992 年提出）：
>
> $$\boxed{\ \mu=\frac{1-|S_{11}|^2}{\left|S_{22}-\Delta S_{11}^*\right|+|S_{12}S_{21}|}\ }
> \tag{10-4-3}$$
>
> **无条件稳定的充要条件**：
>
> $$\boxed{\ \mu>1\ }
> \tag{10-4-4}$$
>
> $\mu$ 的物理意义可以理解为"输出稳定圆到单位圆边界的最短距离，归一化为单位圆半径"，即 $\mu=\left(|\Gamma_0^{(L)}|-r_L\right)$ 经过适当归一的等价量——其值越大，说明器件离"潜在不稳定"的边界越远，**稳定裕量**（stability margin）越大，可以直接用 $\mu$ 值比较不同器件的稳定裕度优劣，这是 $K$-$\Delta$ 做不到的（$K$ 与 $\Delta$ 是两个数，无法单独排序"谁更稳定"）。
>
> **$\mu$ 因子的两大优点**：① 只需一个不等式即可完整判断无条件稳定性，无需联立 $|\Delta|<1$；② $\mu$ 的数值大小本身就是稳定裕量的直接度量，便于器件选型与工艺容差分析。

> **【例题 10-1】**
> **题目**：某微波晶体管在 $f=4\ \mathrm{GHz}$ 时测得 $S_{11}=0.6\angle-60^\circ$、$S_{12}=0.05\angle26^\circ$、$S_{21}=2.5\angle80^\circ$、$S_{22}=0.5\angle-40^\circ$，判断该晶体管在此频率下是否无条件稳定。
>
> **思路**：先算 $\Delta$，再代入 $K$ 公式，核对 $K>1$ 与 $|\Delta|<1$ 是否同时成立。
>
> **详细步骤**：
> 第一步，化直角坐标：$S_{11}=0.300-j0.520$，$S_{22}=0.383-j0.321$，$S_{12}S_{21}=0.05\times2.5\angle(26^\circ+80^\circ)=0.125\angle106^\circ=-0.0344+j0.1201$。
>
> 第二步，求 $\Delta=S_{11}S_{22}-S_{12}S_{21}$：
> $S_{11}S_{22}=(0.300-j0.520)(0.383-j0.321)=0.1149-j0.0963-j0.1992+j^2\cdot0.1669=0.1149-0.1669-j0.2955=-0.0520-j0.2955$。
> $\Delta=(-0.0520-j0.2955)-(-0.0344+j0.1201)=-0.0176-j0.4156$，$|\Delta|\approx0.4160<1$ ✓（满足第二个条件）。
>
> 第三步，求 $K$：$|S_{11}|^2=0.36$，$|S_{22}|^2=0.25$，$|\Delta|^2\approx0.1731$，$|S_{12}S_{21}|=0.125$。
> $$K=\frac{1-0.36-0.25+0.1731}{2\times0.125}=\frac{0.5631}{0.25}\approx2.25$$
>
> **结果**：$K\approx2.25>1$ 且 $|\Delta|\approx0.416<1$，两条件**同时满足**，该晶体管在 $4\ \mathrm{GHz}$ **无条件稳定**，可以接任意无源源、负载阻抗而不自激。
>
> **讨论**：注意 $|S_{21}|=2.5>1$（器件本身有增益）并不妨碍无条件稳定，稳定性由 $K$、$\Delta$ 综合决定，不能只看某一个 $S$ 参数的大小。

## 10.5 有条件稳定管子的稳定化方法

当 $K<1$（或 $\mu<1$）时，器件只在部分 $\Gamma_S$、$\Gamma_L$ 范围内稳定。实际设计中常用以下两种方法把器件"拉"入无条件稳定区域。

> **【工程应用】**
> **方法一：电阻加载稳定化（resistive loading）**。在输入或输出端口并联或串联一个电阻，人为"吸收"掉导致不稳定的反射能量，相当于增大 $|S_{11}|$、$|S_{22}|$ 分母项中的损耗、压低回路增益。常见做法：
> - 输出端并联小电阻（分流损耗，牺牲输出端的反射特性换取稳定）；
> - 输入端串联小电阻（代价是引入噪声，恶化噪声系数 $F$）。
> **代价**：增益下降（电阻消耗一部分信号功率）、噪声系数上升（电阻本身是噪声源）。因此电阻加载通常用在对噪声不敏感的**末级放大器**，而不用在**低噪声前端**。
>
> **方法二：源极负反馈稳定化（source/emitter degeneration）**。在晶体管的源极（FET）或发射极（BJT）串入一小段电感或电阻，引入**负反馈**。负反馈会改变器件的有效 $S$ 参数（尤其是 $S_{12}$ 有效值增大），从而把 $K$ 值推高到大于 1。
> **代价**：增益略有下降，但**噪声性能几乎不受影响**（电感理论上无损耗，不额外引入热噪声），因此源极负反馈是**低噪声放大器**优先采用的稳定化手段。
>
> **两种方法对比**：

| 方法 | 作用位置 | 原理 | 增益代价 | 噪声代价 | 适用场合 |
|---|---|---|---|---|---|
| 电阻加载 | 输入或输出并/串电阻 | 直接耗散功率、降低回路增益 | 较大 | 较大（引入电阻噪声） | 末级、功率放大器 |
| 源极负反馈 | 源极/发射极串电感 | 引入负反馈改变有效 $S$ 参数 | 较小 | 很小 | 低噪声前端、小信号放大器 |

## 10.6 振荡器设计的负阻法

### 10.6.1 振荡条件

> **【核心概念】**
> 把晶体管设计成**有条件稳定**状态，并在其中选取一个落在"不稳定区域"内的终端反射系数 $\Gamma_T$（通常接在输出端作为负载，或理解为谐振回路），使输入端呈现 $|\Gamma_{\mathrm{in}}|>1$（负阻）。振荡器的闭环由输入端口再接一个无源的终端网络 $\Gamma_1$（天线负载或谐振腔），振荡条件要求反射波在回路中往返一周后**精确自我复现**（幅度不变、相位相同），即
>
> $$\boxed{\ \Gamma_{\mathrm{in}}\Gamma_1=1\ }
> \tag{10-6-1}$$
>
> 等价地，用阻抗语言（$Z_{\mathrm{in}}$ 为器件输入阻抗，$Z_1$ 为终端网络阻抗）：
>
> $$\boxed{\ Z_{\mathrm{in}}+Z_1=0\ }
> \tag{10-6-2}$$
>
> 这意味着 $Z_{\mathrm{in}}$ 的实部与 $Z_1$ 的实部**大小相等、符号相反**（即 $Z_{\mathrm{in}}$ 的负阻恰好抵消 $Z_1$ 的正阻耗散），虚部则互相抵消（满足**谐振**，即相位条件）：
>
> $$\mathrm{Re}[Z_{\mathrm{in}}]=-\mathrm{Re}[Z_1]<0,\qquad \mathrm{Im}[Z_{\mathrm{in}}]=-\mathrm{Im}[Z_1]
> \tag{10-6-3}$$
>
> **设计步骤**：① 选晶体管在某偏置下的 $[S]$ 参数，检查确为有条件稳定（在 Smith 圆图上画出输入稳定圆）；② 在输出端的不稳定区域内选取终端反射系数 $\Gamma_T$（常用大反射、接近开路或短路的无源网络实现），使 $|\Gamma_{\mathrm{in}}|$ 尽量大于 1（典型要求 $|\Gamma_{\mathrm{in}}|\ge1.2\sim1.5$ 留出裕量）；③ 在输入端设计匹配网络 $\Gamma_1=1/\Gamma_{\mathrm{in}}^*$（共轭匹配给出最大振荡功率条件的推广）满足相位条件，构成闭环。

### 10.6.2 起振条件与幅度稳定机制

> **【核心概念】**
> **起振条件（小信号）**：电路刚开始振荡时信号幅度很小，晶体管工作在线性区，此时要求环路增益**大于** 1（而不是恰好等于 1），即
>
> $$|\Gamma_{\mathrm{in}}\Gamma_1|>1\quad(\text{起振瞬间，小信号})
> \tag{10-6-4}$$
>
> 这保证噪声起伏能够被持续放大，振荡幅度由小到大增长。
>
> **幅度稳定机制（大信号）**：随着振荡幅度增大，晶体管进入**非线性（压缩）区**，其有效增益 $|S_{21}|$ 随信号幅度增大而**下降**（增益压缩），导致 $|\Gamma_{\mathrm{in}}|$ 也随之减小。当振荡幅度增长到使
>
> $$|\Gamma_{\mathrm{in}}(A)\,\Gamma_1|=1
> \tag{10-6-5}$$
>
> （$A$ 为振荡幅度）恰好成立时，环路增益降为 1，系统达到**稳态振荡幅度**，不再继续增长——这就是负阻振荡器从起振到幅度稳定的全过程：**小信号负阻起振，大信号增益压缩自限幅**。
>
> **工程含义**：振荡频率由相位条件（谐振条件）精确决定，振幅则由非线性压缩自动"刹车"到平衡点，这也是几乎所有自激振荡器（LC 振荡器、晶体振荡器、负阻二极管振荡器）共有的幅度稳定原理。

> **【记忆技巧】**
> 口诀：**"小信号要大于 1 才能起振，大信号要等于 1 才能稳幅"**。起振看增益裕量，稳幅看压缩平衡。

## 本章小结

1. 放大器自激振荡的物理根源是输入或输出端口呈现**负阻**（$|\Gamma_{\mathrm{in}}|>1$ 或 $|\Gamma_{\mathrm{out}}|>1$），其数值由器件 $S$ 参数与外接的源、负载反射系数 $\Gamma_S$、$\Gamma_L$ 共同决定（式 10-1-1、10-1-2）。
2. **无条件稳定**要求任意无源 $\Gamma_S$、$\Gamma_L$（$|\Gamma|\le1$）都不会导致振荡；**有条件稳定**只在部分区域安全。
3. 令 $|\Gamma_{\mathrm{in}}|=1$（或 $|\Gamma_{\mathrm{out}}|=1$）的边界轨迹是 $\Gamma_L$（或 $\Gamma_S$）平面上的一个圆，称为**输出（输入）稳定圆**，圆心、半径由式 (10-2-5)~(10-2-7) 给出，只与器件 $[S]$ 参数有关。
4. 判断稳定区域需用一个测试点（通常取原点，对应 $\Gamma_L=0$，此时 $\Gamma_{\mathrm{in}}=S_{11}$）代入核实，再结合稳定圆与单位圆的位置关系确定稳定侧。
5. 代数判据：**$K$-$\Delta$ 判据**（$K>1$ 且 $|\Delta|<1$，式 10-4-1、10-4-2）是无条件稳定的充要条件，需联立两式；**$\mu$ 因子**（$\mu>1$，式 10-4-3、10-4-4）是等价的单一判据，且其数值可直接度量稳定裕量，便于比较与优化。
6. 有条件稳定器件可通过**电阻加载**（代价是增益与噪声）或**源极负反馈**（代价较小，适合低噪声场合）稳定化。
7. 振荡器设计的**负阻法**：在有条件稳定器件的不稳定区域内选取终端网络，使输入呈现负阻，满足振荡条件 $\Gamma_{\mathrm{in}}\Gamma_1=1$（即 $Z_{\mathrm{in}}+Z_1=0$）；起振要求小信号环路增益大于 1，稳态振幅由大信号增益压缩自限定在环路增益恰好等于 1 处。

稳定性分析把"放大"与"振荡"这两个看似对立的设计目标统一在同一套 $S$ 参数与反射系数的框架下：放大器设计要**避开**不稳定区，振荡器设计则**主动利用**不稳定区——二者共用同一张稳定圆图，只是设计目标相反。

## 自测题

**一、选择 / 填空**

1. 放大器输入端口出现自激振荡的充分标志是（　）。
   A. $|S_{11}|>1$　B. $|\Gamma_{\mathrm{in}}|>1$　C. $|\Gamma_L|>1$　D. $K>1$

2. 判断无条件稳定的 $K$-$\Delta$ 判据要求 $K$____1 且 $|\Delta|$____1（填 $>$ 或 $<$）。

3. $\mu$ 因子相对于 $K$-$\Delta$ 判据的最大优点是（　）。
   A. 计算更简单　B. 只需单一不等式即可判断，且数值本身代表稳定裕量　C. 不需要知道 $S_{12}$　D. 适用范围更广

4. 源极负反馈稳定化相比电阻加载稳定化，其主要优势是____。

5. 负阻振荡器起振瞬间（小信号）要求环路增益 $|\Gamma_{\mathrm{in}}\Gamma_1|$____1，稳态时要求其____1（填 $>$、$=$、$<$）。

**二、计算题**

6. 已知某晶体管 $S_{11}=0.45\angle150^\circ$、$S_{12}=0.08\angle30^\circ$、$S_{21}=3.0\angle60^\circ$、$S_{22}=0.4\angle-30^\circ$，判断其是否无条件稳定（用 $K$-$\Delta$ 判据）。

7. 某负阻振荡器设计中，晶体管在选定终端网络后输入阻抗为 $Z_{\mathrm{in}}=-30+j40\ \Omega$，求满足振荡条件的谐振回路阻抗 $Z_1$ 应取何值（给出实部、虚部）。

---

**参考答案与解析**

1. **B**。$|\Gamma_{\mathrm{in}}|>1$ 直接对应输入端呈现负阻，是自激振荡的充分（且必要）标志；$|S_{11}|>1$ 只是 $\Gamma_L=0$ 这一特殊情形，$K>1$ 仅是必要不充分条件（还需 $|\Delta|<1$）。

2. $K>1$，$|\Delta|<1$。

3. **B**。

4. 源极负反馈通过引入电感负反馈改变有效 $S$ 参数来提升 $K$ 值，电感本身理论上无损耗，几乎不引入额外热噪声，因此噪声性能几乎不受影响，适合低噪声放大器；而电阻加载直接耗散功率，会明显增加噪声系数。

5. 起振要求 $>1$（保证噪声起伏被持续放大）；稳态要求 $=1$（大信号增益压缩后环路增益降到临界值，幅度不再增长）。

6. 化直角坐标：$S_{11}=-0.3897+j0.2250$，$S_{22}=0.3464-j0.2000$，$S_{12}S_{21}=0.08\times3.0\angle90^\circ=0.24\angle90^\circ=j0.24$。
   $S_{11}S_{22}=(-0.3897+j0.2250)(0.3464-j0.2000)=-0.1350+j0.0779+j0.0780-j^2\cdot0.0450=-0.1350+0.0450+j0.1559=-0.0900+j0.1559$。
   $\Delta=S_{11}S_{22}-S_{12}S_{21}=(-0.0900+j0.1559)-j0.24=-0.0900-j0.0841$，$|\Delta|\approx0.1232<1$ ✓。
   $|S_{11}|^2=0.2025$，$|S_{22}|^2=0.16$，$|\Delta|^2\approx0.01518$，$|S_{12}S_{21}|=0.24$。
   $$K=\frac{1-0.2025-0.16+0.01518}{2\times0.24}=\frac{0.6527}{0.48}\approx1.36$$
   $K\approx1.36>1$ 且 $|\Delta|\approx0.123<1$，两条件同时满足，**该晶体管无条件稳定**（该偏置点不适合直接做振荡器，需改用其他偏置或外加反馈使其进入有条件稳定区）。

7. 由振荡条件 $Z_{\mathrm{in}}+Z_1=0$，得 $Z_1=-Z_{\mathrm{in}}=-(-30+j40)=30-j40\ \Omega$。即谐振回路应呈现电阻 $30\ \Omega$（吸收晶体管释放的负阻功率，维持稳态）与容性电抗 $-j40\ \Omega$（与晶体管输入端的感性虚部 $j40\ \Omega$ 互相抵消，满足相位谐振条件）。
