# 欢迎使用《微波技术基础》在线学习指南

本指南依据大连理工大学赵楠教授《微波技术基础》（辽宁省一流线下课程，32 学时）的完整课件体系编写，覆盖**绪论、均匀传输线理论、规则金属波导、微波传输线、微波网络基础、微波无源器件**六章正文，外加**无耗网络 $[Z]$ 矩阵**与**网络对称性**两个专题推导。

与课件不同，这里的每一节都补齐了课件因课时压缩而略去的**推导过程、物理图像与工程背景**：公式不仅给出结果，还说明它从哪来、为什么成立、什么时候不能用。

<div class="hero">
  <h1>从"路"到"场"再到"网络"<br>一条主线贯穿微波工程</h1>
  <p>微波技术有三种分析方法，它们不是三门课，而是同一套麦克斯韦方程在不同抽象层次上的投影。本指南按这三种方法的交替推进来组织内容：先用路分析法建立直觉，再用场分析法求得严格解，最后用网络分析法把复杂结构抽象成端口上的矩阵。</p>

## 三种分析方法：本指南的组织逻辑

微波工程的困难在于：频率升高后，低频电路的两条基本假设——**元件是集中的**、**电压电流是全电路同一個值**——同时失效。于是必须分层处理。

| 方法 | 出发方程 | 得到什么 | 优点 | 局限 | 对应章节 |
|---|---|---|---|---|---|
| **路分析法** | 传输线方程（电报方程） | 沿线电压 $U(z)$、电流 $I(z)$ | 简便、直观、工程实用 | 只在"单模传输 + 可定义 $U,I$"时有效 | 第 2 章 |
| **场分析法** | 麦克斯韦方程组 + 边界条件 | 严格场解 $E(x,y,z)$、$H(x,y,z)$ | 严格、普适、可给出模式谱 | 推导繁琐，对复杂形状难以求解 | 第 3 章 |
| **网络分析法** | 端口量与矩阵关系 | $[Z]$、$[Y]$、$[A]$、$[S]$ 矩阵 | 与内部结构无关，便于级联与测量 | 丢失内部场信息 | 第 5 章 |

> **【核心概念】**
> 这三者的关系是"**同一物理对象的三副面孔**"。第 4 章的各种实际传输线（同轴线、带状线、微带线）是"路"与"场"的桥梁：它们既有明确的 $Z_0$（路），又有具体的场分布（场）。第 6 章的各种器件则是"网络"的落地：每一个器件都用一组 $[S]$ 参数定义其全部外部行为。

## 建议使用方法

> **【考点】推荐的四步学习闭环**
> 1. **读章节页**：先通读一遍，不求全懂，重点是把每节的"物理图像"抓住——这一节在解决什么问题、结论是什么。
> 2. **动笔推公式**：合上页面，在白纸上默写本节的核心公式并自己推一遍。推不出来的地方就是真正的薄弱点。
> 3. **用公式速查手册复习**：隔一天再看速查手册，检验是否还记得每个公式的成立条件与单位。这一步能筛掉"记住了形式、忘了适用条件"的隐性错误。
> 4. **做自测题并限时**：把自测题当作考试，限时闭卷完成后再对答案。错题要回到对应章节页重读该节。

## 学习目标：学完本指南你应该能做到

**计算能力**

- 由 $Z_0$、$Z_l$、$f$、$z$ 求 $Z_{\mathrm{in}}(z)$，并由 $\Gamma_l$ 求 $\rho$ 与波腹/波节点位置
- 在史密斯圆图上完成阻抗↔导纳换算、求 $Z_{\mathrm{in}}$、设计单枝节匹配
- 由工作频率设计矩形波导尺寸并确定单模工作区
- 计算 $\lambda_g$、$v_p$、$v_g$、$Z_{\mathrm{TE}}$、$Z_{\mathrm{TM}}$
- 由同轴线或微带线的几何与介质参数求 $Z_0$（含 Hammerstad 公式）
- 由 $[S]$ 判别网络的无耗性、互易性与对称性

**推导能力**

- 从线元等效电路推导电报方程
- 证明空心单导体波导中不存在 TEM 波
- 证明无耗网络 $[Z]^+=-[Z]$
- 证明结构对称网络 $S_{11}=S_{22}$
- 证明三端口无耗互易网络不能同时匹配

**判断能力**

- 判别微波传输线处于行波、驻波还是行驻波状态
- 判别某模式在某频率下是传输还是截止
- 判别网络是否有耗、是否互易、是否对称
- 判断一个微波元件能否用集总参数描述

---

> **【小结】**
> 微波技术的主线只有一条：**频率升高使波长与结构尺寸可比拟，于是"集中参数"退化为"分布参数"、"电路"退化为"场"、"元件"退化为"网络"**。第 2 章给你分布参数的语言，第 3 章给你场的严格解，第 5 章给你网络的黑箱工具，第 4、6 章则把三者落到真实器件上。抓住这条主线，各章的公式就不再是零散的公式表，而是同一套逻辑在不同层次上的表达。
