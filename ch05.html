### 5.5.1 多端口网络

对 $n$ 端口网络，全部关系形式不变，只是矩阵升为 $n\times n$：

$$
[b]=[S][a],\qquad
S_{ij}=\frac{b_i}{a_j}\Big|_{a_k=0,\ k\ne j}
$$

**性质（多端口通用）：**

| 性质 | 判据 | 备注 |
|---|---|---|
| 互易 | $[S]=[S]^{T}$，即 $S_{ij}=S_{ji}$ | $[Z]=[Z]^{T}$、$[Y]=[Y]^{T}$ 同理 |
| 对称 | $S_{ii}=S_{jj}$（对应端口对） | 需先明确哪些端口"成对" |
| 无耗 | $[S]^{+}[S]=[I]$（幺正） | 等价于 $[Z]^{+}=-[Z]$ |

**多端口 $[Z]$**：定义同双端口，

$$
\begin{bmatrix}U_1\\\vdots\\U_n\end{bmatrix}
=\begin{bmatrix}Z_{11}&\cdots&Z_{1n}\\\vdots&\ddots&\vdots\\Z_{n1}&\cdots&Z_{nn}\end{bmatrix}
\begin{bmatrix}I_1\\\vdots\\I_n\end{bmatrix},
\qquad
Z_{ij}=\frac{U_i}{I_j}\Big|_{I_k=0,\ k\ne j}
$$

即**除端口 $j$ 外所有端口开路**。$[Y]$ 对偶（除端口 $j$ 外所有端口短路）。
$[Z][Y]=[I]$（仅在两者都存在时）。

> **【易错点】**
> 多端口时：
> 1. **$[Z]$ 与 $[Y]$ 都可能不存在**（行列式为零），甚至可能**两者都奇异**；
>    $[S]$ 与 $[A]$ 则几乎总是存在（$[A]$ 对多端口不再定义为方阵，改用 $[S]$）。
> 2. **$Z_{ij}$ 的下标顺序不能颠倒**（$Z_{ij}=U_i/I_j$），
>    这与 $S_{ij}=b_i/a_j$ 的一致。
> 3. **"对称"在多端口最容易出错**：三端口网络可能有 $S_{11}=S_{22}$
>    但 $S_{33}\ne S_{11}$（例如 E-T 接头的三个臂不等长）。

### 5.5.2 四矩阵两两转换汇总表（本章最全）

**约定**：$Z_{01}=Z_{02}=Z_0$；$\Delta_Z=Z_{11}Z_{22}-Z_{12}Z_{21}$；
$\Delta_Y=Y_{11}Y_{22}-Y_{12}Y_{21}$；$\Delta_A=AD-BC$；
$D_S=(1-S_{11})(1-S_{22})-S_{12}S_{21}$；
$D_Z=(Z_{11}+Z_0)(Z_{22}+Z_0)-Z_{12}Z_{21}$；
$D_Y=(Y_{11}+Y_0)(Y_{22}+Y_0)-Y_{12}Y_{21}$，$Y_0=1/Z_0$。

| 从 ↓ / 到 → | $[Z]$ | $[Y]$ | $[A]$ | $[S]$ |
|---|---|---|---|---|
| **$[Z]$** | — | $[Y]=[Z]^{-1}$（式 5-3-7） | $A=\dfrac{Z_{11}}{Z_{21}},\ B=\dfrac{\Delta_Z}{Z_{21}},\ C=\dfrac{1}{Z_{21}},\ D=\dfrac{Z_{22}}{Z_{21}}$ | $S_{11}=\dfrac{(Z_{11}-Z_0)(Z_{22}+Z_0)-Z_{12}Z_{21}}{D_Z}$，$S_{12}=\dfrac{2Z_{12}Z_0}{D_Z}$，$S_{21}=\dfrac{2Z_{21}Z_0}{D_Z}$，$S_{22}=\dfrac{(Z_{11}+Z_0)(Z_{22}-Z_0)-Z_{12}Z_{21}}{D_Z}$ |
| **$[Y]$** | $[Z]=[Y]^{-1}$ | — | $A=-\dfrac{Y_{22}}{Y_{21}},\ B=-\dfrac{1}{Y_{21}},\ C=-\dfrac{\Delta_Y}{Y_{21}},\ D=-\dfrac{Y_{11}}{Y_{21}}$ | $S_{11}=\dfrac{(Y_0-Y_{11})(Y_0+Y_{22})+Y_{12}Y_{21}}{D_Y}$，$S_{12}=-\dfrac{2Y_{12}Y_0}{D_Y}$，$S_{21}=-\dfrac{2Y_{21}Y_0}{D_Y}$，$S_{22}=\dfrac{(Y_0+Y_{11})(Y_0-Y_{22})+Y_{12}Y_{21}}{D_Y}$ |
| **$[A]$** | $Z_{11}=\dfrac{A}{C},\ Z_{12}=\dfrac{\Delta_A}{C},\ Z_{21}=\dfrac{1}{C},\ Z_{22}=\dfrac{D}{C}$ | $Y_{11}=\dfrac{D}{B},\ Y_{12}=-\dfrac{\Delta_A}{B},\ Y_{21}=-\dfrac{1}{B},\ Y_{22}=\dfrac{A}{B}$ | — | 式 (5-4-33) |
| **$[S]$** | 式 (5-3-14) | 由 $[S]\to[Z]\to[Y]$ | 式 (5-4-35) | — |

**转换的"通关"技巧：**

> **【记忆技巧】**
> 1. **$[Z]\leftrightarrow[Y]$**：直接求逆（$2\times2$ 用行列式）；
> 2. **$[Z]\leftrightarrow[A]$**：记 $A=\dfrac{Z_{11}}{Z_{21}}$、$C=\dfrac{1}{Z_{21}}$
>    两组"分母都是 $Z_{21}$"，其余用 $\Delta_Z$ 补；
> 3. **$[A]\leftrightarrow[S]$**：分母统一是 $A+B+C+D$（归一化）；
> 4. **任意两个矩阵之间都可以"绕道"**：$[Z]\to[A]\to[S]$、
>    $[S]\to[A]\to[Z]$，**不必记住所有两两公式**——
>    只要能熟练走通"$[Z]\leftrightarrow[A]\leftrightarrow[S]$"这条主链，
>    任何转换都能两步完成。
> 5. **"计算用 $[A]$/$[Z]$，测量用 $[S]$"**：
>    给出电路图 → 求 $[A]$ 或 $[Z]$ → 换算到 $[S]$；
>    给出测量数据 → $[S]$ → 换算到所需矩阵。

### 5.5.3 例 5.8：由 $[A]$ 求 $[S]$ 并计算 $Z_{\mathrm{in}}$

> **【例题 5-8】**
> 某双端口网络由**串联阻抗 $Z=j50\ \Omega$**（纯电抗）构成，
> 两端接 $Z_0=50\ \Omega$ 系统。
> (1) 写出其 $[A]$ 矩阵；(2) 求 $[S]$ 矩阵并判断网络性质；
> (3) 端口 2 接 $Z_l=50\ \Omega$ 匹配负载时，求 $Z_{\mathrm{in}}$ 与回波损耗；
> (4) 端口 2 开路时，求 $Z_{\mathrm{in}}$。

**解：**

**（1）$[A]$ 矩阵**

串联阻抗的 $[A]$（表 5-1）：

$$
[A]=\begin{bmatrix}1&Z\\0&1\end{bmatrix}=\begin{bmatrix}1&j50\\0&1\end{bmatrix}
$$

**归一化**（$Z_0=50\ \Omega$）：

$$
\bar A=1,\quad \bar B=\frac{Z}{Z_0}=j1,\quad \bar C=0,\quad \bar D=1
$$

$$
[\bar A]=\begin{bmatrix}1&j\\0&1\end{bmatrix}
$$

**（2）$[S]$ 矩阵**

由 (5-4-33)（用归一化参数）：

$$
A+B+C+D=1+j+0+1=2+j
$$

$$
S_{11}=\frac{A+B-C-D}{A+B+C+D}=\frac{1+j-0-1}{2+j}=\frac{j}{2+j}
$$

$$
S_{21}=\frac{2}{A+B+C+D}=\frac{2}{2+j}
$$

$$
S_{22}=\frac{-A+B-C+D}{A+B+C+D}=\frac{-1+j-0+1}{2+j}=\frac{j}{2+j}=S_{11}
$$

$$
S_{12}=\frac{2(AD-BC)}{A+B+C+D}=\frac{2(1\cdot1-j\cdot0)}{2+j}=\frac{2}{2+j}=S_{21}
$$

**化简**：

$$
\frac{j}{2+j}=\frac{j(2-j)}{(2+j)(2-j)}=\frac{2j-j^{2}}{4+1}
=\frac{1+2j}{5}=0.2+j0.4
$$

$$
|S_{11}|=\frac{\sqrt{5}}{5}=\frac{1}{\sqrt{5}}=0.4472,\qquad
\angle S_{11}=\arctan\frac{0.4}{0.2}=\arctan 2=63.43^\circ
$$

$$
\frac{2}{2+j}=\frac{2(2-j)}{5}=\frac{4-2j}{5}=0.8-j0.4
$$

$$
|S_{21}|=\frac{\sqrt{20}}{5}=\frac{2\sqrt{5}}{5}=0.8944=2|S_{11}|,\qquad
\angle S_{21}=-26.57^\circ
$$

**结果：**

$$
\boxed{\;
[S]=\begin{bmatrix}0.2+j0.4 & 0.8-j0.4\\ 0.8-j0.4 & 0.2+j0.4\end{bmatrix}
=\begin{bmatrix}0.4472\angle 63.43^\circ & 0.8944\angle{-26.57^\circ}\\
0.8944\angle{-26.57^\circ} & 0.4472\angle 63.43^\circ\end{bmatrix}
\;}
$$

**校核（无耗性）**：

$$
|S_{11}|^{2}+|S_{21}|^{2}=0.2+0.8=1\ \checkmark
$$

**第 1 列模平方和为 1，第 2 列同理**，故 $[S]^{+}[S]=[I]$——**无耗** ✓，
与"纯电抗元件"的物理预期一致。

**互易性**：$S_{12}=S_{21}$ ✓。
**对称性**：$S_{11}=S_{22}$ ✓（串联元件对两个端口是对称的）。

**（3）端口 2 接匹配负载**

$$
Z_{\mathrm{in}}=\frac{AZ_l+B}{CZ_l+D}
=\frac{1\times50+j50}{0\times50+1}=50+j50\ \Omega
$$

**物理核对**：端口 2 接 $50\ \Omega$，端口 1 看到的是"$50\ \Omega$ 串 $j50\ \Omega$" ✓。

$$
\Gamma_{\mathrm{in}}=\frac{Z_{\mathrm{in}}-Z_0}{Z_{\mathrm{in}}+Z_0}
=\frac{j50}{100+j50}=\frac{j}{2+j}=S_{11}\ \checkmark
$$

（这也验证了"端口 2 匹配时 $\Gamma_{\mathrm{in}}=S_{11}$"。）

$$
L_r=-20\lg|S_{11}|=-20\lg0.4472=6.99\ \mathrm{dB}
$$

**（4）端口 2 开路**

$$
Z_{\mathrm{in}}\Big|_{I_2=0}=\frac{A\cdot\infty+B}{C\cdot\infty+D}\to\frac{A}{C}
$$

$C=0$，说明 $[A]$ 的 $C$ 为零时上述极限法失效，改用定义：
$I_2=0$ 时，串联元件上无电流，$U_1=U_2$，而端口 2 开路无电流，
故端口 1 看进去**也是开路**：

$$
\boxed{\;Z_{\mathrm{in}}\Big|_{I_2=0}\to\infty\;}
$$

**用 $[Z]$ 验证**：串联阻抗的 $[Z]=\begin{bmatrix}Z&Z\\Z&Z\end{bmatrix}$，
$I_2=0$ 时 $U_1=ZI_1$，$U_2=ZI_1$，确实 $I_1=0$ 时网络无电流，
端口 1 呈开路（$Z_{11}=Z\ne\infty$，但"输入阻抗"要用 $U_1/I_1$ 在
$I_2=0$ 条件下算，得 $Z$）——

> **【易错点】**
> 这里有一个重要区别：
> - **$Z_{\mathrm{in}}$（端口 2 接负载）**：$Z_{\mathrm{in}}=\dfrac{AZ_l+B}{CZ_l+D}$；
> - **$Z_{11}$（端口 2 开路）**：$Z_{11}=\dfrac{U_1}{I_1}\Big|_{I_2=0}=\dfrac{A}{C}$，
>   对串联元件 $C=0$，须用定义直接算，结果是 $Z$（而不是 $\infty$）。
>
> 本题中端口 2 **开路**时，端口 1 看进去是**串联元件自身**的阻抗
> $Z_{11}=Z=j50\ \Omega$（因为端口 2 无电流，串联元件上压降为 $I_1Z$，
> 端口 1 电压为 $I_1Z$）。**"端口 2 开路"≠"端口 1 也开路"。**
> 前面的 $\to\infty$ 结论是错误直觉，正确结果是

$$
\boxed{\;Z_{11}=\frac{U_1}{I_1}\Big|_{I_2=0}=Z=j50\ \Omega\;}
$$

**（用式 5-3-29）**：$Z_{11}=Z=j50\ \Omega$ ✓ 与定义一致。

**（5）讨论**

- 纯电抗网络**无耗**，$|S_{11}|^{2}+|S_{21}|^{2}=1$ 必然成立；
- 串联电抗会使**反射增大**（$|S_{11}|=0.447$），且 $Z_{\mathrm{in}}$ 带上电抗分量；
- **要匹配**，需要在输入端再加一个反号的并联电纳（如并联电容/短线）
  抵消 $j50\ \Omega$ 的影响——这正是**匹配网络设计**的起点。

## 本章小结

1. **网络分析法的定位**：微波元件内部是不均匀区，场分布复杂且含有高次模，
   工程上只需端口上的电压、电流、功率关系。于是把不均匀区视为"黑盒子"，
   用网络参数矩阵描述。三种方法各司其职：
   **路（TEM，简单不严格）→ 场（精确复杂）→ 网络（场信息的再次路化，方便可测）**。

2. **等效传输线**：对非 TEM 波（如波导 TE$_{10}$），端口量 $U$、$I$ 不唯一。
   用"**三条规定**（正比关系、功率相等、阻抗关系）**+ 两个条件**（模式正交归一
   $\int\mathbf{e}\times\mathbf{h}^{*}\cdot d\mathbf{S}=1$、波阻抗一致
   $Z_{ek}=\frac{h_k}{e_k}Z_{wk}$）"来定义模式电压、模式电流与等效特性阻抗。
   关键结论：**波阻抗 $Z_{wk}$ 是确定的，等效特性阻抗 $Z_{ek}$ 是等效的**，
   取法不同 $Z_e$ 差常数倍，但功率关系与匹配结论不变。

3. **单口网络**就是推广的负载：$Z_{\mathrm{in}}=U/I$、
   $\Gamma=\frac{Z_{\mathrm{in}}-Z_0}{Z_{\mathrm{in}}+Z_0}$、
   $P=\frac{1}{2}\mathrm{Re}[UI^{*}]=\frac{1}{2}|I|^{2}\mathrm{Re}[Z_{\mathrm{in}}]
   =\frac{1}{2}|U|^{2}\mathrm{Re}[1/Z_{\mathrm{in}}]$、
   $P=P_{\mathrm{in}}(1-|\Gamma|^{2})$。

4. **归一化**：$\bar U=U/\sqrt{Z_0}$、$\bar I=I\sqrt{Z_0}$，
   使 $\frac{1}{2}\mathrm{Re}[\bar U\bar I^{*}]$ **功率不变**；
   $\bar z=\bar U/\bar I=(1+\Gamma)/(1-\Gamma)$。
   归一化消除 $Z_0$ 差异、统一圆图、简化级联。

5. **$[Z]$ 与 $[Y]$**：$[U]=[Z][I]$、$[I]=[Y][U]$，$[Z][Y]=[I]$。
   $[Z]$ 用**开路法**测（$Z_{ij}=U_i/I_j|_{I_k=0}$），
   $[Y]$ 用**短路法**测。互易 ⇒ $Z_{12}=Z_{21}$；对称 ⇒ $Z_{11}=Z_{22}$；
   无耗 ⇒ $[Z]^{+}=-[Z]$（反厄米），无耗且互易 ⇒ $[Z]$ 为**纯虚对称矩阵**。

6. **$[A]$（ABCD）矩阵**：定义
   $\begin{bmatrix}U_1\\I_1\end{bmatrix}=[A]\begin{bmatrix}U_2\\-I_2\end{bmatrix}$，
   $A$、$D$ 为无量纲电压/电流比，$B$ 为转移阻抗，$C$ 为转移导纳。
   互易 ⇒ $AD-BC=1$；对称 ⇒ $A=D$；无耗 ⇒ $A$、$D$ 实、$B$、$C$ 纯虚。
   **最大优点是级联 $[A]=[A_1][A_2]\cdots[A_n]$**，配合"串联 $Z$、并联 $Y$、
   传输线段"三类基本单元表即可拼出任意网络。

7. **矩阵转换**：以"$[Z]\leftrightarrow[A]\leftrightarrow[S]$"为主链，
   任何两个矩阵都能两步互转。式 (5-3-29)、(5-3-30)、(5-3-13)、(5-3-14)、
   (5-4-33)、(5-4-35) 是必须掌握的六组公式。

8. **$[S]$ 矩阵**：建立在归一化入射波 $a_i$、反射波 $b_i$ 之上
   （$a_i=U_i^{+}/\sqrt{Z_{0i}}$、$b_i=U_i^{-}/\sqrt{Z_{0i}}$，
   $\bar U_i=a_i+b_i$、$\bar I_i=a_i-b_i$），
   $S_{ij}=b_i/a_j|_{a_k=0,k\ne j}$——**其余端口一律接匹配负载**。
   对角元是反射系数，非对角元是传输系数。
   功率 $P_i^{+}=\frac{1}{2}|a_i|^{2}$、$P_i^{-}=\frac{1}{2}|b_i|^{2}$。

9. **$[S]$ 的三大性质**：
   **互易 ⇔ $[S]=[S]^{T}$（对称）**（由洛伦兹互易定理）；
   **无耗 ⇔ $[S]^{+}[S]=[I]$（幺正）**，两个推论是"**列模平方和为 1**"
   与"**不同列正交**"，由此可反解未知 $S$ 参数，并得出
   "**互易无耗三端口不可能全匹配**"这一重要结论；
   **对称 ⇔ $S_{ii}=S_{jj}$**。有耗判据：$[S]^{+}[S]\ne[I]$ 且 $|\det[S]|<1$。

10. **参考面移动**：$S'_{ii}=S_{ii}e^{-j2\theta_i}$、
    $S'_{ij}=S_{ij}e^{-j(\theta_i+\theta_j)}$，$\theta_i=\beta_il_i$。
    **模值不变、相位改变**——这是 $[S]$ 参数测量必须做参考面校准的根本原因。

11. **$[T]$ 矩阵**为级联而生（$\begin{bmatrix}b_1\\a_1\end{bmatrix}=[T]\begin{bmatrix}a_2\\b_2\end{bmatrix}$），
    互易 ⇒ $\det[T]=1$，对称 ⇒ $T_{12}=-T_{21}$；
    $[S]$ 与 $[T]$ 可互转（式 5-4-39、5-4-40）。

12. **测量**：$[S]$ 参数用三点测量法（匹配/短路/开路）或用矢量网络分析仪；
    双端口全部 $S$ 参数需要**三种终端状态 + 两次连接（正接/反接）**。
    工程思路是：**复杂电路 → 分解为基本单元 → 各单元 $[A]$ → 级联求总 $[A]$
    → 换算到 $[S]$/$[T]$**。

本章是**网络分析法**的核心，也是第六章各类微波器件（E-T、H-T、魔 T、
定向耦合器、环行器、滤波器）的理论基础：**用幺正性、互易性、对称性
三大性质就能"反解"出器件的 $S$ 矩阵**，而不必去解复杂的边值问题。
一句话概括全章：**把"场"变成"路"，把"路"变成"矩阵"，把"矩阵"变成可测量的"波"。**

$$
(1) 用幺正性条件写出 $|S_{11}|$ 与 $|\alpha|$ 满足的方程；

### 参考答案与详解

**题 1**　**答案：B**

**详解**：参考面移动时，$S'_{ij}=S_{ij}e^{-j(\theta_i+\theta_j)}$，
指数因子的模为 1，所以**模值不变、相位改变**，B 正确。
C 错在"对角元相移 $\theta_i$"——因为反射波要**往返**一次，
对角元的相移是 $2\theta_i$。A 错：网络参数**确实**与参考面有关。
D 错：参考面必须远离不均匀区，否则高次模未衰减，单一模式的
$U$、$I$（及 $a$、$b$）不足以描述端口状态。

---

**题 2**　**答案：A**

**详解**：$[Z]$ 的定义式 $Z_{ij}=\dfrac{U_i}{I_j}\Big|_{I_k=0}$ 要求其余端口
**开路**（$I=0$），所以 $[Z]$ 是**开路阻抗参数**；
$[Y]$ 的定义式 $Y_{ij}=\dfrac{I_i}{U_j}\Big|_{U_k=0}$ 要求其余端口
**短路**（$U=0$），所以 $[Y]$ 是**短路导纳参数**。故选 A。

---

**题 3**　**答案：$|S_{21}|=0.8$；$|S_{22}|=|S_{11}|=0.6$**

**详解**：无耗网络满足 $[S]^{+}[S]=[I]$，取第 1 列：

$$
|S_{11}|^{2}+|S_{21}|^{2}=1
\ \Longrightarrow\
|S_{21}|=\sqrt{1-0.6^{2}}=\sqrt{0.64}=0.8
$$

又无耗**互易**网络（双端口）满足 $|S_{22}|=|S_{11}|$：

由第 2 列 $|S_{12}|^{2}+|S_{22}|^{2}=1$ 且互易 $|S_{12}|=|S_{21}|=0.8$，

$$
|S_{22}|=\sqrt{1-0.8^{2}}=0.6=|S_{11}|\ \checkmark
$$

**题 4**　**答案：B（有耗、互易）**

**详解**：
**互易性**：$S_{12}=0.9=S_{21}$ ✓ 互易。
**无耗性**：第 1 列模平方和
$|S_{11}|^{2}+|S_{21}|^{2}=0.01+0.81=0.82\ne1$，
故 $[S]^{+}[S]\ne[I]$，**有耗**。
再验证 $|\det[S]|=|0.1\times0.2-0.81|=|0.02-0.81|=0.79<1$ ✓，
符合有耗判据（能量被吸收）。

**题 5**　**答案：**

$$
a_i=\frac{U_i^{+}}{\sqrt{Z_{0i}}}=\frac{1}{2}\left(\bar U_i+\bar I_i\right);
\qquad
P_i^{+}=\frac{1}{2}|a_i|^{2};
\qquad
[S]^{+}[S]=[I]
$$

**题 6**

**（1）判断互易性与无耗性**

> **【易错点】**
> 拿到 $[A]$ 矩阵，**第一件事是核对自洽性**，不要急着往下算：
> **互易 ⇒ $\bar A\bar D-\bar B\bar C=1$；无耗 ⇒ $A,D$ 实、$B,C$ 纯虚。**
> 这两个条件**相互独立**，必须分别验证。

**互易性**：$\bar A=1$、$\bar B=j0.75$、$\bar C=0$、$\bar D=1$，

$$
\bar A\bar D-\bar B\bar C=1\times1-j0.75\times0=1\ \checkmark
$$

满足 $\bar A\bar D-\bar B\bar C=1$，**互易** ✓。

**无耗性**：

$$
A=1\ (\text{实}),\qquad D=1\ (\text{实}),\qquad B=j0.75\ (\text{纯虚}),\qquad C=0\ (\text{纯虚})
$$

四个元素全部符合"**$A$、$D$ 为实数，$B$、$C$ 为纯虚数**"的无耗条件，
故**无耗** ✓。

**物理意义核对**：$\bar B=j0.75$ 表示一个**归一化纯电抗 $j0.75$**
（即 $X=0.75\times50=37.5\ \Omega$ 的串联感抗），
纯电抗元件既不耗能也不产生能量，**必然无耗** ✓，
与矩阵判断完全一致。

**（2）求 $[S]$**

用 (5-4-33)，$A=1$、$B=j0.75$、$C=0$、$D=1$：

$$
A+B+C+D=1+j0.75+0+1=2+j0.75
$$

$$
S_{11}=\frac{A+B-C-D}{A+B+C+D}=\frac{1+j0.75-0-1}{2+j0.75}
=\frac{j0.75}{2+j0.75}
$$

化简（分子分母同乘共轭 $2-j0.75$，$2^{2}+0.75^{2}=4.5625$）：

$$
S_{11}=\frac{j0.75(2-j0.75)}{4.5625}
=\frac{j1.5-j^{2}0.5625}{4.5625}
=\frac{0.5625+j1.5}{4.5625}
=0.1233+j0.3288
$$

$$
|S_{11}|=\sqrt{0.0152+0.1081}=\sqrt{0.1233}=0.3512
$$

$$
\angle S_{11}=\arctan\frac{0.3288}{0.1233}=\arctan 2.667=69.44^\circ
$$

$$
S_{21}=\frac{2}{A+B+C+D}=\frac{2}{2+j0.75}
=\frac{2(2-j0.75)}{4.5625}=\frac{4-j1.5}{4.5625}
=0.8767-j0.3288
$$

$$
|S_{21}|=\sqrt{0.7686+0.1081}=\sqrt{0.8767}=0.9363,\qquad
\angle S_{21}=-20.56^\circ
$$

$$
S_{22}=\frac{-A+B-C+D}{A+B+C+D}=\frac{-1+j0.75-0+1}{2+j0.75}
=\frac{j0.75}{2+j0.75}=S_{11}
$$

$$
S_{12}=\frac{2(\bar A\bar D-\bar B\bar C)}{A+B+C+D}=\frac{2\times1}{2+j0.75}=S_{21}
$$

**结果：**

$$
\boxed{\;
[S]=\begin{bmatrix}0.1233+j0.3288 & 0.8767-j0.3288\\
0.8767-j0.3288 & 0.1233+j0.3288\end{bmatrix}
=\begin{bmatrix}0.3512\angle 69.44^\circ & 0.9363\angle{-20.56^\circ}\\
0.9363\angle{-20.56^\circ} & 0.3512\angle 69.44^\circ\end{bmatrix}
\;}
$$

**校核（三道关）**：

**① 无耗性**（列模平方和为 1）：

$$
|S_{11}|^{2}+|S_{21}|^{2}=0.1233+0.8767=1.0000\ \checkmark
$$

第 2 列同理 ✓。故 $[S]^{+}[S]=[I]$，**无耗** ✓。

**② 互易性**：$S_{12}=S_{21}$ ✓。

**③ 对称性**：$S_{11}=S_{22}$ ✓（串联元件对两端对称）。

> **【核心概念】**
> 本题是一个漂亮的"**闭环验证**"：
> **无耗的 $[A]$（$A,D$ 实、$B,C$ 虚）→ 换算出的 $[S]$ 必然幺正。**
> 反过来说，这条通路也提供了一个**检验换算是否算错**的捷径——
> 只要算出 $|S_{11}|^{2}+|S_{21}|^{2}=1$，就说明 (5-4-33) 用对了。

**（3）端口 2 接 $Z_l=50\ \Omega$ 匹配负载**

端口 2 匹配（$\Gamma_l=0$）时，由 (5-3-35)：

$$
\Gamma_{\mathrm{in}}=S_{11}=0.3512\angle 69.44^\circ,\qquad
|\Gamma_{\mathrm{in}}|=0.3512
$$

$$
\boxed{\;\rho=\frac{1+|\Gamma_{\mathrm{in}}|}{1-|\Gamma_{\mathrm{in}}|}
=\frac{1+0.3512}{1-0.3512}=\frac{1.3512}{0.6488}=2.083\;}
$$

$$
\boxed{\;L_r=-20\lg|\Gamma_{\mathrm{in}}|=-20\lg 0.3512=9.09\ \mathrm{dB}\;}
$$

**答**：$\rho\approx2.08$，$L_r\approx9.1\ \mathrm{dB}$。

**（4）讨论与拓展**

- **用 $Z_{\mathrm{in}}$ 交叉验证**：端口 2 接 $50\ \Omega$ 时

$$
Z_{\mathrm{in}}=\frac{AZ_l+B}{CZ_l+D}
=\frac{1\times50+j37.5}{0\times50+1}=50+j37.5\ \Omega
$$

$$
\Gamma_{\mathrm{in}}=\frac{Z_{\mathrm{in}}-50}{Z_{\mathrm{in}}+50}
=\frac{j37.5}{100+j37.5}
=\frac{j0.75}{2+j0.75}=S_{11}\ \checkmark
$$

（这里已把 $\bar B=j0.75$ 还原为 $B=\bar B\cdot Z_0=j37.5\ \Omega$，
说明**归一化参数与实际参数必须配套使用**，不能混用。）

- **匹配方法**：$Z_{\mathrm{in}}=50+j37.5\ \Omega$ 是有名的"**串联感抗失配**"。
  要匹配，只需在端口 1 **并联**一个合适的电容（或一段开路/短路短线），
  使总输入导纳的虚部为零——这正是**匹配网络设计**的基本手法。
- **$\rho$ 与 $|\Gamma|$ 的换算**：
  $\rho=\dfrac{1+0.3512}{1-0.3512}=2.083$，
  反算 $|\Gamma|=\dfrac{\rho-1}{\rho+1}=0.3512$ ✓。
  记住：**$\rho$ 只依赖 $|\Gamma|$，与相位（即参考面位置）无关**。

**题 7**

**（1）判断性质**

**无耗性**：第 1 列 $|S_{11}|^{2}+|S_{21}|^{2}=0+1=1$ ✓；
第 2 列 $|S_{12}|^{2}+|S_{22}|^{2}=1+0=1$ ✓；
列正交：$S_{11}^{*}S_{12}+S_{21}^{*}S_{22}=0\cdot e^{j30^\circ}+e^{j30^\circ}\cdot 0=0$ ✓。
故 $[S]^{+}[S]=[I]$，**无耗** ✓。

**互易性**：$S_{12}=S_{21}=e^{-j30^\circ}$ ✓ 互易（题设也说互易）。

**对称性**：$S_{11}=S_{22}=0$ ✓ 对称。

**（2）参考面移动**

$$
\theta_1=\frac{2\pi}{\lambda}\times0.05\lambda=0.1\pi=18^\circ,\qquad
\theta_2=\frac{2\pi}{\lambda}\times0.1\lambda=0.2\pi=36^\circ
$$

对角元（原为 0，移动后仍为 0）：

$$
S'_{11}=0\cdot e^{-j36^\circ}=0,\qquad S'_{22}=0\cdot e^{-j72^\circ}=0
$$

非对角元：

$$
S'_{12}=S'_{21}=S_{12}e^{-j(\theta_1+\theta_2)}
=e^{-j30^\circ}\cdot e^{-j54^\circ}=e^{-j84^\circ}
$$

**结果：**

$$
\boxed{\;
[S']=\begin{bmatrix}0&e^{-j84^\circ}\\e^{-j84^\circ}&0\end{bmatrix}
\;}
$$

**（3）回波损耗是否改变**

**不改变。** 因为 $|S'_{11}|=|S_{11}|=0$（更一般地，参考面移动只改变相位，
$|S'_{ii}|=|S_{ii}|$），而回波损耗
$L_r=-20\lg|S_{11}|$ **只依赖于模值**，故不变。

**物理意义**：参考面移动相当于在端口外接一段无耗传输线，
它只引入相移、不消耗功率，所以驻波比、回波损耗这类"功率比值"保持不变；
但 $S_{11}$ 的**相位**（以及器件的时延特性）会改变——
这就是为什么**测相位必须做参考面校准**。

> **注意**：本题 $S'_{12}=e^{-j84^\circ}$ 而原 $S_{12}=e^{-j30^\circ}$，
> **相位改变了 $54^\circ=\theta_1+\theta_2$** ✓，符合非对角元的相移规律。

**题 8**

**（1）幺正性方程**

**列模平方和 = 1**（取第 1 列）：

$$
|S_{11}|^{2}+|\alpha|^{2}+|\alpha|^{2}=1
\ \Longrightarrow\
\boxed{\;|S_{11}|^{2}+2|\alpha|^{2}=1\;}
\tag{A}
$$

**列正交**（第 1 列与第 2 列）：

$$
S_{11}^{*}\alpha+\alpha^{*}S_{11}+\alpha^{*}\alpha=0
\ \Longrightarrow\
\boxed{\;2\mathrm{Re}\left(S_{11}^{*}\alpha\right)+|\alpha|^{2}=0\;}
\tag{B}
$$

**（2）证明"三端口不可能全匹配"**

假设三个端口全部匹配：$S_{11}=S_{22}=S_{33}=0$。
代入 (A)：

$$
0+2|\alpha|^{2}=1\ \Longrightarrow\ |\alpha|^{2}=\frac{1}{2}
$$

代入 (B)：

$$
2\mathrm{Re}(0)+|\alpha|^{2}=0\ \Longrightarrow\ |\alpha|^{2}=0
$$

与 $|\alpha|^{2}=\frac{1}{2}$ **矛盾**！

**故假设不成立，互易无耗三端口网络不可能三个端口同时匹配。** ∎

> **【核心概念】**
> **更进一步**：由 (A)、(B) 可解出可行的参数。设 $S_{11}$ 与 $\alpha$ 同相
> （取 $\alpha$ 为实），由 (B)：$2|S_{11}||\alpha|+|\alpha|^{2}=0$，
> 若 $|\alpha|\ne0$ 则 $|S_{11}|=-\dfrac{|\alpha|}{2}<0$，矛盾；
> 故 $|\alpha|=0$ 而 $|S_{11}|=1$，或 $S_{11}$ 与 $\alpha$ **反相**
> （$\mathrm{Re}(S_{11}^{*}\alpha)=-|S_{11}||\alpha|$）。
> 后一情形：$-2|S_{11}||\alpha|+|\alpha|^{2}=0\Rightarrow|\alpha|=2|S_{11}|$，
> 代入 (A)：$|S_{11}|^{2}+8|S_{11}|^{2}=1\Rightarrow|S_{11}|=\dfrac{1}{3}$、
> $|\alpha|=\dfrac{2}{3}$。
> **这与 5.4.5 节例 5.4 的结论一致**：$|S_{11}|=1/3$、$|\alpha|=2/3$。
> （此时 $|\det[S]|=|S_{11}^{3}+2\alpha^{3}-3S_{11}\alpha^{2}|$ 可由幺正性保证为 1。）

**（3）非互易情形能否三端口全匹配**

**能。** 取理想**三端口环行器**：

$$
[S]=\begin{bmatrix}0&0&1\\1&0&0\\0&1&0\end{bmatrix}
$$

**验证幺正性**：

$$
[S]^{+}=\begin{bmatrix}0&1&0\\0&0&1\\1&0&0\end{bmatrix},\qquad
[S]^{+}[S]=\begin{bmatrix}0&1&0\\0&0&1\\1&0&0\end{bmatrix}
\begin{bmatrix}0&0&1\\1&0&0\\0&1&0\end{bmatrix}
=\begin{bmatrix}1&0&0\\0&1&0\\0&0&1\end{bmatrix}=[I]\ \checkmark
$$

**验证全匹配**：三个对角元 $S_{11}=S_{22}=S_{33}=0$ ✓。

**验证非互易**：$S_{12}=0\ne S_{21}=1$ ✓ 非互易。

**物理解读**：信号从端口 1 进入只能从端口 2 出来（$S_{21}=1$）、
从端口 2 进只能从 3 出、从 3 进只能从 1 出——**单向环行**。
代价是必须使用**铁氧体 + 直流偏置磁场**破坏互易性。

> **本题结论**：**"三端口全匹配"必须用非互易器件实现**。
> 这就是第六章要学的**环行器**与**隔离器**存在的根本理由。
